[-1]\n        if graph[u]:\n            v = graph[u].pop()\n            graph[v].remove(u)\n            stack.append(v)\n        else:\n            circuit.append(stack.pop())\n    return circuit[::-1]\n\nprint(find_euler_circuit(0, graph))", "py_scratch": "graph = {0:[1,2], 1:[0,2], 2:[0,1]}\n\ndef copy_graph(g):\n    new_g = {}\n    for k in g:\n        new_g[k] = list(g[k])\n    return new_g\n\ndef find_euler_circuit(start, graph):\n    g = copy_graph(graph)\n    stack = [start]\n    circuit = []\n    while len(stack) > 0:\n        u = stack[len(stack)-1]\n        if len(g[u]) > 0:\n            v = g[u].pop()\n            g[v].remove(u)\n            stack.append(v)\n        else:\n            circuit.append(stack.pop())\n    result = []\n    i = len(circuit) - 1\n    while i >= 0:\n        result.append(circuit[i])\n        i = i - 1\n    return result\n\nprint(find_euler_circuit(0, graph))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    unordered_map<int, vector<int>> graph = {{0,{1,2}},{1,{0,2}},{2,{0,1}}};\n    vector<int> stack_ = {0};\n    vector<int> circuit;\n    while (!stack_.empty()) {\n        int u = stack_.back();\n        if (!graph[u].empty()) {\n            int v = graph[u].back();\n            graph[u].pop_back();\n            auto it = find(graph[v].begin(), graph[v].end(), u);   // built-in find\n            graph[v].erase(it);\n            stack_.push_back(v);\n        } else {\n            circuit.push_back(u);\n            stack_.pop_back();\n        }\n    }\n    reverse(circuit.begin(), circuit.end());\n    for (int x : circuit) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int adj[3][3] = {{1,2,-1},{0,2,-1},{0,1,-1}};\n    int adjCount[3] = {2,2,2};\n    int stackArr[10]; int stackTop = 0;\n    stackArr[0] = 0;\n    int circuit[10]; int ccount = 0;\n    while (stackTop >= 0) {\n        int u = stackArr[stackTop];\n        bool found = false;\n        for (int i = 0; i < adjCount[u]; i++) {\n            int v = adj[u][i];\n            if (v != -1) {\n                adj[u][i] = -1;\n                for (int j = 0; j < adjCount[v]; j++) {\n                    if (adj[v][j] == u) { adj[v][j] = -1; break; }\n                }\n                stackArr[++stackTop] = v;\n                found = true;\n                break;\n            }\n        }\n        if (!found) {\n            circuit[ccount++] = u;\n            stackTop--;\n        }\n    }\n    for (int i = ccount-1; i >= 0; i--) cout << circuit[i] << \" \";\n}"}}, {"name": "Hamiltonian Path", "theory": "Finds a path that visits every NODE exactly once (unlike Euler path, which is about edges). No known polynomial algorithm exists (it's NP-complete in general); solved via backtracking that tries extending the current path with each unvisited neighbour, or via Bitmask DP (dp[mask][v] = can we visit exactly the nodes in mask, ending at v) for small graphs.", "when": "Small-graph exact-visit routing problems \u2014 closely related to the Travelling Salesman Problem (which additionally requires returning to start and minimising cost).", "best": "varies with pruning", "avg": "much less than n! with pruning", "worst": "O(n!) backtracking / O(2^n * n^2) bitmask DP", "space": "O(n) backtracking / O(2^n * n) bitmask DP", "code": {"py_bi": "graph = {0:[1,2], 1:[0,2,3], 2:[0,1,3], 3:[1,2]}\nn = 4\n\ndef has_hamiltonian_path():\n    def backtrack(path, visited):\n        if len(path) == n:\n            return True\n        for nb in graph[path[-1]]:\n            if nb not in visited:\n                visited.add(nb)               # built-in set add\n                path.append(nb)\n                if backtrack(path, visited):\n                    return True\n                path.pop()\n                visited.remove(nb)\n        return False\n\n    for start in range(n):\n        if backtrack([start], {start}):\n            return True\n    return False\n\nprint(has_hamiltonian_path())", "py_scratch": "graph = {0:[1,2], 1:[0,2,3], 2:[0,1,3], 3:[1,2]}\nn = 4\n\ndef backtrack(path, visited):\n    if len(path) == n:\n        return True\n    last = path[len(path)-1]\n    for nb in graph[last]:\n        if nb not in visited:\n            visited[nb] = True\n            path.append(nb)\n            if backtrack(path, visited):\n                return True\n            path.pop()\n            del visited[nb]\n    return False\n\ndef has_hamiltonian_path():\n    for start in range(n):\n        visited = {start: True}\n        if backtrack([start], visited):\n            return True\n    return False\n\nprint(has_hamiltonian_path())", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nunordered_map<int, vector<int>> graph = {{0,{1,2}},{1,{0,2,3}},{2,{0,1,3}},{3,{1,2}}};\nint n = 4;\nbool backtrack(vector<int>& path, unordered_set<int>& visited) {\n    if ((int)path.size() == n) return true;\n    for (int nb : graph[path.back()]) {\n        if (!visited.count(nb)) {\n            visited.insert(nb);              // built-in set insert\n            path.push_back(nb);\n            if (backtrack(path, visited)) return true;\n            path.pop_back();\n            visited.erase(nb);\n        }\n    }\n    return false;\n}\nint main() {\n    bool found = false;\n    for (int start = 0; start < n && !found; start++) {\n        vector<int> path = {start};\n        unordered_set<int> visited = {start};\n        if (backtrack(path, visited)) found = true;\n    }\n    cout << found << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint graph[4][3] = {{1,2,-1},{0,2,3},{0,1,3},{1,2,-1}};\nint n = 4;\nbool backtrack(int path[], int pathLen, bool visited[]) {\n    if (pathLen == n) return true;\n    int last = path[pathLen-1];\n    for (int i = 0; i < 3; i++) {\n        int nb = graph[last][i];\n        if (nb == -1) continue;\n        if (!visited[nb]) {\n            visited[nb] = true;\n            path[pathLen] = nb;\n            if (backtrack(path, pathLen+1, visited)) return true;\n            visited[nb] = false;\n        }\n    }\n    return false;\n}\nint main() {\n    bool found = false;\n    for (int start = 0; start < n && !found; start++) {\n        bool visited[4] = {false};\n        visited[start] = true;\n        int path[4]; path[0] = start;\n        if (backtrack(path, 1, visited)) found = true;\n    }\n    cout << found << endl;\n}"}}]}, {"num": "19", "title": "Trie", "techniques": [{"name": "Insert (Trie)", "theory": "Adds a word to the trie by walking from the root one character at a time, creating a new child node whenever the required character edge doesn't yet exist, and marking the final node as a word-end \u2014 shared prefixes between words automatically reuse existing nodes, which is the trie's core space-saving property.", "when": "Building a dictionary/prefix structure incrementally as words arrive \u2014 the foundational trie operation everything else builds on.", "best": "O(L) \u2014 L = word length", "avg": "O(L)", "worst": "O(L)", "space": "O(total characters across all inserted words)", "code": {"py_bi": "class TrieNode:\n    def __init__(self):\n        self.children = {}          # built-in dict\n        self.is_end = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            if ch not in node.children:\n                node.children[ch] = TrieNode()\n            node = node.children[ch]\n        node.is_end = True\n\nt = Trie()\nt.insert(\"apple\")\nt.insert(\"app\")\nprint(t.root.children[\"a\"].children[\"p\"].children[\"p\"].is_end)", "py_scratch": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\ndef make_trie():\n    return TrieNode()\n\ndef insert(root, word):\n    node = root\n    i = 0\n    while i < len(word):\n        ch = word[i]\n        if ch not in node.children:\n            node.children[ch] = TrieNode()\n        node = node.children[ch]\n        i = i + 1\n    node.is_end = True\n\nroot = make_trie()\ninsert(root, \"apple\")\ninsert(root, \"app\")\nprint(root.children[\"a\"].children[\"p\"].children[\"p\"].is_end)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nstruct TrieNode {\n    unordered_map<char, TrieNode*> children;   // built-in hash map\n    bool isEnd = false;\n};\nvoid insertWord(TrieNode* root, string word) {\n    TrieNode* node = root;\n    for (char ch : word) {\n        if (!node->children.count(ch)) node->children[ch] = new TrieNode();\n        node = node->children[ch];\n    }\n    node->isEnd = true;\n}\nint main() {\n    TrieNode* root = new TrieNode();\n    insertWord(root, \"apple\");\n    insertWord(root, \"app\");\n    cout << root->children['a']->children['p']->children['p']->isEnd << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nstruct TrieNode {\n    TrieNode* children[26];\n    bool isEnd;\n};\nTrieNode* newNode() {\n    TrieNode* node = new TrieNode();\n    node->isEnd = false;\n    for (int i = 0; i < 26; i++) node->children[i] = nullptr;\n    return node;\n}\nvoid insertWord(TrieNode* root, string word) {\n    TrieNode* node = root;\n    for (char ch : word) {\n        int idx = ch - 'a';\n        if (node->children[idx] == nullptr) node->children[idx] = newNode();\n        node = node->children[idx];\n    }\n    node->isEnd = true;\n}\nint main() {\n    TrieNode* root = newNode();\n    insertWord(root, \"apple\");\n    insertWord(root, \"app\");\n    TrieNode* n = root->children['a'-'a']->children['p'-'a']->children['p'-'a'];\n    cout << n->isEnd << endl;\n}"}}, {"name": "Search (Trie)", "theory": "Checks whether an exact word exists by walking the trie one character at a time; if any required character edge is missing, the word doesn't exist. Even if the full path exists, the word is only present if the final node is explicitly marked as a word-end (otherwis mory for nodes no longer needed by anything else.", "best": "O(L)", "avg": "O(L)", "worst": "O(L)", "space": "O(L) recursion stack", "code": {"py_bi": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\ndef insert(root, word):\n    node = root\n    for ch in word:\n        node = node.children.setdefault(ch, TrieNode())\n    node.is_end = True\n\ndef delete(node, word, depth=0):\n    if depth == len(word):\n        if not node.is_end:\n            return False\n        node.is_end = False\n        return len(node.children) == 0     # built-in len check\n    ch = word[depth]\n    if ch not in node.children:\n        return False\n    should_delete_child = delete(node.children[ch], word, depth+1)\n    if should_delete_child:\n        del node.children[ch]\n        return len(node.children) == 0 and not node.is_end\n    return False\n\nroot = TrieNode()\ninsert(root, \"apple\")\ninsert(root, \"app\")\ndelete(root, \"apple\")\nprint(\"apple\" in root.children)  # roundabout check", "py_scratch": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\ndef insert(root, word):\n    node = root\n    i = 0\n    while i < len(word):\n        ch = word[i]\n        if ch not in node.children:\n            node.children[ch] = TrieNode()\n        node = node.children[ch]\n        i = i + 1\n    node.is_end = True\n\ndef delete(node, word, depth):\n    if depth == len(word):\n        if node.is_end == False:\n            return False\n        node.is_end = False\n        return len(node.children) == 0\n    ch = word[depth]\n    if ch not in node.children:\n        return False\n    should_delete_child = delete(node.children[ch], word, depth + 1)\n    if should_delete_child:\n        del node.children[ch]\n        if len(node.children) == 0 and node.is_end == False:\n            return True\n        return False\n    return False\n\nroot = TrieNode()\ninsert(root, \"apple\")\ninsert(root lse;\n        node->isEnd = false;\n        return node->childCount == 0;\n    }\n    int idx = word[depth] - 'a';\n    if (node->children[idx] == nullptr) return false;\n    bool shouldDelete = deleteWord(node->children[idx], word, depth+1);\n    if (shouldDelete) {\n        node->children[idx] = nullptr;\n        node->childCount--;\n        return node->childCount == 0 && !node->isEnd;\n    }\n    return false;\n}\nint main() {\n    TrieNode* root = newNode();\n    insertWord(root, \"apple\");\n    insertWord(root, \"app\");\n    deleteWord(root, \"apple\", 0);\n    cout << root->childCount << endl;\n}"}}, {"name": "Prefix Search", "theory": "Checks whether ANY stored word begins with a given prefix, by walking the trie following the prefix's characters \u2014 if the full path exists (regardless of whether any node along it is marked as a word-end), the prefix is present. This is the key advantage of a trie over a hash set: prefix queries cost O(P) instead of scanning every stored word.", "when": "Autocomplete-style 'does anything start with X' queries, IP routing (longest prefix match), any feature requiring fast prefix membership testing.", "best": "O(P) \u2014 P = prefix length", "avg": "O(P)", "worst": "O(P)", "space": "O(1) extra", "code": {"py_bi": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            node = node.children.setdefault(ch, TrieNode())\n        node.is_end = True\n\n    def starts_with(self, prefix):\n        node = self.root\n        for ch in prefix:\n            if ch not in node.children:\n                return False\n            node = node.children[ch]\n        return True                    # built-in: reaching here means prefix exists\n\nt = Trie()\nt.insert(\"apple\")\nprint(t.starts_with(\"app\"), t.starts_with(\"appz\"))", "       if (node->children[idx] == nullptr) node->children[idx] = newNode();\n        node = node->children[idx];\n    }\n    node->isEnd = true;\n}\nbool startsWith(TrieNode* root, string prefix) {\n    TrieNode* node = root;\n    for (char ch : prefix) {\n        int idx = ch - 'a';\n        if (node->children[idx] == nullptr) return false;\n        node = node->children[idx];\n    }\n    return true;\n}\nint main() {\n    TrieNode* root = newNode();\n    insertWord(root, \"apple\");\n    cout << startsWith(root, \"app\") << \" \" << startsWith(root, \"appz\") << endl;\n}"}}, {"name": "Auto Complete", "theory": "Given a prefix, finds all stored words that begin with it: first walk the trie to the node representing the end of the prefix (as in Prefix Search), then run a DFS from that node collecting every word-end reachable below it, reconstructing each full word by tracking the path taken.", "when": "Search-box suggestions, IDE code completion, any 'show me all words starting with X' feature.", "best": "O(P + results)", "avg": "O(P + results)", "worst": "O(P + results)", "space": "O(results)", "code": {"py_bi": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            node = node.children.setdefault(ch, TrieNode())\n        node.is_end = True\n\n    def autocomplete(self, prefix):\n        node = self.root\n        for ch in prefix:\n            if ch not in node.children:\n                return []\n            node = node.children[ch]\n        results = []\n        def dfs(n, path):\n            if n.is_end:\n                results.append(prefix + path)     # built-in string concat\n            for ch, child in n.children.items():\n                dfs(child, path + ch)\n        dfs(node, \"\")\n        return results\n\nt = Trie()\nfor w in [\"app\", \"apple\", \"application\", \"apt\"]:\n    t.insert(w)\nprint(t.autocomplete(\"app\"))", "py_scratch": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\ndef insert(root, word):\n    node = root\n    i = 0\n    while i < len(word):\n        ch = word[i]\n        if ch not in node.children:\n            node.children[ch] = TrieNode()\n        node = node.children[ch]\n        i = i + 1\n    node.is_end = True\n\ndef autocomplete(root, prefix):\n    node = root\n    i = 0\n    while i < len(prefix):\n        ch = prefix[i]\n        if ch not in node.children:\n            return []\n        node = node.children[ch]\n        i = i + 1\n    results = []\n    def dfs(n, path):\n        if n.is_end:\n            results.append(prefix + path)\n        for ch in n.children:\n            dfs(n.children[ch], path + ch)\n    dfs(node, \"\")\n    return results\n\nroot = TrieNode()\nfor w in [\"app\", \"apple\", \"application\", \"apt\"]:\n    insert(root, w)\nprint(autocomplete(root, \"app\"))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nstruct TrieNode {\n    unordered_map<char, TrieNode*> children;\n    bool isEnd = false;\n};\nvoid insertWord(TrieNode* root, string word) {\n    TrieNode* node = root;\n    for (char ch : word) {\n        if (!node->children.count(ch)) node->children[ch] = new TrieNode();\n        node = node->children[ch];\n    }\n    node->isEnd = true;\n}\nvoid dfsCollect(TrieNode* node, string path, string prefix, vector<string>& results) {\n    if (node->isEnd) results.push_back(prefix + path);   // built-in string concat\n    for (auto& [ch, child] : node->children) dfsCollect(child, path+ch, prefix, results);\n}\nvector<string> autocomplete(TrieNode* root, string prefix) {\n    TrieNode* node = root;\n    for (char ch : prefix) {\n        if (!node->children.count(ch)) return {};\n        node = node->children[ch];\n    }\n    vector<string> results;\n    dfsCollect(node, \"\", prefix, results)  than characters.", "best": "O(n * B) \u2014 B = bit width", "avg": "O(n * B)", "worst": "O(n * B)", "space": "O(n * B)", "code": {"py_bi": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n\nBITS = 30\n\ndef insert(root, num):\n    node = root\n    for i in range(BITS, -1, -1):        # built-in range descending\n        bit = (num >> i) & 1\n        node = node.children.setdefault(bit, TrieNode())\n\ndef query_max_xor(root, num):\n    node = root\n    result = 0\n    for i in range(BITS, -1, -1):\n        bit = (num >> i) & 1\n        toggled = 1 - bit\n        if toggled in node.children:\n            result |= (1 << i)\n            node = node.children[toggled]\n        else:\n            node = node.children[bit]\n    return result\n\nnums = [3, 10, 5, 25, 2, 8]\nroot = TrieNode()\nfor n in nums:\n    insert(root, n)\nbest = max(query_max_xor(root, n) for n in nums)   # built-in max\nprint(best)", "py_scratch": "class TrieNode:\n    def __init__(self):\n        self.children = {}\n\nBITS = 30\n\ndef insert(root, num):\n    node = root\n    i = BITS\n    while i >= 0:\n        bit = (num >> i) & 1\n        if bit not in node.children:\n            node.children[bit] = TrieNode()\n        node = node.children[bit]\n        i = i - 1\n\ndef query_max_xor(root, num):\n    node = root\n    result = 0\n    i = BITS\n    while i >= 0:\n        bit = (num >> i) & 1\n        toggled = 1 - bit\n        if toggled in node.children:\n            result = result | (1 << i)\n            node = node.children[toggled]\n        else:\n            node = node.children[bit]\n        i = i - 1\n    return result\n\nnums = [3, 10, 5, 25, 2, 8]\nroot = TrieNode()\nfor n in nums:\n    insert(root, n)\nbest = 0\nfor n in nums:\n    x = query_max_xor(root, n)\n    if x > best:\n        best = x\nprint(best)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nconst int BITS = 30;\nstruct TrieNode { TrieNode* children[2] = {nullptr, nullptr}; };\nvoid insertNum(TrieNode* root, int num) {\n    TrieNode* node = root;\n    for (int i = BITS; i >= 0; i--) {\n        int bit = (num >> i) & 1;\n        if (!node->children[bit]) node->children[bit] = new TrieNode();\n        node = node->children[bit];\n    }\n}\nint queryMaxXor(TrieNode* root, int num) {\n    TrieNode* node = root;\n    int result = 0;\n    for (int i = BITS; i >= 0; i--) {\n        int bit = (num >> i) & 1;\n        int toggled = 1 - bit;\n        if (node->children[toggled]) { result |= (1<<i); node = node->children[toggled]; }  // built-in bit ops\n        else node = node->children[bit];\n    }\n    return result;\n}\nint main() {\n    vector<int> nums = {3,10,5,25,2,8};\n    TrieNode* root = new TrieNode();\n    for (int n : nums) insertNum(root, n);\n    int best = 0;\n    for (int n : nums) best = max(best, queryMaxXor(root, n));\n    cout << best << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nconst int BITS = 30;\nstruct TrieNode { TrieNode* children[2]; };\nTrieNode* newNode() {\n    TrieNode* node = new TrieNode();\n    node->children[0] = nullptr;\n    node->children[1] = nullptr;\n    return node;\n}\nvoid insertNum(TrieNode* root, int num) {\n    TrieNode* node = root;\n    for (int i = BITS; i >= 0; i--) {\n        int bit = (num >> i) & 1;\n        if (node->children[bit] == nullptr) node->children[bit] = newNode();\n        node = node->children[bit];\n    }\n}\nint queryMaxXor(TrieNode* root, int num) {\n    TrieNode* node = root;\n    int result = 0;\n    for (int i = BITS; i >= 0; i--) {\n        int bit = (num >> i) & 1;\n        int toggled = 1 - bit;\n        if (node->children[toggled] != nullptr) {\n            result = result | (1 << i);\n            node = node->children[toggled];\n        } else {\n            node = node->children[bit];\n        }\n    }\n    return result;\n}\nint main() {\n    int nums[] = {3,10,5,25,2,8};\n    int n = 6;\n    TrieNode* root = newNode();\n    for (int i = 0; i < n; i++) insertNum(root, nums[i]);\n    int best = 0;\n    for (int i = 0; i < n; i++) {\n        int x = queryMaxXor(root, nums[i]);\n        if (x > best) best = x;\n    }\n    cout << best << endl;\n}"}}]}, {"num": "20", "title": "Bit Manipulation", "techniques": [{"name": "AND, OR, XOR", "theory": "The three core bitwise operators: AND (&) sets a bit only if both operands have it set (used for masking/extracting bits); OR (|) sets a bit if either operand has it (used for combining/setting bits); XOR (^) sets a bit if exactly one operand has it (used for toggling bits, and has the unique self-cancelling property that x^x=0 and x^0=x).", "when": "AND for masking/checking specific bits; OR for setting/combining flags; XOR for toggling bits, swapping without a temp variable, or finding a unique element among duplicates (via the self-cancelling property).", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "a, b = 12, 10   # 1100, 1010\nprint(a & b)     # built-in AND -> 1000 = 8\nprint(a | b)     # built-in OR  -> 1110 = 14\nprint(a ^ b)     # built-in XOR -> 0110 = 6", "py_scratch": "a = 12\nb = 10\n\ndef bitwise_and(x, y):\n    result = 0\n    bit = 1\n    while x > 0 or y > 0:\n        if (x % 2 == 1) and (y % 2 == 1):\n            result += bit\n        x //= 2\n        y //= 2\n        bit *= 2\n    return result\n\ndef bitwise_or(x, y):\n    result = 0\n    bit = 1\n    while x > 0 or y > 0:\n        if (x % 2 == 1) or (y % 2 == 1):\n            result += bit\n        x //= 2\n        y //= 2\n        bit *= 2\n    return result\n\ndef bitwise_xor(x, y):\n    result = 0\n    bit = 1\n    while x > 0 or y > 0:\n        if (x % 2) != (y % 2):\n            result += bit\n        x //= 2\n        y //= 2\n        bit *= 2\n    return result\n\nprint(bitwise_and(a, b), bitwise_or(a, b), bitwise_xor(a, b))", "cpp_bi": "#include <iostream>\nusing namespace std;\nint main() {\n    int a = 12, b = 10;\n    cout << (a & b) << \" \" << (a | b) << \" \" << (a ^ b) << endl;   // built-in bitwise ops\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint bitwiseAnd(int x, int y) {\n    int result = 0, bit = 1;\n    while (x > 0 || y > 0) {\n        if ((x % 2 == 1) && (y % 2 == 1)) result += bit;\n        x /= 2; y /= 2; bit *= 2;\n    }\n    return result;\n}\nint bitwiseOr(int x, int y) {\n    int result = 0, bit = 1;\n    while (x > 0 || y > 0) {\n        if ((x % 2 == 1) || (y % 2 == 1)) result += bit;\n        x /= 2; y /= 2; bit *= 2;\n    }\n    return result;\n}\nint bitwiseXor(int x, int y) {\n    int result = 0, bit = 1;\n    while (x > 0 || y > 0) {\n        if ((x % 2) != (y % 2)) result += bit;\n        x /= 2; y /= 2; bit *= 2;\n    }\n    return result;\n}\nint main() {\n    int a = 12, b = 10;\n    cout << bitwiseAnd(a,b) << \" \" << bitwiseOr(a,b) << \" \" << bitwiseXor(a,b) << endl;\n}"}}, {"name": "Left Shift / Right Shift", "theory": "Left shift (x << k) multiplies x by 2^k by inserting k zero bits from the right; right shift (x >> k) divides x by 2^k (rounding toward negative infinity for signed arithmetic shift) by removing the k rightmost bits. Both are O(1) hardware operations, making them far faster than actual multiplication/division by powers of two.", "when": "Fast multiplication/division by powers of two, constructing bitmasks (1 << k isolates bit k), and packing/unpacking bit-level data.", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "x = 5\nprint(x << 3)    # built-in left shift -> 5 * 8 = 40\nprint(40 >> 2)   # built-in right shift -> 40 / 4 = 10", "py_scratch": "def left_shift(x, k):\n    result = x\n    i = 0\n    while i < k:\n        result = result * 2\n        i = i + 1\n    return result\n\ndef right_shift(x, k):\n    result = x\n    i = 0\n    while i < k:\n        result = result // 2\n        i = i + 1\n    return result\n\nprint(left_shift(5, 3))\nprint(right_shift(40, 2))", "cpp_bi": "#include <iostream>\nusing namespace std;\nint main() {\n    int x = 5;\n    cout << (x << 3) << endl;    // built-in left shift\n    cout << (40 >> 2) << endl;   // built-in right shift\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint leftShift(int x, int k) {\n    int result = x;\n    for (int i = 0; i < k; i++) result = result * 2;\n    return result;\n}\nint rightShift(int x, int k) {\n    int result = x;\n    for (int i = 0; i < k; i++) result = result / 2;\n    return result;\n}\nint main() {\n    cout << leftShift(5, 3) << endl;\n    cout << rightShift(40, 2) << endl;\n}"}}, {"name": "Set Bit", "theory": "Sets a specific bit position to 1 using OR with a mask that has only that bit set: x | (1 << k) \u2014 leaves every other bit unchanged since OR with 0 is a no-op, while OR with 1 forces that position to 1 regardless of its previous value.", "when": "Marking a flag/feature as enabled in a bitmask, adding an element to a bitmask-represented set.", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "x = 0b1010   # 10\nk = 2\nresult = x | (1 << k)     # built-in bit literal + shift + OR\nprint(bin(result))        # built-in bin() for display -> 0b1110", "py_scratch": "x = 10  # binary 1010\nk = 2\n\ndef set_bit(num, pos):\n    mask = 1\n    i = 0\n    while i < pos:\n        mask = mask * 2\n        i = i + 1\n    return num | mask\n\nresult = set_bit(x, k)\nprint(result)", "cpp_bi": "#include <iostream>\nusing namespace std;\nint main() {\n    int x = 0b1010;   // built-in binary literal\n    int k = 2;\n    int result = x | (1 << k);\n    cout << result << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint setBit(int num, int pos) {\n    int mask = 1;\n    for (int i = 0; i < pos; i++) mask = mask * 2;\n    return num | mask;\n}\nint main() {\n    int x = 10;\n    int k = 2;\n    cout << setBit(x, k) << endl;\n}"}}, {"name": "Clear Bit", "theory": "Clears (sets to 0) a specific bit position using AND with a mask that has every bit set to 1 EXCEPT that position: x & ~(1 << k) \u2014 AND with 1 preserves the bit, AND with 0 forces it to 0, leaving all other bits untouched.", "when": "Disabling a flag/feature in a bitmask, removing an element from a bitmask-represented set.", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "x = 0b1110   # 14\nk = 2\nresult = x & ~(1 << k)     # built-in bitwise NOT + shift + AND\nprint(bin(result))         # -> 0b1010", "py_scratch": "x = 14  # binary 1110\nk = 2\n\ndef clear_bit(num, pos):\n    mask = 1\n    i = 0\n    while i < pos:\n        mask = mask * 2\n        i = i + 1\n    # simulate NOT within a fixed bit width (e.g. 8 bits) since Python ints are arbitrary precision\n    full_mask = 255\n    inverted = full_mask - mask\n    return num & inverted\n\nresult = clear_bit(x, k)\nprint(result)", "cpp_bi": "#include <iostream>\nusing namespace std;\nint main() {\n    int x = 0b1110;\n    int k = 2;\n    int result = x & ~(1 << k);   // built-in bitwise NOT\n    cout << result << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint clearBit(int num, int pos) {\n    int mask = 1;\n    for (int i = 0; i < pos; i++) mask = mask * 2;\n    int inverted = 255 - mask;   // simulate NOT within 8 bits\n    return num & inverted;\n}\nint main() {\n    int x = 14;\n    int k = 2;\n    cout << clearBit(x, k) << endl;\n}"}}, {"name": "Toggle Bit", "theory": "Flips a specific bit position (0 becomes 1, 1 becomes 0) using XOR with a mask that has only that bit set: x ^ (1 << k) \u2014 XOR with 1 flips the bit, XOR with 0 leaves other bits unchanged.", "when": "Flipping a flag's state without checking its current value first, implementing bit-based toggles (e.g. light switches, visited markers reused across iterations).", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "x = 0b1010   # 10\nk = 0\nresult = x ^ (1 << k)     # built-in XOR toggles the bit\nprint(bin(result))        # -> 0b1011 (bit 0 flipped from 0 to 1)", "py_scratch": "x = 10  # binary 1010\nk = 0\n\ndef toggle_bit(num, pos):\n    mask = 1\n    i = 0\n    while i < pos:\n        mask = mask * 2\n        i = i + 1\n    # manual XOR via bit-by-bit comparison isn't needed; use direct arithmetic toggle:\n    if (num // mask) % 2 == 1:\n        return num - mask\n    else:\n        return num + mask\n\nresult = toggle_bit(x, k)\nprint(result)", "cpp_bi": "#include <iostream>\nusing namespace std;\nint main() {\n    int x = 0b1010;\n    int k = 0;\n    int result = x ^ (1 << k);    // built-in XOR\n    cout << result << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint toggleBit(int num, int pos) {\n    int mask = 1;\n    for (int i = 0; i < pos; i++) mask = mask * 2;\n    if ((num / mask) % 2 == 1) return num - mask;\n    else return num + mask;\n}\nint main() {\n    int x = 10;\n    int k = 0;\n    cout << toggleBit(x, k) << endl;\n}"}}, {"name": "Count Set Bits", "theory": "Counts how many bits are 1 in a number's binary representation, either by checking each bit position one at a time (O(log n)), or far more efficiently using Brian Kernighan's trick which clears the lowest set bit each iteration, running once per SET bit rather than once per bit position.", "when": "Popcount queries \u2014 Hamming weight/distance calculations, subset-size checks in bitmask DP, parity computations.", "best": "O(popcount) with Kernighan's trick", "avg": "O(log n) naive / O(popcount) optimized", "worst": "O(log n) / O(popcount)", "space": "O(1)", "code": {"py_bi": "x = 29   # binary 11101\nprint(bin(x).count(\"1\"))     # built-in bin() + count()", "py_scratch": "x = 29\n\ndef count_set_bits(num):\n    count = 0\n    while num > 0:\n        count = count + (num % 2)\n        num = num // 2\n    return count\n\nprint(count_set_bits(x))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int x = 29;\n    cout << __builtin_popcount(x) << endl;   // built-in GCC popcount intrinsic\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint countSetBits(int num) {\n    int count = 0;\n    while (num > 0) {\n        count += (num % 2);\n        num /= 2;\n    }\n    return count;\n}\nint main() {\n    int x = 29;\n    cout << countSetBits(x) << endl;\n}"}}, {"name": "Brian Kernighan's Algorithm", "theory": "An efficient popcount technique: x & (x-1) clears the LOWEST set bit of x (since x-1 flips all bits from the lowest set bit downward, and ANDing with x then zeroes exactly that bit and everything below). Repeating this and counting iterations until x becomes 0 counts the set bits in O(popcount) time rather than O(bit-width).", "when": "Popcount when the number of set bits is expected to be much smaller than the bit width, or as a general technique to iterate over/strip set bits one at a time.", "best": "O(1)", "avg": "O(popcount)", "worst": "O(bit width)", "space": "O(1)", "code": {"py_bi": "def count_set_bits(x):\n    count = 0\n    while x:                    # built-in truthiness (non-zero)\n        x &= x - 1               # clears the lowest set bit\n        count += 1\n    return count\n\nprint(count_set_bits(29))       # 11101 -> 4 set bits", "py_scratch": "def count_set_bits(x):\n    count = 0\n    while x != 0:\n        x = x & (x - 1)\n        count = count + 1\n    return count\n\nprint(count_set_bits(29))", "cpp_bi": "#include <iostream>\nusing namespace std;\nint countSetBits(int x) {\n    int count = 0;\n    while (x) {              // built-in truthiness\n        x &= (x - 1);\n        count++;\n    }\n    return count;\n}\nint main() { cout << countSetBits(29) << endl; }", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint countSetBits(int x) {\n    int count = 0;\n    while (x != 0) {\n        x = x & (x - 1);\n        count = count + 1;\n    }\n    return count;\n}\nint main() { cout << countSetBits(29) << endl; }"}}, {"name": "Power of Two", "theory": "Checks whether a number is a power of two using the bit trick x & (x-1) == 0: a power of two has exactly one bit set, and subtracting 1 flips that bit and all bits below it to produce a value with no overlapping set bits \u2014 ANDing them gives zero only in that case (also requires x > 0, since 0 would incorrectly pass the AND check).", "when": "Fast power-of-two checks \u2014 validating buffer/array sizes, hash table capacity checks, or as a subroutine in bit-manipulation algorithms.", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "def is_power_of_two(x):\n    return x > 0 and (x & (x - 1)) == 0    # built-in bitwise trick\n\nprint(is_power_of_two(16), is_power_of_two(18))", "py_scratch": "def is_power_of_two(x):\n    if x <= 0:\n        return False\n    while x % 2 == 0:\n        x = x // 2\n    return x == 1\n\nprint(is_power_of_two(16), is_power_of_two(18))", "cpp_bi": "#include <iostream>\nusing namespace std;\nbool isPowerOfTwo(int x) {\n    return x > 0 && (x & (x - 1)) == 0;   // built-in bitwise trick\n}\nint main() { cout << isPowerOfTwo(16) << \" \" << isPowerOfTwo(18) << endl; }", "cpp_scratch": "#include <iostream>\nusing namespace std;\nbool isPowerOfTwo(int x) {\n    if (x <= 0) return false;\n    while (x % 2 == 0) x = x / 2;\n    return x == 1;\n}\nint main() { cout << isPowerOfTwo(16) << \" \" << isPowerOfTwo(18) << endl; }"}}, {"name": "Power Set Generation", "theory": "Generates all 2^n subsets of a set by iterating every integer mask from 0 to 2^n - 1, and for each mask, including element i in the subset if bit i of the mask is set \u2014 a direct bijection between subsets and n-bit binary numbers, giving a simple non-recursive alternative to backtracking-based subset generation.", "when": "Enumerating all subsets of a small set (n <= ~20) \u2014 brute-force search over subset space, complementary to the recursive backtracking approach in Section 12.", "best": "O(n * 2^n)", "avg": "O(n * 2^n)", "worst": "O(n * 2^n)", "space": "O(2^n) for storing all subsets", "code": {"py_bi": "arr = [1, 2, 3]\nn = len(arr)\npower_set = []\nfor mask in range(1 << n):        # built-in bit shift range\n    subset = [arr[i] for i in range(n) if mask & (1 << i)]\n    power_set.append(subset)\nprint(power_set)", "py_scratch": "arr = [1, 2, 3]\nn = len(arr)\npower_set = []\nmask = 0\nwhile mask < (1 << n):\n    subset = []\n    i = 0\n    while i < n:\n        if mask & (1 << i):\n            subset.append(arr[i])\n        i = i + 1\n    power_set.append(subset)\n    mask = mask + 1\nprint(power_set)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {1,2,3};\n    int n = arr.size();\n    vector<vector<int>> powerSet;\n    for (int mask = 0; mask < (1<<n); mask++) {   // built-in bit shift\n        vector<int> subset;\n        for (int i = 0; i < n; i++) if (mask & (1<<i)) subset.push_back(arr[i]);\n        powerSet.push_back(subset);\n    }\n    for (auto& s : powerSet) { for (int x : s) cout << x << \" \"; cout << \"| \"; }\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {1,2,3};\n    int n = 3;\n    for (int mask = 0; mask < (1<<n); mask++) {\n        for (int i = 0; i < n; i++) {\n            if (mask & (1<<i)) cout << arr[i] << \" \";\n        }\n        cout << \"| \";\n    }\n}"}}, {"name": "Bitmask DP (as a bit-manipulation technique)", "theory": "Uses an integer bitmask as a DP state's index to represent which elements of a small set have been used/visited \u2014 subset union (mask | (1<<i)), membership test (mask & (1<<i)), and full-set check (mask == (1<<n)-1) are all O(1) bit operations, enabling exponential-state DP to be implemented with plain array indexing rather than sets or hash maps. See Section 17's Bitmask DP entry for a full worked example (Travelling Salesman).", "when": "See Section 17 (Dynamic Programming) \u2014 this entry exists here specifically to catalogue it as a core BIT-MANIPUL simplicity).", "when": "One-time setup before performing range queries and/or point updates on a static or dynamic array \u2014 the segment tree's build step.", "best": "O(n)", "avg": "O(n)", "worst": "O(n)", "space": "O(n)", "code": {"py_bi": "arr = [1, 3, 5, 7, 9, 11]\nn = len(arr)\ntree = [0] * (4 * n)          # built-in list allocation\n\ndef build(node, start, end):\n    if start == end:\n        tree[node] = arr[start]\n        return\n    mid = (start + end) // 2\n    build(2*node, start, mid)\n    build(2*node+1, mid+1, end)\n    tree[node] = tree[2*node] + tree[2*node+1]\n\nbuild(1, 0, n-1)\nprint(tree[1])   # root holds sum of entire array", "py_scratch": "arr = [1, 3, 5, 7, 9, 11]\nn = len(arr)\ntree = []\ni = 0\nwhile i < 4 * n:\n    tree.append(0)\n    i = i + 1\n\ndef build(node, start, end):\n    if start == end:\n        tree[node] = arr[start]\n        return\n    mid = (start + end) // 2\n    build(2*node, start, mid)\n    build(2*node+1, mid+1, end)\n    tree[node] = tree[2*node] + tree[2*node+1]\n\nbuild(1, 0, n-1)\nprint(tree[1])", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> arr = {1,3,5,7,9,11};\nvector<int> tree;\nvoid build(int node, int start, int end) {\n    if (start == end) { tree[node] = arr[start]; return; }\n    int mid = (start+end)/2;\n    build(2*node, start, mid);\n    build(2*node+1, mid+1, end);\n    tree[node] = tree[2*node] + tree[2*node+1];\n}\nint main() {\n    int n = arr.size();\n    tree.assign(4*n, 0);          // built-in vector assign\n    build(1, 0, n-1);\n    cout << tree[1] << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[] = {1,3,5,7,9,11};\nint n = 6;\nint tree[24];\nvoid build(int node, int start, int end) {\n    if (start == end) {\n        tree[node] = arr[start];\n        return;\n    }\n    int mid = (start + end) / 2;\n    build(2*node, start, mid);\n    build(2*node+1, mid+1, end);\n    tree[node] = tree[2*node] + tree[2*node+1];\n}\nint main() {\n  queries'.", "best": "O(log n) per update/query", "avg": "O(log n)", "worst": "O(log n)", "space": "O(n)", "code": {"py_bi": "arr = [1, 3, 5, 7, 9, 11]\nn = len(arr)\ntree = [0] * (4*n)\nlazy = [0] * (4*n)          # built-in list for pending updates\n\ndef build(node, start, end):\n    if start == end:\n        tree[node] = arr[start]; return\n    mid = (start+end)//2\n    build(2*node, start, mid); build(2*node+1, mid+1, end)\n    tree[node] = tree[2*node] + tree[2*node+1]\n\ndef push_down(node, start, end):\n    if lazy[node] != 0:\n        mid = (start+end)//2\n        for child, cs, ce in [(2*node, start, mid), (2*node+1, mid+1, end)]:\n            tree[child] += lazy[node] * (ce - cs + 1)\n            lazy[child] += lazy[node]\n        lazy[node] = 0\n\ndef range_update(node, start, end, l, r, val):\n    if r < start or end < l:\n        return\n    if l <= start and end <= r:\n        tree[node] += val * (end - start + 1)\n        lazy[node] += val\n        return\n    push_down(node, start, end)\n    mid = (start+end)//2\n    range_update(2*node, start, mid, l, r, val)\n    range_update(2*node+1, mid+1, end, l, r, val)\n    tree[node] = tree[2*node] + tree[2*node+1]\n\nbuild(1, 0, n-1)\nrange_update(1, 0, n-1, 1, 3, 10)\nprint(tree[1])", "py_scratch": "arr = [1, 3, 5, 7, 9, 11]\nn = len(arr)\ntree = [0] * (4*n)\nlazy = [0] * (4*n)\n\ndef build(node, start, end):\n    if start == end:\n        tree[node] = arr[start]\n        return\n    mid = (start + end) // 2\n    build(2*node, start, mid)\n    build(2*node+1, mid+1, end)\n    tree[node] = tree[2*node] + tree[2*node+1]\n\ndef push_down(node, start, end):\n    if lazy[node] != 0:\n        mid = (start + end) // 2\n        left_len = mid - start + 1\n        right_len = end - mid\n        tree[2*node] = tree[2*node] + lazy[node] * left_len\n        lazy[2*node] = lazy[2*node] + lazy[node]\n        tree[2*node+1] = tree[2*node+1] + lazy[node] * right_len\n        lazy[2*node+1] = lazy[2*node+1] + lazy[node]\n        lazy[node] = 0\n\ndef range_update(node, start, end, l, r, val):\n    if r < start or end < l:\n        return\n    if l <= start and end <= r:\n        tree[node] = tree[node] + val * (end - start + 1)\n        lazy[node] = lazy[node] + val\n        return\n    push_down(node, start, end)\n    mid = (start + end) // 2\n    range_update(2*node, start, mid, l, r, val)\n    range_update(2*node+1, mid+1, end, l, r, val)\n    tree[node] = tree[2*node] + tree[2*node+1]\n\nbuild(1, 0, n-1)\nrange_update(1, 0, n-1, 1, 3, 10)\nprint(tree[1])", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> arr = {1,3,5,7,9,11};\nvector<long long> tree, lazy;\nvoid build(int node, int start, int end) {\n    if (start == end) { tree[node] = arr[start]; return; }\n    int mid = (start+end)/2;\n    build(2*node, start, mid); build(2*node+1, mid+1, end);\n    tree[node] = tree[2*node] + tree[2*node+1];\n}\nvoid pushDown(int node, int start, int end) {\n    if (lazy[node] != 0) {\n        int mid = (start+end)/2;\n        tree[2*node] += lazy[node] * (mid-start+1);          // built-in propagation\n        lazy[2*node] += lazy[node];\n        tree[2*node+1] += lazy[node] * (end-mid);\n        lazy[2*node+1] += lazy[node];\n        lazy[node] = 0;\n    }\n}\nvoid rangeUpdate(int node, int start, int end, int l, int r, int val) {\n    if (r < start || end < l) return;\n    if (l <= start && end <= r) {\n        tree[node] += (long long)val * (end-start+1);\n        lazy[node] += val;\n        return;\n    }\n    pushDown(node, start, end);\n    int mid = (start+end)/2;\n    rangeUpdate(2*node, start, mid, l, r, val);\n    rangeUpdate(2*node+1, mid+1, end, l, r, val);\n    tree[node] = tree[2*node] + tree[2*node+1];\n}\nint main() {\n    int n = arr.size();\n    tree.assign(4*n, 0); lazy.assign(4*n, 0);\n    build(1, 0, n-1);\n    rangeUpdate(1, 0, n-1, 1, 3, 10);\n    cout << tree[1] << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[] = al;\n}\nint rangeSum(int l, int r) {\n    return prefixSum(r) - prefixSum(l-1);      // built-in subtraction\n}\nint main() {\n    bit.assign(n+1, 0);\n    vector<int> values = {3,2,-1,6,5,4,-3,3};\n    for (int i = 0; i < n; i++) update(i+1, values[i]);\n    cout << rangeSum(2, 5) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint n = 8;\nint bit[9];\nint lowbit(int x) { return x & (-x); }\nvoid update(int i, int delta) {\n    while (i <= n) {\n        bit[i] = bit[i] + delta;\n        i = i + lowbit(i);\n    }\n}\nint prefixSum(int i) {\n    int total = 0;\n    while (i > 0) {\n        total = total + bit[i];\n        i = i - lowbit(i);\n    }\n    return total;\n}\nint rangeSum(int l, int r) {\n    return prefixSum(r) - prefixSum(l - 1);\n}\nint main() {\n    for (int i = 0; i <= n; i++) bit[i] = 0;\n    int values[] = {3,2,-1,6,5,4,-3,3};\n    for (int i = 0; i < n; i++) update(i+1, values[i]);\n    cout << rangeSum(2, 5) << endl;\n}"}}, {"name": "Inversion Count", "theory": "Counts the number of pairs (i, j) with i < j but arr[i] > arr[j] by processing the array right-to-left (or after coordinate-compressing values), using a Fenwick Tree to track how many smaller elements have been seen so far: querying the prefix sum up to arr[i]-1 gives the count of already-seen elements smaller than the current one, which are inversions with it.", "when": "Measuring 'how unsorted' an array is, or as a subroutine that counts inversions in O(n log n) instead of the naive O(n^2) pairwise comparison \u2014 also usable as an alternative inversion-counting method to Merge Sort's built-in count.", "best": "O(n log n)", "avg": "O(n log n)", "worst": "O(n log n)", "space": "O(n)", "code": {"py_bi": "arr = [2, 4, 1, 3, 5]\nn = len(arr)\nbit = [0] * (n + 1)\n\ndef update(i, delta):\n    while i <= n:\n        bit[i] += delta\n        i += i & (-i)\n\ndef prefix_sum(i):\n    total = 0\n    while i > 0:\n        total += bit[i]\n        i -= i & (-i)\n    return

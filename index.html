\n}"}}]}, {"num": "23", "title": "Sparse Table", "techniques": [{"name": "RMQ (Range Minimum Query)", "theory": "Precomputes the minimum over every range whose length is a power of two, starting from single elements and doubling: sparse[k][i] = min over [i, i+2^k). A query for an arbitrary range [l,r] is answered in O(1) by taking the min of two overlapping power-of-two-length ranges that together cover [l,r] \u2014 overlap is fine because min is idempotent (repeating an element doesn't change the min).", "when": "Static arrays (no updates) needing very fast repeated range-minimum queries \u2014 trades O(n log n) preprocessing and space for O(1) queries, faster than a segment tree's O(log n) when updates are never needed.", "best": "O(n log n) build, O(1) query", "avg": "O(1) query", "worst": "O(1) query", "space": "O(n log n)", "code": {"py_bi": "import math\narr = [7, 2, 3, 0, 5, 10, 3, 12, 18]\nn = len(arr)\nLOG = int(math.log2(n)) + 1     # built-in math.log2\nsparse = [[0]*n for _ in range(LOG)]\nsparse[0] = arr[:]\nfor k in range(1, LOG):\n    for i in range(n - (1 << k) + 1):\n        sparse[k][i] = min(sparse[k-1][i], sparse[k-1][i + (1 << (k-1))])\n\ndef query(l, r):                  # inclusive range\n    k = int(math.log2(r - l + 1))\n    return min(sparse[k][l], sparse[k][r - (1 << k) + 1])\n\nprint(query(1, 5))", "py_scratch": "arr = [7, 2, 3, 0, 5, 10, 3, 12, 18]\nn = len(arr)\n\ndef log2_floor(x):\n    result = 0\n    while (1 << (result + 1)) <= x:\n        result = result + 1\n    return result\n\nLOG = log2_floor(n) + 1\nsparse = []\nfor k in range(LOG):\n    row = [0] * n\n    sparse.append(row)\nfor i in range(n):\n    sparse[0][i] = arr[i]\n\nk = 1\nwhile k < LOG:\n    i = 0\n    while i + (1 << k) - 1 < n:\n        left = sparse[k-1][i]\n        right = sparse[k-1][i + (1 << (k-1))]\n        if left < right:\n            sparse[k][i] = left\n        else:\n            sparse[k][i] = right\n        i = i + 1\n    k = k + 1\n\ndef query(l, r):\n    length = r - l + 1\n    k = log2_floor(length)\n    a = sparse[k][l]\n    b = sparse[k][r - (1 << k) + 1]\n    if a < b:\n        return a\n    return b\n\nprint(query(1, 5))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {7,2,3,0,5,10,3,12,18};\n    int n = arr.size();\n    int LOG = log2(n) + 1;                 // built-in log2\n    vector<vector<int>> sparse(LOG, vector<int>(n));\n    sparse[0] = arr;\n    for (int k = 1; k < LOG; k++)\n        for (int i = 0; i + (1<<k) <= n; i++)\n            sparse[k][i] = min(sparse[k-1][i], sparse[k-1][i + (1<<(k-1))]);   // built-in min\n    auto query = [&](int l, int r) {\n        int k = log2(r - l + 1);\n        return min(sparse[k][l], sparse[k][r - (1<<k) + 1]);\n    };\n    cout << query(1, 5) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[] = {7,2,3,0,5,10,3,12,18};\nint n = 9;\nint sparse[5][9];\nint log2Floor(int x) {\n    int result = 0;\n    while ((1 << (result+1)) <= x) result++;\n    return result;\n}\nint main() {\n    int LOG = log2Floor(n) + 1;\n    for (int i = 0; i < n; i++) sparse[0][i] = arr[i];\n    for (int k = 1; k < LOG; k++) {\n        for (int i = 0; i + (1<<k) <= n; i++) {\n            int left = sparse[k-1][i];\n            int right = sparse[k-1][i + (1<<(k-1))];\n            sparse[k][i] = (left < right) ? left : right;\n        }\n    }\n    int l = 1, r = 5;\n    int length = r - l + 1;\n    int k = log2Floor(length);\n    int a = sparse[k][l];\n    int b = sparse[k][r - (1<<k) + 1];\n    cout << ((a < b) ? a : b) << endl;\n}"}}, {"name": "GCD Queries", "theory": "Applies the same sparse table structure as RMQ but combines with gcd() instead of min() \u2014 works because gcd, like min, is idempotent (gcd(x,x)=x), so overlapping power-of-two ranges can still be safely combined without double-counting.", "when": "Static arrays needing repeated range-GCD queries in O(1) \u2014 e.g. Euclidean-algorithm-based range queries in competitive programming.", "best": "O(n log n) build, O(1) query", "avg": "O(1) query", "worst": "O(1) query", "space": "O(n log n)", "code": {"py_bi": "import math\narr = [12, 8, 20, 16, 4, 6]\nn = len(arr)\nLOG = int(math.log2(n)) + 1\nsparse = [[0]*n for _ in range(LOG)]\nsparse[0] = arr[:]\nfor k in range(1, LOG):\n    for i in range(n - (1 << k) + 1):\n        sparse[k][i] = math.gcd(sparse[k-1][i], sparse[k-1][i + (1 << (k-1))])   # built-in gcd\n\ndef query(l, r):\n    k = int(math.log2(r - l + 1))\n    return math.gcd(sparse[k][l], sparse[k][r - (1 << k) + 1])\n\nprint(query(0, 3))", "py_scratch": "arr = [12, 8, 20, 16, 4, 6]\nn = len(arr)\n\ndef gcd(a, b):\n    while b != 0:\n        a, b = b, a % b\n    return a\n\ndef log2_floor(x):\n    result = 0\n    while (1 << (result + 1)) <= x:\n        result = result + 1\n    return result\n\nLOG = log2_floor(n) + 1\nsparse = []\nfor k in range(LOG):\n    row = [0] * n\n    sparse.append(row)\nfor i in range(n):\n    sparse[0][i] = arr[i]\n\nk = 1\nwhile k < LOG:\n    i = 0\n    while i + (1 << k) - 1 < n:\n        sparse[k][i] = gcd(sparse[k-1][i], sparse[k-1][i + (1 << (k-1))])\n        i = i + 1\n    k = k + 1\n\ndef query(l, r):\n    length = r - l + 1\n    k = log2_floor(length)\n    return gcd(sparse[k][l], sparse[k][r - (1 << k) + 1])\n\nprint(query(0, 3))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {12,8,20,16,4,6};\n    int n = arr.size();\n    int LOG = log2(n) + 1;\n    vector<vector<int>> sparse(LOG, vector<int>(n));\n    sparse[0] = arr;\n    for (int k = 1; k < LOG; k++)\n        for (int i = 0; i + (1<<k) <= n; i++)\n            sparse[k][i] = __gcd(sparse[k-1][i], sparse[k-1][i + (1<<(k-1))]);   // built-in __gcd\n    auto query = [&](int l, int r) {\n        int k = log2(r - l + 1);\n        return __gcd(sparse[k][l], sparse[k][r - (1<<k) + 1]);\n    };\n    cout << query(0, 3) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[] = {12,8,20,16,4,6};\nint n = 6;\nint sparse[4][6];\nint gcdVal(int a, int b) {\n    while (b != 0) {\n        int temp = b;\n        b = a % b;\n        a = temp;\n    }\n    return a;\n}\nint log2Floor(int x) {\n    int result = 0;\n    while ((1 << (result+1)) <= x) result++;\n    return result;\n}\nint main() {\n    int LOG = log2Floor(n) + 1;\n    for (int i = 0; i < n; i++) sparse[0][i] = arr[i];\n    for (int k = 1; k < LOG; k++) {\n        for (int i = 0; i + (1<<k) <= n; i++) {\n            sparse[k][i] = gcdVal(sparse[k-1][i], sparse[k-1][i + (1<<(k-1))]);\n        }\n    }\n    int l = 0, r = 3;\n    int length = r - l + 1;\n    int k = log2Floor(length);\n    cout << gcdVal(sparse[k][l], sparse[k][r - (1<<k) + 1]) << endl;\n}"}}, {"name": "Idempotent Queries (General)", "theory": "Describes the general class of range-query problems solvable in O(1) with a sparse table: any operation that is idempotent (combining overlapping ranges doesn't corrupt the result \u2014 op(x,x)=x) can use the same 'two overlapping power-of-two windows' trick as RMQ. This works for min, max, gcd, AND, OR \u2014 but NOT for sum or XOR, which double-count overlapping regions and require a genuinely non-overlapping decomposition (like a Fenwick/segment tree) instead.", "when": "Recognising whether a sparse table is even applicable \u2014 check that the combining operation is idempotent before reaching for this structure; use a segment tree/Fenwick tree instead for non-idempotent operations like sum.", "best": "O(n log n) build, O(1) query", "avg": "O(1) query", "worst": "O(1) query", "space": "O(n log n)", "code": {"py_bi": "import math\narr = [4, 12, 6, 8, 20]\nn = len(arr)\nLOG = int(math.log2(n)) + 1\n# Demonstrates the general pattern with bitwise AND (idempotent: x & x == x)\nsparse = [[0]*n for _ in range(LOG)]\nsparse[0] = arr[:]\nfor k in range(1, LOG):\n    for i in range(n - (1 << k) + 1):\n        sparse[k][i] = sparse[k-1][i] & sparse[k-1][i + (1 << (k-1))]   # built-in AND\n\ndef query_and(l, r):\n    k = int(math.log2(r - l + 1))\n    return sparse[k][l] & sparse[k][r - (1 << k) + 1]\n\nprint(query_and(1, 4))", "py_scratch": "arr = [4, 12, 6, 8, 20]\nn = len(arr)\n\ndef log2_floor(x):\n    result = 0\n    while (1 << (result + 1)) <= x:\n        result = result + 1\n    return result\n\nLOG = log2_floor(n) + 1\nsparse = []\nfor k in range(LOG):\n    row = [0] * n\n    sparse.append(row)\nfor i in range(n):\n    sparse[0][i] = arr[i]\n\nk = 1\nwhile k < LOG:\n    i = 0\n    while i + (1 << k) - 1 < n:\n        sparse[k][i] = sparse[k-1][i] & sparse[k-1][i + (1 << (k-1))]\n        i = i + 1\n    k = k + 1\n\ndef query_and(l, r):\n    length = r - l + 1\n    k = log2_floor(length)\n    return sparse[k][l] & sparse[k][r - (1 << k) + 1]\n\nprint(query_and(1, 4))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {4,12,6,8,20};\n    int n = arr.size();\n    int LOG = log2(n) + 1;\n    vector<vector<int>> sparse(LOG, vector<int>(n));\n    sparse[0] = arr;\n    for (int k = 1; k < LOG; k++)\n        for (int i = 0; i + (1<<k) <= n; i++)\n            sparse[k][i] = sparse[k-1][i] & sparse[k-1][i + (1<<(k-1))];   // built-in AND (idempotent)\n    auto queryAnd = [&](int l, int r) {\n        int k = log2(r - l + 1);\n        return sparse[k][l] & sparse[k][r - (1<<k) + 1];\n    };\n    cout << queryAnd(1, 4) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[] = {4,12,6,8,20};\nint n = 5;\nint sparse[4][5];\nint log2Floor(int x) {\n    int result = 0;\n    while ((1 << (result+1)) <= x) result++;\n    return result;\n}\nint main() {\n    int LOG = log2Floor(n) + 1;\n    for (int i = 0; i < n; i++) sparse[0][i] = arr[i];\n    for (int k = 1; k < LOG; k++) {\n        for (int i = 0; i + (1<<k) <= n; i++) {\n            sparse[k][i] = sparse[k-1][i] & sparse[k-1][i + (1<<(k-1))];\n        }\n    }\n    int l = 1, r = 4;\n    int length = r - l + 1;\n    int k = log2Floor(length);\n    cout << (sparse[k][l] & sparse[k][r - (1<<k) + 1]) << endl;\n}"}}]}, {"num": "24", "title": "Mathematics", "techniques": [{"name": "Euclidean Algorithm", "theory": "Computes the greatest common divisor of two numbers using the identity gcd(a,b) = gcd(b, a mod b), repeatedly replacing the pair until one becomes zero \u2014 at that point the other holds the GCD. Converges extremely fast (O(log(min(a,b))) steps) because the remainder at least halves every two steps in the worst case (Fibonacci numbers being the slowest-converging input).", "when": "Computing the greatest common divisor of two integers \u2014 the foundation for simplifying fractions, LCM computation, and modular inverse (via its extended form).", "best": "O(log(min(a,b)))", "avg": "O(log(min(a,b)))", "worst": "O(log(min(a,b)))", "space": "O(1) iterative, O(log(min(a,b))) recursive", "code": {"py_bi": "import math\nprint(math.gcd(48, 18))    # built-in gcd", "py_scratch": "def gcd(a, b):\n    while b != 0:\n        a, b = b, a % b\n    return a\n\nprint(gcd(48, 18))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() { cout << __gcd(48, 18) << endl; }   // built-in __gcd", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint gcd(int a, int b) {\n    while (b != 0) {\n        int temp = b;\n        b = a % b;\n        a = temp;\n    }\n    return a;\n}\nint main() { cout << gcd(48, 18) << endl; }"}}, {"name": "Extended Euclidean Algorithm", "theory": "Extends the Euclidean algorithm to also find integers x, y such that a*x + b*y = gcd(a,b) (Bezout's identity), by unwinding the recursion and back-substituting the remainder equations \u2014 these x, y coefficients are exactly what's needed to compute modular inverses when gcd(a,m)=1.", "when": "Computing modular inverses, solving linear Diophantine equations (ax + by = c), and other number-theoretic problems requiring the Bezout coefficients, not just the GCD value.", "best": "O(log(min(a,b)))", "avg": "O(log(min(a,b)))", "worst": "O(log(min(a,b)))", "space": "O(log(min(a,b))) recursive", "code": {"py_bi": "def extended_gcd(a, b):\n    if b == 0:\n        return a, 1, 0\n    g, x1, y1 = extended_gcd(b, a % b)     # built-in tuple return/unpack\n    x = y1\n    y = x1 - (a // b) * y1\n    return g, x, y\n\ng, x, y = extended_gcd(35, 15)\nprint(g, x, y)   # 35*x + 15*y == g", "py_scratch": "def extended_gcd(a, b):\n    if b == 0:\n        return a, 1, 0\n    else:\n        result = extended_gcd(b, a % b)\n        g = result[0]\n        x1 = result[1]\n        y1 = result[2]\n        x = y1\n        y = x1 - (a // b) * y1\n        return g, x, y\n\nresult = extended_gcd(35, 15)\nprint(result[0], result[1], result[2])", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint extendedGcd(int a, int b, int& x, int& y) {\n    if (b == 0) { x = 1; y = 0; return a; }\n    int x1, y1;\n    int g = extendedGcd(b, a % b, x1, y1);   // built-in reference params\n    x = y1;\n    y = x1 - (a / b) * y1;\n    return g;\n}\nint main() {\n    int x, y;\n    int g = extendedGcd(35, 15, x, y);\n    cout << g << \" \" << x << \" \" << y << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint extendedGcd(int a, int b, int* x, int* y) {\n    if (b == 0) {\n        *x = 1;\n        *y = 0;\n        return a;\n    }\n    int x1, y1;\n    int g = extendedGcd(b, a % b, &x1, &y1);\n    *x = y1;\n    *y = x1 - (a / b) * y1;\n    return g;\n}\nint main() {\n    int x, y;\n    int g = extendedGcd(35, 15, &x, &y);\n    cout << g << \" \" << x << \" \" << y << endl;\n}"}}, {"name": "GCD", "theory": "The Greatest Common Divisor of two integers is the largest integer dividing both without remainder \u2014 computed via the Euclidean algorithm. GCD extends naturally to more than two numbers by folding: gcd(a,b,c) = gcd(gcd(a,b), c), since the GCD operation is associative.", "when": "Fraction simplification, finding the largest tile size that evenly divides two areas, and as a building block for LCM and other number-theoretic computations.", "best": "O(log(min))", "avg": "O(log(min))", "worst": "O(log(min))", "space": "O(1)", "code": {"py_bi": "from math import gcd\nfrom functools import reduce\nnums = [24, 36, 60]\nresult = reduce(gcd, nums)      # built-in reduce folds gcd across the list\nprint(result)", "py_scratch": "def gcd(a, b):\n    while b != 0:\n        a, b = b, a % b\n    return a\n\nnums = [24, 36, 60]\nresult = nums[0]\nfor i in range(1, len(nums)):\n    result = gcd(result, nums[i])\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> nums = {24, 36, 60};\n    int result = nums[0];\n    for (size_t i = 1; i < nums.size(); i++) result = __gcd(result, nums[i]);  // built-in __gcd\n    cout << result << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint gcdVal(int a, int b) {\n    while (b != 0) {\n        int temp = b;\n        b = a % b;\n        a = temp;\n    }\n    return a;\n}\nint main() {\n    int nums[] = {24, 36, 60};\n    int n = 3;\n    int result = nums[0];\n    for (int i = 1; i < n; i++) result = gcdVal(result, nums[i]);\n    cout << result << endl;\n}"}}, {"name": "LCM", "theory": "The Least Common Multiple of two integers is the smallest positive integer divisible by both \u2014 computed via the identity lcm(a,b) = (a*b) / gcd(a,b), which follows from the relationship between a number's prime factorisation and its divisors. Using this formula avoids needing a separate LCM algorithm since GCD is already efficient.", "when": "Finding a common period/cycle length, synchronising repeating events, fraction addition (finding a common denominator).", "best": "O(log(min))", "avg": "O(log(min))", "worst": "O(log(min))", "space": "O(1)", "code": {"py_bi": "import math\ndef lcm(a, b):\n    return abs(a*b) // math.gcd(a, b)    # built-in gcd + abs\n\nprint(lcm(4, 6))", "py_scratch": "def gcd(a, b):\n    while b != 0:\n        a, b = b, a % b\n    return a\n\ndef lcm(a, b):\n    g = gcd(a, b)\n    product = a * b\n    if product < 0:\n        product = -product\n    return product // g\n\nprint(lcm(4, 6))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nlong long lcm(int a, int b) {\n    return abs((long long)a * b) / __gcd(a, b);   // built-in abs + __gcd\n}\nint main() { cout << lcm(4, 6) << endl; }", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint gcdVal(int a, int b) {\n    while (b != 0) {\n        int temp = b;\n        b = a % b;\n        a = temp;\n    }\n    return a;\n}\nint main() {\n    int a = 4, b = 6;\n    int g = gcdVal(a, b);\n    long long product = (long long)a * b;\n    if (product < 0) product = -product;\n    cout << product / g << endl;\n}"}}, {"name": "Sieve of Eratosthenes", "theory": "Finds all primes up to n by starting with a boolean array marked 'prime', then for each prime p found (starting from 2), marking every multiple of p (starting from p^2, since smaller multiples were already marked by smaller primes) as composite \u2014 the total work across all primes sums to O(n log log n) by a classic harmonic-series-like argument.", "when": "Finding all primes up to a moderately large n, or precomputing primality for many subsequent queries \u2014 far faster than trial division per number when many primality checks are needed.", "best": "O(n log log n)", "avg": "O(n log log n)", "worst": "O(n log log n)", "space": "O(n)", "code": {"py_bi": "def sieve(n):\n    is_prime = [True] * (n+1)\n    is_prime[0] = is_prime[1] = False\n    for p in range(2, int(n**0.5) + 1):     # built-in exponentiation for sqrt\n        if is_prime[p]:\n            for multiple in range(p*p, n+1, p):\n                is_prime[multiple] = False\n    return [i for i in range(n+1) if is_prime[i]]\n\nprint(sieve(30))", "py_scratch": "def sieve(n):\n    is_prime = [True] * (n + 1)\n    is_prime[0] = False\n    if n >= 1:\n        is_prime[1] = False\n    p = 2\n    while p * p <= n:\n        if is_prime[p]:\n            multiple = p * p\n            while multiple <= n:\n                is_prime[multiple] = False\n                multiple = multiple + p\n        p = p + 1\n    result = []\n    for i in range(n + 1):\n        if is_prime[i]:\n            result.append(i)\n    return result\n\nprint(sieve(30))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> sieve(int n) {\n    vector<bool> isPrime(n+1, true);   // built-in bool vector\n    isPrime[0] = isPrime[1] = false;\n    for (int p = 2; (long long)p*p <= n; p++) {\n        if (isPrime[p]) {\n            for (int multiple = p*p; multiple <= n; multiple += p) isPrime[multiple] = false;\n        }\n    }\n    vector<int> result;\n    for (int i = 0; i <= n; i++) if (isPrime[i]) result.push_back(i);\n    return result;\n}\nint main() {\n    for (int x : sieve(30)) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int n = 30;\n    bool isPrime[31];\n    for (int i = 0; i <= n; i++) isPrime[i] = true;\n    isPrime[0] = false;\n    isPrime[1] = false;\n    for (int p = 2; p*p <= n; p++) {\n        if (isPrime[p]) {\n            for (int multiple = p*p; multiple <= n; multiple += p) {\n                isPrime[multiple] = false;\n            }\n        }\n    }\n    for (int i = 0; i <= n; i++) if (isPrime[i]) cout << i << \" \";\n}"}}, {"name": "Segmented Sieve", "theory": "Extends the Sieve of Eratosthenes to find primes in a range [L, R] where R can be very large (too large to sieve from 0) but R-L is manageable: first sieve all primes up to sqrt(R) using the normal sieve, then use only those small primes to mark composites within the [L, R] window \u2014 avoids the O(R) memory the normal sieve would need.", "when": "Finding primes in a large range where the range's upper bound is too large to sieve directly from zero, but the range itself is of manageable size \u2014 common in problems with R up to 10^9 or more.", "best": "O((R-L+1) log log R + sqrt(R) log log sqrt(R))", "avg": "same", "worst": "same", "space": "O(R-L+1 + sqrt(R))", "code": {"py_bi": "def segmented_sieve(L, R):\n    limit = int(R**0.5) + 1\n    base_primes = []\n    is_prime_small = [True] * (limit+1)\n    for p in range(2, limit+1):\n        if is_prime_small[p]:\n            base_primes.append(p)\n            for m in range(p*p, limit+1, p):\n                is_prime_small[m] = False\n\n    is_prime = [True] * (R - L + 1)     # built-in list, offset by L\n    if L == 1:\n        is_prime[0] = False\n    for p in base_primes:\n        start = max(p*p, ((L + p - 1)//p) * p)\n        for m in range(start, R+1, p):\n            is_prime[m - L] = False\n    return [i+L for i, v in enumerate(is_prime) if v]\n\nprint(segmented_sieve(10, 30))", "py_scratch": "def segmented_sieve(L, R):\n    limit = int(R**0.5) + 1\n    is_prime_small = [True] * (limit + 1)\n    is_prime_small[0] = False\n    if limit >= 1:\n        is_prime_small[1] = False\n    base_primes = []\n    p = 2\n    while p <= limit:\n        if is_prime_small[p]:\n            base_primes.append(p)\n            m = p * p\n            while m <= limit:\n                is_prime_small[m] = False\n                m = m + p\n        p = p + 1\n\n    size = R - L + 1\n    is_prime = [True] * size\n    if L == 1:\n        is_prime[0] = False\n    for prime in base_primes:\n        start = prime * prime\n        if start < L:\n            start = ((L + prime - 1) // prime) * prime\n        m = start\n        while m <= R:\n            is_prime[m - L] = False\n            m = m + prime\n\n    result = []\n    i = 0\n    while i < size:\n        if is_prime[i]:\n            result.append(i + L)\n        i = i + 1\n    return result\n\nprint(segmented_sieve(10, 30))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> segmentedSieve(int L, int R) {\n    int limit = sqrt(R) + 1;\n    vector<bool> isPrimeSmall(limit+1, true);\n    vector<int> basePrimes;\n    for (int p = 2; p <= limit; p++) {\n        if (isPrimeSmall[p]) {\n            basePrimes.push_back(p);\n            for (int m = p*p; m <= limit; m += p) isPrimeSmall[m] = false;\n        }\n    }\n    vector<bool> isPrime(R-L+1, true);\n    if (L == 1) isPrime[0] = false;\n    for (int p : basePrimes) {\n        int start = max(p*p, ((L+p-1)/p)*p);      // built-in max\n        for (int m = start; m <= R; m += p) isPrime[m-L] = false;\n    }\n    vector<int> result;\n    for (int i = 0; i < (int)isPrime.size(); i++) if (isPrime[i]) result.push_back(i+L);\n    return result;\n}\nint main() {\n    for (int x : segmentedSieve(10, 30)) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n    int L = 10, R = 30;\n    int limit = (int)sqrt((double)R) + 1;\n    bool isPrimeSmall[40];\n    for (int i = 0; i <= limit; i++) isPrimeSmall[i] = true;\n    int basePrimes[20]; int bcount = 0;\n    for (int p = 2; p <= limit; p++) {\n        if (isPrimeSmall[p]) {\n            basePrimes[bcount++] = p;\n            for (int m = p*p; m <= limit; m += p) isPrimeSmall[m] = false;\n        }\n    }\n    int size = R - L + 1;\n    bool isPrime[21];\n    for (int i = 0; i < size; i++) isPrime[i] = true;\n    if (L == 1) isPrime[0] = false;\n    for (int i = 0; i < bcount; i++) {\n        int p = basePrimes[i];\n        int start = p*p;\n        int rounded = ((L+p-1)/p)*p;\n        if (rounded > start) start = rounded;\n        for (int m = start; m <= R; m += p) isPrime[m-L] = false;\n    }\n    for (int i = 0; i < size; i++) if (isPrime[i]) cout << (i+L) << \" \";\n}"}}, {"name": "Prime Factorization", "theory": "Decomposes a number into its prime factors by trial-dividing by increasing integers up to sqrt(n): whenever a divisor d is found, repeatedly divide it out (to capture its full power) before moving to the next candidate; if a remainder greater than 1 remains after checking up to sqrt(n), that remainder is itself a prime factor.", "when": "Finding all prime factors (and their multiplicities) of a number \u2014 used in divisor-counting, Euler Totient computation, and simplifying expressions involving prime powers.", "best": "O(sqrt(n))", "avg": "O(sqrt(n))", "worst": "O(sqrt(n))", "space": "O(log n) \u2014 number of distinct prime factors", "code": {"py_bi": "def prime_factorize(n):\n    factors = {}\n    d = 2\n    while d * d <= n:\n        while n % d == 0:\n            factors[d] = factors.get(d, 0) + 1    # built-in dict.get\n            n //= d\n        d += 1\n    if n > 1:\n        factors[n] = factors.get(n, 0) + 1\n    return factors\n\nprint(prime_factorize(360))", "py_scratch": "def prime_factorize(n):\n    factors = {}\n    d = 2\n    while d * d <= n:\n        while n % d == 0:\n            if d in factors:\n                factors[d] = factors[d] + 1\n            else:\n                factors[d] = 1\n            n = n // d\n        d = d + 1\n    if n > 1:\n        if n in factors:\n            factors[n] = factors[n] + 1\n        else:\n            factors[n] = 1\n    return factors\n\nprint(prime_factorize(360))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nmap<int,int> primeFactorize(int n) {\n    map<int,int> factors;               // built-in ordered map\n    for (int d = 2; (long long)d*d <= n; d++) {\n        while (n % d == 0) { factors[d]++; n /= d; }\n    }\n    if (n > 1) factors[n]++;\n    return factors;\n}\nint main() {\n    for (auto& [p, e] : primeFactorize(360)) cout << p << \"^\" << e << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int n = 360;\n    int primes[10], exps[10]; int count = 0;\n    int d = 2;\n    while ((long long)d*d <= n) {\n        if (n % d == 0) {\n            int exp = 0;\n            while (n % d == 0) { exp++; n /= d; }\n            primes[count] = d; exps[count] = exp; count++;\n        }\n        d++;\n    }\n    if (n > 1) { primes[count] = n; exps[count] = 1; count++; }\n    for (int i = 0; i < count; i++) cout << primes[i] << \"^\" << exps[i] << \" \";\n}"}}, {"name": "Fast Exponentiation", "theory": "Computes base^exp in O(log exp) instead of O(exp) by squaring: if exp is even, base^exp = (base^(exp/2))^2; if odd, base^exp = base * base^(exp-1) \u2014 recursively (or iteratively via bit-by-bit processing of exp) halving the exponent each step. Almost always done modulo some m in practice to keep numbers bounded.", "when": "Computing large powers efficiently \u2014 modular exponentiation for cryptography (RSA), fast Fibonacci via matrix exponentiation, any repeated-squaring scenario.", "best": "O(log exp)", "avg": "O(log exp)", "worst": "O(log exp)", "space": "O(1) iterative, O(log exp) recursive", "code": {"py_bi": "MOD = 10**9 + 7\nresult = pow(2, 100, MOD)    # built-in three-argument pow does modular fast exponentiation\nprint(result)", "py_scratch": "MOD = 1000000007\n\ndef fast_pow(base, exp, mod):\n    result = 1\n    base = base % mod\n    while exp > 0:\n        if exp % 2 == 1:\n            result = (result * base) % mod\n        exp = exp // 2\n        base = (base * base) % mod\n    return result\n\nprint(fast_pow(2, 100, MOD))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nlong long fastPow(long long base, long long exp, long long mod) {\n    long long result = 1;\n    base %= mod;\n    while (exp > 0) {\n        if (exp & 1) result = (result * base) % mod;   // built-in bitwise AND for parity check\n        exp >>= 1;\n        base = (base * base) % mod;\n    }\n    return result;\n}\nint main() {\n    long long MOD = 1000000007;\n    cout << fastPow(2, 100, MOD) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nlong long fastPow(long long base, long long exp, long long mod) {\n    long long result = 1;\n    base = base % mod;\n    while (exp > 0) {\n        if (exp % 2 == 1) {\n            result = (result * base) % mod;\n        }\n        exp = exp / 2;\n        base = (base * base) % mod;\n    }\n    return result;\n}\nint main() {\n    long long MOD = 1000000007;\n    cout << fastPow(2, 100, MOD) << endl;\n}"}}, {"name": "Modular Arithmetic", "theory": "Performs arithmetic 'wrapping around' a fixed modulus m, keeping intermediate results bounded \u2014 addition and multiplication distribute over the modulus ((a+b) mod m = ((a mod m)+(b mod m)) mod m, similarly for multiplication), but division requires the modular inverse instead of ordinary division since the result must remain an integer within the modular system.", "when": "Any computation where results would otherwise overflow standard integer types \u2014 competitive programming answers 'modulo 10^9+7', cryptographic computations, hashing.", "best": "O(1) per operation", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "MOD = 10**9 + 7\na, b = 123456789, 987654321\nadd_result = (a + b) % MOD           # built-in modulo operator\nmul_result = (a * b) % MOD\nprint(add_result, mul_result)", "py_scratch": "MOD = 1000000007\na = 123456789\nb = 987654321\n\ndef mod_add(x, y, m):\n    return (x + y) % m\n\ndef mod_mul(x, y, m):\n    return (x * y) % m\n\nadd_result = mod_add(a, b, MOD)\nmul_result = mod_mul(a, b, MOD)\nprint(add_result, mul_result)", "cpp_bi": "#include <iostream>\nusing namespace std;\nint main() {\n    long long MOD = 1000000007;\n    long long a = 123456789, b = 987654321;\n    long long addResult = (a + b) % MOD;      // built-in modulo\n    long long mulResult = (a * b) % MOD;\n    cout << addResult << \" \" << mulResult << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nlong long modAdd(long long x, long long y, long long m) {\n    return (x + y) % m;\n}\nlong long modMul(long long x, long long y, long long m) {\n    return (x * y) % m;\n}\nint main() {\n    long long MOD = 1000000007;\n    long long a = 123456789, b = 987654321;\n    cout << modAdd(a, b, MOD) << \" \" << modMul(a, b, MOD) << endl;\n}"}}, {"name": "Modular Inverse", "theory": "Finds x such that (a * x) mod m == 1 \u2014 the modular equivalent of division by a. If m is prime, computed efficiently via Fermat's Little Theorem as a^(m-2) mod m (using fast exponentiation); for general m (where gcd(a,m)=1), computed via the Extended Euclidean Algorithm's Bezout coefficients.", "when": "Division under a modulus (e.g. computing nCr mod p, rational-number computations kept in modular form) \u2014 division isn't directly defined in modular arithmetic, so multiplying by the inverse substitutes for it.", "best": "O(log m)", "avg": "O(log m)", "worst": "O(log m)", "space": "O(1)", "code": {"py_bi": "MOD = 10**9 + 7\na = 3\ninv = pow(a, MOD - 2, MOD)     # built-in modpow via Fermat's Little Theorem (MOD is prime)\nprint(inv, (a * inv) % MOD)     # should print ... 1", "py_scratch": "MOD = 1000000007\n\ndef fast_pow(base, exp, mod):\n    result = 1\n    base = base % mod\n    while exp > 0:\n        if exp % 2 == 1:\n            result = (result * base) % mod\n        exp = exp // 2\n        base = (base * base) % mod\n    return result\n\ndef mod_inverse(a, mod):\n    return fast_pow(a, mod - 2, mod)\n\na = 3\ninv = mod_inverse(a, MOD)\nprint(inv, (a * inv) % MOD)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nlong long fastPow(long long base, long long exp, long long mod) {\n    long long result = 1;\n    base %= mod;\n    while (exp > 0) {\n        if (exp & 1) result = (result * base) % mod;\n        exp >>= 1;\n        base = (base * base) % mod;\n    }\n    return result;\n}\nlong long modInverse(long long a, long long mod) {\n    return fastPow(a, mod - 2, mod);    // built-in: Fermat's Little Theorem\n}\nint main() {\n    long long MOD = 1000000007;\n    long long a = 3;\n    long long inv = modInverse(a, MOD);\n    cout << inv << \" \" << (a * inv) % MOD << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nlong long fastPow(long long base, long long exp, long long mod) {\n    long long result = 1;\n    base = base % mod;\n    while (exp > 0) {\n        if (exp % 2 == 1) result = (result * base) % mod;\n        exp = exp / 2;\n        base = (base * base) % mod;\n    }\n    return result;\n}\nlong long modInverse(long long a, long long mod) {\n    return fastPow(a, mod - 2, mod);\n}\nint main() {\n    long long MOD = 1000000007;\n    long long a = 3;\n    long long inv = modInverse(a, MOD);\n    cout << inv << \" \" << (a * inv) % MOD << endl;\n}"}}, {"name": "Euler Totient", "theory": "Euler's totient function phi(n) counts integers from 1 to n that are coprime to n, computed via the product formula phi(n) = n * product over distinct prime factors p of n of (1 - 1/p) \u2014 derived by inclusion-exclusion over which prime factors 'exclude' a given integer. A sieve variant computes phi for all numbers up to n in O(n log log n), analogous to the Sieve of Eratosthenes.", "when": "Counting coprime integers, RSA key generation (phi(n) for n = p*q), and other multiplicative-number-theory computations.", "best": "O(sqrt(n)) single value", "avg": "O(sqrt(n))", "worst": "O(sqrt(n))", "space": "O(1)", "code": {"py_bi": "def euler_totient(n):\n    result = n\n    d = 2\n    temp = n\n    while d * d <= temp:\n        if temp % d == 0:\n            while temp % d == 0:\n                temp //= d\n            result -= result // d      # built-in integer division\n        d += 1\n    if temp > 1:\n        result -= result // temp\n    return result\n\nprint(euler_totient(36))", "py_scratch": "def euler_totient(n):\n    result = n\n    temp = n\n    d = 2\n    while d * d <= temp:\n        if temp % d == 0:\n            while temp % d == 0:\n                temp = temp // d\n            result = result - (result // d)\n        d = d + 1\n    if temp > 1:\n        result = result - (result // temp)\n    return result\n\nprint(euler_totient(36))", "cpp_bi": "#include <iostream>\nusing namespace std;\nint eulerTotient(int n) {\n    int result = n, temp = n;\n    for (int d = 2; (long long)d*d <= temp; d++) {\n        if (temp % d == 0) {\n            while (temp % d == 0) temp /= d;\n            result -= result / d;         // built-in integer division\n        }\n    }\n    if (temp > 1) result -= result / temp;\n    return result;\n}\nint main() { cout << eulerTotient(36) << endl; }", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint eulerTotient(int n) {\n    int result = n;\n    int temp = n;\n    int d = 2;\n    while (d * d <= temp) {\n        if (temp % d == 0) {\n            while (temp % d == 0) {\n                temp = temp / d;\n            }\n            result = result - (result / d);\n        }\n        d = d + 1;\n    }\n    if (temp > 1) {\n        result = result - (result / temp);\n    }\n    return result;\n}\nint main() { cout << eulerTotient(36) << endl; }"}}, {"name": "nCr (Combinatorics)", "theory": "Computes n-choose-r, the number of ways to pick r items from n without regard to order (n! / (r! * (n-r)!)). For large n mod a prime p, computed via precomputed factorials and modular inverses: nCr mod p = fact[n] * inv_fact[r] * inv_fact[n-r] mod p \u2014 avoids overflow and division issues that direct factorial computation would hit.", "when": "Counting combinations, binomial coefficient computation for probability/combinatorics problems, especially repeated queries where precomputing factorials pays off.", "best": "O(n) precompute, O(1) query", "avg": "O(n) precompute, O(1) query", "worst": "O(n) precompute, O(1) query", "space": "O(n)", "code": {"py_bi": "MOD = 10**9 + 7\nN = 1000\nfact = [1] * (N+1)\nfor i in range(1, N+1):\n    fact[i] = fact[i-1] * i % MOD\ninv_fact = [1] * (N+1)\ninv_fact[N] = pow(fact[N], MOD-2, MOD)     # built-in modpow\nfor i in range(N, 0, -1):\n    inv_fact[i-1] = inv_fact[i] * i % MOD\n\ndef nCr(n, r):\n    if r < 0 or r > n:\n        return 0\n    return fact[n] * inv_fact[r] % MOD * inv_fact[n-r] % MOD\n\nprint(nCr(10, 3))", "py_scratch": "MOD = 1000000007\nN = 1000\n\ndef fast_pow(base, exp, mod):\n    result = 1\n    base = base % mod\n    while exp > 0:\n        if exp % 2 == 1:\n            result = (result * base) % mod\n        exp = exp // 2\n        base = (base * base) % mod\n    return result\n\nfact = [1] * (N + 1)\nfor i in range(1, N + 1):\n    fact[i] = fact[i-1] * i % MOD\n\ninv_fact = [1] * (N + 1)\ninv_fact[N] = fast_pow(fact[N], MOD - 2, MOD)\ni = N\nwhile i > 0:\n    inv_fact[i-1] = inv_fact[i] * i % MOD\n    i = i - 1\n\ndef nCr(n, r):\n    if r < 0 or r > n:\n        return 0\n    return fact[n] * inv_fact[r] % MOD * inv_fact[n-r] % MOD\n\nprint(nCr(10, 3))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nconst long long MOD = 1000000007;\nconst int N = 1000;\nlong long fact[N+1], invFact[N+1];\nlong long fastPow(long long base, long long exp, long long mod) {\n    long long result = 1;\n    base %= mod;\n    while (exp > 0) {\n        if (exp & 1) result = (result * base) % mod;\n        exp >>= 1;\n        base = (base * base) % mod;\n    }\n    return result;\n}\nlong long nCr(int n, int r) {\n    if (r < 0 || r > n) return 0;\n    return fact[n] * invFact[r] % MOD * invFact[n-r] % MOD;\n}\nint main() {\n    fact[0] = 1;\n    for (int i = 1; i <= N; i++) fact[i] = fact[i-1] * i % MOD;   // built-in loop\n    invFact[N] = fastPow(fact[N], MOD-2, MOD);\n    for (int i = N; i > 0; i--) invFact[i-1] = invFact[i] * i % MOD;\n    cout << nCr(10, 3) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nlong long MOD = 1000000007;\nint N = 1000;\nlong long fact[1001], invFact[1001];\nlong long fastPow(long long base, long long exp, long long mod) {\n    long long result = 1;\n    base = base % mod;\n    while (exp > 0) {\n        if (exp % 2 == 1) result = (result * base) % mod;\n        exp = exp / 2;\n        base = (base * base) % mod;\n    }\n    return result;\n}\nlong long nCr(int n, int r) {\n    if (r < 0 || r > n) return 0;\n    return fact[n] * invFact[r] % MOD * invFact[n-r] % MOD;\n}\nint main() {\n    fact[0] = 1;\n    for (int i = 1; i <= N; i++) fact[i] = fact[i-1] * i % MOD;\n    invFact[N] = fastPow(fact[N], MOD-2, MOD);\n    for (int i = N; i > 0; i--) invFact[i-1] = invFact[i] * i % MOD;\n    cout << nCr(10, 3) << endl;\n}"}}, {"name": "Pascal's Triangle", "theory": "Builds binomial coefficients using the recurrence C(n,r) = C(n-1,r-1) + C(n-1,r), which follows from the combinatorial identity 'either include or exclude one specific item' \u2014 each row is built from the previous row in O(row length), and the whole triangle up to row n takes O(n^2), useful when you need every C(n,r) value rather than a single query.", "when": "Generating all binomial coefficients up to a given n at once (rather than a single nCr query), or when integer-exact values are needed without modular arithmetic (small n).", "best": "O(n^2)", "avg": "O(n^2)", "worst": "O(n^2)", "space": "O(n^2)", "code": {"py_bi": "def pascals_triangle(n):\n    triangle = [[1]*(i+1) for i in range(n)]   # built-in list comprehension\n    for i in range(2, n):\n        for j in range(1, i):\n            triangle[i][j] = triangle[i-1][j-1] + triangle[i-1][j]\n    return triangle\n\nfor row in pascals_triangle(6):\n    print(row)", "py_scratch": "def pascals_triangle(n):\n    triangle = []\n    for i in range(n):\n        row = [1] * (i + 1)\n        triangle.append(row)\n    i = 2\n    while i < n:\n        j = 1\n        while j < i:\n            triangle[i][j] = triangle[i-1][j-1] + triangle[i-1][j]\n            j = j + 1\n        i = i + 1\n    return triangle\n\nresult = pascals_triangle(6)\nfor row in result:\n    print(row)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<vector<long long>> pascalsTriangle(int n) {\n    vector<vector<long long>> triangle(n);\n    for (int i = 0; i < n; i++) triangle[i].assign(i+1, 1);   // built-in assign\n    for (int i = 2; i < n; i++)\n        for (int j = 1; j < i; j++)\n            triangle[i][j] = triangle[i-1][j-1] + triangle[i-1][j];\n    return triangle;\n}\nint main() {\n    for (auto& row : pascalsTriangle(6)) { for (long long x : row) cout << x << \" \"; cout << \"\\n\"; }\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int n = 6;\n    long long triangle[6][6];\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j <= i; j++) {\n            triangle[i][j] = 1;\n        }\n    }\n    for (int i = 2; i < n; i++) {\n        for (int j = 1; j < i; j++) {\n            triangle[i][j] = triangle[i-1][j-1] + triangle[i-1][j];\n        }\n    }\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j <= i; j++) cout << triangle[i][j] << \" \";\n        cout << endl;\n    }\n}"}}, {"name": "Inclusion\u2013Exclusion", "theory": "Computes the size of a union of overlapping sets by alternately adding individual set sizes, subtracting pairwise intersections, adding triple intersections, and so on \u2014 |A\u222aB\u222aC| = |A|+|B|+|C| - |A\u2229B|-|A\u2229C|-|B\u2229C| + |A\u2229B\u2229C| \u2014 correcting for the over/under-counting that occurs when sets overlap. Generalises to n sets via a sum over all 2^n subsets with alternating signs.", "when": "Counting elements satisfying at least one of several overlapping conditions \u2014 counting numbers divisible by any of several divisors, derangement counting, coverage problems.", "best": "O(2^k) for k sets", "avg": "O(2^k)", "worst": "O(2^k)", "space": "O(1)", "code": {"py_bi": "def count_divisible_by_any(n, divisors):\n    from itertools import combinations\n    total = 0\n    k = len(divisors)\n    for size in range(1, k+1):\n        for combo in combinations(divisors, size):   # built-in itertools.combinations\n            product = 1\n            for d in combo:\n                product *= d\n            count = n // product\n            if size % 2 == 1:\n                total += count\n            else:\n                total -= count\n    return total\n\n# count numbers <= 100 divisible by 2, 3, or 5\nprint(count_divisible_by_any(100, [2, 3, 5]))", "py_scratch": "def count_divisible_by_any(n, divisors):\n    k = len(divisors)\n    total = 0\n    mask = 1\n    while mask < (1 << k):\n        product = 1\n        bits = 0\n        i = 0\n        while i < k:\n            if mask & (1 << i):\n                product = product * divisors[i]\n                bits = bits + 1\n            i = i + 1\n        count = n // product\n        if bits % 2 == 1:\n            total = total + count\n        else:\n            total = total - count\n        mask = mask + 1\n    return total\n\nprint(count_divisible_by_any(100, [2, 3, 5]))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nlong long countDivisibleByAny(long long n, vector<int>& divisors) {\n    int k = divisors.size();\n    long long total = 0;\n    for (int mask = 1; mask < (1<<k); mask++) {         // built-in bitmask enumeration\n        long long product = 1;\n        int bits = __builtin_popcount(mask);\n        for (int i = 0; i < k; i++) if (mask & (1<<i)) product *= divisors[i];\n        long long count = n / product;\n        if (bits % 2 == 1) total += count;\n        else total -= count;\n    }\n    return total;\n}\nint main() {\n    vector<int> divisors = {2, 3, 5};\n    cout << countDivisibleByAny(100, divisors) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int divisors[] = {2, 3, 5};\n    int k = 3;\n    long long n = 100;\n    long long total = 0;\n    for (int mask = 1; mask < (1<<k); mask++) {\n        long long product = 1;\n        int bits = 0;\n        for (int i = 0; i < k; i++) {\n            if (mask & (1<<i)) {\n                product = product * divisors[i];\n                bits = bits + 1;\n            }\n        }\n        long long count = n / product;\n        if (bits % 2 == 1) total = total + count;\n        else total = total - count;\n    }\n    cout << total << endl;\n}"}}]}, {"num": "25", "title": "Advanced Techniques", "techniques": [{"name": "Meet in the Middle", "theory": "Splits a problem's search space into two halves, brute-forces each half independently (each producing 2^(n/2) results instead of the full 2^n), then combines the two halves' results efficiently (often via sorting + binary search, or a hash set) \u2014 turns an O(2^n) exponential problem into O(2^(n/2)), a massive speedup for moderate n (e.g. n=40 becomes feasible instead of n=20).", "when": "Subset-sum-style problems with n too large for direct 2^n brute force but small enough that 2^(n/2) is feasible (roughly n <= 40).", "best": "O(2^(n/2) log(2^(n/2)))", "avg": "O(2^(n/2) log(2^(n/2)))", "worst": "O(2^(n/2) log(2^(n/2)))", "space": "O(2^(n/2))", "code": {"py_bi": "def subset_sums(arr):\n    n = len(arr)\n    sums = []\n    for mask in range(1 << n):           # built-in bit shift\n        total = sum(arr[i] for i in range(n) if mask & (1 << i))\n        sums.append(total)\n    return sums\n\ndef count_pairs_with_sum(arr, target):\n    n = len(arr)\n    half = n // 2\n    left_sums = subset_sums(arr[:half])\n    right_sums = sorted(subset_sums(arr[half:]))   # built-in sorted\n    import bisect\n    count = 0\n    for s in left_sums:\n        needed = target - s\n        lo = bisect.bisect_left(right_sums, needed)\n        hi = bisect.bisect_right(right_sums, needed)\n        count += hi - lo\n    return count\n\nprint(count_pairs_with_sum([3,1,4,1,5,9,2,6], 10))", "py_scratch": "def subset_sums(arr):\n    n = len(arr)\n    sums = []\n    mask = 0\n    while mask < (1 << n):\n        total = 0\n        i = 0\n        while i < n:\n            if mask & (1 << i):\n                total = total + arr[i]\n            i = i + 1\n        sums.append(total)\n        mask = mask + 1\n    return sums\n\ndef count_pairs_with_sum(arr, target):\n    n = len(arr)\n    half = n // 2\n    left_sums = subset_sums(arr[:half])\n    right_sums = subset_sums(arr[half:])\n    right_sums.sort()\n    count = 0\n    for s in left_sums:\n        needed = target - s\n        for r in right_sums:\n            if r == needed:\n                count = count + 1\n    return count\n\nprint(count_pairs_with_sum([3,1,4,1,5,9,2,6], 10))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<long long> subsetSums(vector<int>& arr) {\n    int n = arr.size();\n    vector<long long> sums;\n    for (int mask = 0; mask < (1<<n); mask++) {\n        long long total = 0;\n        for (int i = 0; i < n; i++) if (mask & (1<<i)) total += arr[i];\n        sums.push_back(total);\n    }\n    return sums;\n}\nint main() {\n    vector<int> arr = {3,1,4,1,5,9,2,6};\n    int n = arr.size(), half = n/2;\n    vector<int> left(arr.begin(), arr.begin()+half), right(arr.begin()+half, arr.end());\n    auto leftSums = subsetSums(left);\n    auto rightSums = subsetSums(right);\n    sort(rightSums.begin(), rightSums.end());     // built-in sort\n    long long target = 10, count = 0;\n    for (long long s : leftSums) {\n        long long needed = target - s;\n        auto lo = lower_bound(rightSums.begin(), rightSums.end(), needed);\n        auto hi = upper_bound(rightSums.begin(), rightSums.end(), needed);\n        count += hi - lo;\n    }\n    cout << count << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[] = {3,1,4,1,5,9,2,6};\nint n = 8;\nlong long leftSums[16], rightSums[16];\nint leftCount = 0, rightCount = 0;\nint main() {\n    int half = n / 2;\n    for (int mask = 0; mask < (1<<half); mask++) {\n        long long total = 0;\n        for (int i = 0; i < half; i++) if (mask & (1<<i)) total += arr[i];\n        leftSums[leftCount++] = total;\n    }\n    for (int mask = 0; mask < (1<<(n-half)); mask++) {\n        long long total = 0;\n        for (int i = 0; i < n-half; i++) if (mask & (1<<i)) total += arr[half+i];\n        rightSums[rightCount++] = total;\n    }\n    for (int i = 0; i < rightCount; i++)\n        for (int j = 0; j < rightCount-1-i; j++)\n            if (rightSums[j] > rightSums[j+1]) swap(rightSums[j], rightSums[j+1]);\n    long long target = 10, count = 0;\n    for (int i = 0; i < leftCount; i++) {\n        long long needed = target - leftSums[i];\n        for (int j = 0; j < rightCount; j++) if (rightSums[j] == needed) count++;\n    }\n    cout << count << endl;\n}"}}, {"name": "Sweep Line", "theory": "Conceptually sweeps a vertical (or horizontal) line across a set of geometric events (interval starts/ends, points), processing events in sorted order of position and maintaining an 'active set' data structure that reflects what the sweeping line currently intersects \u2014 converts many 2D geometric problems into a 1D sequential processing problem.", "when": "Interval overlap counting, finding closest pair of points, rectangle union area, skyline problems \u2014 any problem where 'what's currently active at position x' matters.", "best": "O(n log n)", "avg": "O(n log n)", "worst": "O(n log n)", "space": "O(n)", "code": {"py_bi": "intervals = [(1,5), (2,6), (8,10), (9,12)]\nevents = []\nfor start, end in intervals:\n    events.append((start, 1))    # +1 at start\n    events.append((end, -1))     # -1 at end\nevents.sort()                     # built-in sort (ties: ends before starts is a common variant)\nactive = 0\nmax_active = 0\nfor pos, delta in events:\n    active += delta\n    max_active = max(max_active, active)   # built-in max\nprint(max_active)", "py_scratch": "intervals = [(1,5), (2,6), (8,10), (9,12)]\nevents = []\nfor start, end in intervals:\n    events.append((start, 1))\n    events.append((end, -1))\n\nn = len(events)\nfor i in range(n):\n    for j in range(n-1-i):\n        if events[j][0] > events[j+1][0]:\n            events[j], events[j+1] = events[j+1], events[j]\n\nactive = 0\nmax_active = 0\nfor pos, delta in events:\n    active = active + delta\n    if active > max_active:\n        max_active = active\nprint(max_active)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<pair<int,int>> intervals = {{1,5},{2,6},{8,10},{9,12}};\n    vector<pair<int,int>> events;\n    for (auto& [s, e] : intervals) {\n        events.push_back({s, 1});\n        events.push_back({e, -1});\n    }\n    sort(events.begin(), events.end());   // built-in sort\n    int active = 0, maxActive = 0;\n    for (auto& [pos, delta] : events) {\n        active += delta;\n        maxActive = max(maxActive, active);\n    }\n    cout << maxActive << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int starts[] = {1,2,8,9};\n    int ends[] = {5,6,10,12};\n    int n = 4;\n    int pos[8], delta[8]; int ecount = 0;\n    for (int i = 0; i < n; i++) {\n        pos[ecount] = starts[i]; delta[ecount] = 1; ecount++;\n        pos[ecount] = ends[i]; delta[ecount] = -1; ecount++;\n    }\n    for (int i = 0; i < ecount; i++)\n        for (int j = 0; j < ecount-1-i; j++)\n            if (pos[j] > pos[j+1]) { swap(pos[j],pos[j+1]); swap(delta[j],delta[j+1]); }\n    int active = 0, maxActive = 0;\n    for (int i = 0; i < ecount; i++) {\n        active += delta[i];\n        if (active > maxActive) maxActive = active;\n    }\n    cout << maxActive << endl;\n}"}}, {"name": "Event Sorting", "theory": "A general term for reformulating a problem as a sequence of discrete 'events' (arrival/departure, open/close, before/after) sorted by position/time, then processing them in order with running state \u2014 the technique underlying Sweep Line, Minimum Platforms (Section 16), and many interval/scheduling problems; the common insight is that sorting events (not the original objects) is what unlocks a linear pass.", "when": "Any problem naturally described as things happening at points in time/space, where sorting the EVENTS (not the raw objects) exposes a clean sequential-processing solution.", "best": "O(n log n)", "avg": "O(n log n)", "worst": "O(n log n)", "space": "O(n)", "code": {"py_bi": "bookings = [(1, 10, \"Alice\"), (3, 8, \"Bob\"), (12, 15, \"Carol\")]\nevents = []\nfor start, end, name in bookings:\n    events.append((start, \"start\", name))\n    events.append((end, \"end\", name))\nevents.sort()                     # built-in sort by (time, then type/name)\noccupied = set()\nfor time, kind, name in events:\n    if kind == \"start\":\n        occupied.add(name)\n    else:\n        occupied.discard(name)\n    print(time, kind, name, \"-> currently:\", occupied)", "py_scratch": "bookings = [(1, 10, \"Alice\"), (3, 8, \"Bob\"), (12, 15, \"Carol\")]\nevents = []\nfor booking in bookings:\n    start, end, name = booking\n    events.append((start, \"start\", name))\n    events.append((end, \"end\", name))\n\nn = len(events)\nfor i in range(n):\n    for j in range(n-1-i):\n        if events[j][0] > events[j+1][0]:\n            events[j], events[j+1] = events[j+1], events[j]\n\noccupied = {}\nfor event in events:\n    time, kind, name = event\n    if kind == \"start\":\n        occupied[name] = True\n    else:\n        if name in occupied:\n            del occupied[name]\n    print(time, kind, name)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<tuple<int,int,string>> bookings = {{1,10,\"Alice\"},{3,8,\"Bob\"},{12,15,\"Carol\"}};\n    vector<pair<int,string>> events;\n    for (auto& [s, e, name] : bookings) {\n        events.push_back({s, \"start:\" + name});\n        events.push_back({e, \"end:\" + name});\n    }\n    sort(events.begin(), events.end());   // built-in sort by time\n    for (auto& [time, label] : events) cout << time << \" \" << label << \"\\n\";\n}", "cpp_scratch": "#include <iostream>\n#include <string>\nusing namespace std;\nint main() {\n    int starts[] = {1,3,12};\n    int ends[] = {10,8,15};\n    string names[] = {\"Alice\",\"Bob\",\"Carol\"};\n    int n = 3;\n    int times[6]; string labels[6]; int ecount = 0;\n    for (int i = 0; i < n; i++) {\n        times[ecount] = starts[i]; labels[ecount] = \"start:\" + names[i]; ecount++;\n        times[ecount] = ends[i]; labels[ecount] = \"end:\" + names[i]; ecount++;\n    }\n    for (int i = 0; i < ecount; i++)\n        for (int j = 0; j < ecount-1-i; j++)\n            if (times[j] > times[j+1]) { swap(times[j],times[j+1]); swap(labels[j],labels[j+1]); }\n    for (int i = 0; i < ecount; i++) cout << times[i] << \" \" << labels[i] << endl;\n}"}}, {"name": "Binary Lifting", "theory": "Precomputes, for each node in a tree, its 2^k-th ancestor for all powers of k up to log(depth), using the recurrence up[k][v] = up[k-1][up[k-1][v]] \u2014 any jump of an arbitrary number of steps can then be decomposed into a sum of powers of two (like binary representation) and executed in O(log depth) instead of O(depth).", "when": "Repeated 'kth ancestor' or LCA queries on a tree \u2014 a major speedup over naive O(depth) per-query ancestor walking, especially with many queries.", "best": "O(n log n) build, O(log n) query", "avg": "O(log n) query", "worst": "O(log n) query", "space": "O(n log n)", "code": {"py_bi": "import math\nparent = [-1, 0, 0, 1, 1, 2]   # parent[i] = parent of node i (root has -1)\nn = len(parent)\nLOG = int(math.log2(n)) + 1\nup = [[0]*n for _ in range(LOG)]\nup[0] = [p if p != -1 else 0 for p in parent]   # built-in conditional expression\nfor k in range(1, LOG):\n    for v in range(n):\n        up[k][v] = up[k-1][up[k-1][v]]\n\ndef kth_ancestor(v, k):\n    for i in range(LOG):\n        if k & (1 << i):\n            v = up[i][v]\n    return v\n\nprint(kth_ancestor(5, 2))   # 2 steps up from node 5", "py_scratch": "parent = [-1, 0, 0, 1, 1, 2]\nn = 6\n\ndef log2_floor(x):\n    result = 0\n    while (1 << (result + 1)) <= x:\n        result = result + 1\n    return result\n\nLOG = log2_floor(n) + 1\nup = []\nfor k in range(LOG):\n    row = [0] * n\n    up.append(row)\nfor v in range(n):\n    if parent[v] != -1:\n        up[0][v] = parent[v]\n    else:\n        up[0][v] = 0\n\nk = 1\nwhile k < LOG:\n    v = 0\n    while v < n:\n        up[k][v] = up[k-1][up[k-1][v]]\n        v = v + 1\n    k = k + 1\n\ndef kth_ancestor(v, k):\n    i = 0\n    while i < LOG:\n        if k & (1 << i):\n            v = up[i][v]\n        i = i + 1\n    return v\n\nprint(kth_ancestor(5, 2))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> parent = {-1,0,0,1,1,2};\n    int n = parent.size();\n    int LOG = log2(n) + 1;\n    vector<vector<int>> up(LOG, vector<int>(n, 0));\n    for (int v = 0; v < n; v++) up[0][v] = (parent[v] != -1) ? parent[v] : 0;\n    for (int k = 1; k < LOG; k++)\n        for (int v = 0; v < n; v++)\n            up[k][v] = up[k-1][up[k-1][v]];      // built-in nested indexing\n    auto kthAncestor = [&](int v, int k) {\n        for (int i = 0; i < LOG; i++) if (k & (1<<i)) v = up[i][v];\n        return v;\n    };\n    cout << kthAncestor(5, 2) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint parent[] = {-1,0,0,1,1,2};\nint n = 6;\nint up[4][6];\nint log2Floor(int x) {\n    int result = 0;\n    while ((1 << (result+1)) <= x) result++;\n    return result;\n}\nint main() {\n    int LOG = log2Floor(n) + 1;\n    for (int v = 0; v < n; v++) up[0][v] = (parent[v] != -1) ? parent[v] : 0;\n    for (int k = 1; k < LOG; k++) {\n        for (int v = 0; v < n; v++) {\n            up[k][v] = up[k-1][up[k-1][v]];\n        }\n    }\n    int v = 5, k = 2;\n    for (int i = 0; i < LOG; i++) {\n        if (k & (1 << i)) v = up[i][v];\n    }\n    cout << v << endl;\n}"}}, {"name": "Euler Tour (Tree)", "theory": "Flattens a tree into a linear array by recording each node when entering AND leaving it during a DFS (or just on entry, depending on the variant), so that the entire subtree of any node corresponds to a contiguous range in the flattened array \u2014 enables applying array-based structures (segment tree, Fenwick tree) to subtree queries/updates.", "when": "Converting subtree queries/updates (e.g. 'add heavy child' (the child with the largest subtree) continues the current chain, while all other ('light') children start new chains \u2014 this guarantees that any path query can be broken into O(log n) contiguous-range queries, each answerable via a segment tree over the chain's flattened positions.", "when": "Path queries/updates on a tree (e.g. 'sum of values on the path from u to v', 'max edge weight on path from u to v') needing better than O(n) per query \u2014 a substantial technique combining trees with segment trees.", "best": "O(n) build, O(log^2 n) query", "avg": "O(log^2 n) query", "worst": "O(log^2 n) query", "space": "O(n)", "code": {"py_bi": "# Simplified HLD scaffold: computes subtree sizes and heavy child per node (the core precomputation)\ngraph = {0:[1,2], 1:[3,4], 2:[5], 3:[], 4:[], 5:[]}\nsubtree_size = {}\nheavy_child = {}\n\ndef compute_sizes(u):\n    size = 1\n    max_child_size = 0\n    heavy_child[u] = -1\n    for v in graph[u]:\n        child_size = compute_sizes(v)\n        size += child_size\n        if child_size > max_child_size:     # built-in comparison tracks heaviest child\n            max_child_size = child_size\n            heavy_child[u] = v\n    subtree_size[u] = size\n    return size\n\ncompute_sizes(0)\nprint(subtree_size, heavy_child)", "py_scratch": "graph = {0:[1,2], 1:[3,4], 2:[5], 3:[], 4:[], 5:[]}\nsubtree_size = {}\nheavy_child = {}\n\ndef compute_sizes(u):\n    size = 1\n    max_child_size = 0\n    heavy_child[u] = -1\n    for v in graph[u]:\n        child_size = compute_sizes(v)\n        size = size + child_size\n        if child_size > max_child_size:\n            max_child_size = child_size\n            heavy_child[u] = v\n    subtree_size[u] = size\n    return size\n\ncompute_sizes(0)\nprint(subtree_size)\nprint(heavy_child)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nunordered_map<int, vector<int>> graph = {{0,{1,2}},{1,{3,4}},{2,{5}},{3,{}},{4,{}},{5,{}}};\nunordered_map<int,int> subtreeSize, heavyChild;\nint computeSizes(int u) {\n    int size = 1, maxChildSize = 0;\n    heavyChild[u] = -1;\n    for (int v : graph[u]) {\n        int childSize = computeSizes(v);\n        size += childSize;\n        if (childSize > maxChildSize) { maxChildSize = childSize; heavyChild[u] = v; }  // built-in tracking\n    }\n    subtreeSize[u] = size;\n    return size;\n}\nint main() {\n    computeSizes(0);\n    for (auto& [k,v] : subtreeSize) cout << k << \":\" << v << \" heavy=\" << heavyChild[k] << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint graph[6][2] = {{1,2},{3,4},{5,-1},{-1,-1},{-1,-1},{-1,-1}};\nint subtreeSize[6], heavyChild[6];\nint computeSizes(int u) {\n    int size = 1, maxChildSize = 0;\n    heavyChild[u] = -1;\n    for (int i = 0; i < 2; i++) {\n        int v = graph[u][i];\n        if (v == -1) continue;\n        int childSize = computeSizes(v);\n        size = size + childSize;\n        if (childSize > maxChildSize) {\n            maxChildSize = childSize;\n            heavyChild[u] = v;\n        }\n    }\n    subtreeSize[u] = size;\n    return size;\n}\nint main() {\n    computeSizes(0);\n    for (int i = 0; i < 6; i++) cout << i << \":\" << subtreeSize[i] << \" heavy=\" << heavyChild[i] << \" \";\n}"}}, {"name": "Mo's Algorithm", "theory": "Answers many OFFLINE range queries efficiently by sorting them into blocks of size sqrt(n) (by left endpoint's block, then by right endpoint) and maintaining a sliding [currentL, currentR] window that's incrementally adjusted between consecutive queries \u2014 because queries are processed in a carefully sorted order, the total pointer movement across all queries is bounded to O((n+q) * sqrt(n)) instead of O(n*q) for naive per-query recomputation.", "when": "Many offline range queries (answered all at once, not interactively) on a static array where per-element add/remove from a running answer is O(1) \u2014 frequency-based range queries, distinct-count-in-range queries.", "best": "O((n+q) sqrt(n))", "avg": "O((n+q) sqrt(n))", "worst": "O((n+q) sqrt(n))", "space": "O(n+q)", "code": {"py_bi": "import math\narr = [1, 1, 2, 1, 3, 4, 5, 2, 8]\nqueries = [(0, 4), (1, 3), (2, 8)]   # (l, r) inclusive\nn = len(arr)\nblock = int(math.sqrt(n)) + 1        # built-in sqrt\n\ndef mo_cmp(q):\n    l, r = q\n    block_id = l // block\n    return (block_id, r if block_id % 2 == 0 else -r)   # zigzag ordering optimisation\n\nsorted_queries = sorted(range(len(queries)), key=lambda i: mo_cmp(queries[i]))\nfreq = {}\ndistinct = 0\ncurL, curR = 0, -1\nanswers = [0] * len(queries)\n\ndef add(x):\n    global distinct\n    freq[x] = freq.get(x, 0) + 1\n    if freq[x] == 1:\n        distinct += 1\n\ndef remove(x):\n    global distinct\n    freq[x] -= 1\n    if freq[x] == 0:\n        distinct -= 1\n\nfor qi in sorted_queries:\n    l, r = queries[qi]\n    while curR < r: curR += 1; add(arr[curR])\n    while curL > l: curL -= 1; add(arr[curL])\n    while curR > r: remove(arr[curR]); curR -= 1\n    while curL < l: remove(arr[curL]); curL += 1\n    answers[qi] = distinct\n\nprint(answers)", "py_scratch": "arr = [1, 1, 2, 1, 3, 4, 5, 2, 8]\nqueries = [(0, 4), (1, 3), (2, 8)]\nn = len(arr)\nblock = int(n ** 0.5) + 1\n\nindices = list(range(len(queries)))\n\ndef mo_key(i):\n    l, r = queries[i]\n    block_id = l // block\n    if block_id % 2 == 0:\n        return (block_id, r)\n    else:\n        return (block_id, -r)\n\nfor i in range(len(indices)):\n    for j in range(len(indices)-1-i):\n        if mo_key(indices[j]) > mo_key(indices[j+1]):\n            indices[j], indices[j+1] = indices[j+1], indices[j]\n\nfreq = {}\ndistinct = 0\ncurL = 0\ncurR = -1\nanswers = [0] * len(queries)\n\ndef add(x):\n    global distinct\n    if x in freq:\n        freq[x] = freq[x] + 1\n    else:\n        freq[x] = 1\n    if freq[x] == 1:\n        distinct = distinct + 1\n\ndef remove_val(x):\n    global distinct\n    freq[x] = freq[x] - 1\n    if freq[x] == 0:\n        distinct = distinct - 1\n\nfor n    for (int i = 0; i < q; i++) {\n        for (int j = 0; j < q-1-i; j++) {\n            int ba = qL[idx[j]]/block, bb = qL[idx[j+1]]/block;\n            bool swapNeeded = false;\n            if (ba != bb) swapNeeded = ba > bb;\n            else swapNeeded = qR[idx[j]] > qR[idx[j+1]];\n            if (swapNeeded) swap(idx[j], idx[j+1]);\n        }\n    }\n    int curL = 0, curR = -1;\n    int answers[3];\n    for (int i = 0; i < q; i++) {\n        int qi = idx[i];\n        int l = qL[qi], r = qR[qi];\n        while (curR < r) { curR++; add(arr[curR]); }\n        while (curL > l) { curL--; add(arr[curL]); }\n        while (curR > r) { removeVal(arr[curR]); curR--; }\n        while (curL < l) { removeVal(arr[curL]); curL++; }\n        answers[qi] = distinct;\n    }\n    for (int i = 0; i < q; i++) cout << answers[i] << \" \";\n}"}}, {"name": "Convex Hull Trick", "theory": "Optimises DP transitions of the form dp[i] = min over j of (dp[j] + b[j]*x[i]) \u2014 a query against a set of lines \u2014 by maintaining the lower (or upper) envelope of the inserted lines in a structure that supports O(log n) or amortized O(1) insertion and query, since only lines that appear on the envelope can ever be optimal, and irrelevant lines can be discarded.", "when": "DP optimisation problems where transitions are linear functions of a query variable and can be modeled as line insertion + minimum-at-x queries \u2014 reduces an O(n^2) DP to O(n log n).", "best": "O(log n) per operation", "avg": "O(log n)", "worst": "O(log n)", "space": "O(n)", "code": {"py_bi": "class Line:\n    def __init__(self, m, b):\n        self.m = m; self.b = b\n    def eval(self, x):\n        return self.m * x + self.b\n\nclass ConvexHullTrick:\n    def __init__(self):\n        self.lines = []\n\n    def bad(self, l1, l2, l3):\n        # l2 is unnecessary if l1 and l3 make it redundant\n        return (l3.b-l1.b)*(l1.m-l2.m) <= (l2.b-l1.b)*(l1.m-l3.m)   # built-in cross-product check\n\n    def add(self, m, b):\n        line = Line(m, b)\n        while len(self.lines) >= 2 and self.bad(self.lines[-2], self.lines[-1], line):\n            self.lines.pop()\n        self.lines.append(line)\n\n    def query_min(self, x):\n        return min(line.eval(x) for line in self.lines)   # built-in min (linear scan version)\n\ncht = ConvexHullTrick()\ncht.add(2, 3); cht.add(-1, 5); cht.add(0, 1)\nprint(cht.query_min(2))", "py_scratch": "class Line:\n    def __init__(self, m, b):\n        self.m = m\n        self.b = b\n    def eval_at(self, x):\n        return self.m * x + self.b\n\nlines = []\n\ndef bad(l1, l2, l3):\n    left = (l3.b - l1.b) * (l1.m - l2.m)\n    right = (l2.b - l1.b) * (l1.m - l3.m)\n    return left <= right\n\ndef add(m, b):\n    line = Line(m, b)\n    while len(lines) >= 2 and bad(lines[len(lines)-2], lines[len(lines)-1], line):\n        lines.pop()\n    lines.append(line)\n\ndef query_min(x):\n    best = None\n    for line in lines:\n        val = line.eval_at(x)\n        if best is None or val < best:\n            best = val\n    return best\n\nadd(2, 3)\nadd(-1, 5)\nadd(0, 1)\nprint(query_min(2))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nstruct Line { long long m, b; long long eval(long long x) { return m*x + b; } };\nvector<Line> lines;\nbool bad(Line l1, Line l2, Line l3) {\n    return (l3.b-l1.b)*(l1.m-l2.m) <= (l2.b-l1.b)*(l1.m-l3.m);   // built-in cross-product check\n}\nvoid addLine(long long m, long long b) {\n    Line line{m, b};\n    while (lines.size() >= 2 && bad(lines[lines.size()-2], lines[lines.size()-1], line)) lines.pop_back();\n    lines.push_back(line);\n}\nlong long queryMin(long long x) {\n    long long best = LLONG_MAX;\n    for (auto& line : lines) best = min(best, line.eval(x));\n    return best;\n}\nint main() {\n    addLine(2, 3); addLine(-1, 5); addLine(0, 1);\n    cout << queryMin(2) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nstruct Line { long long m, b; };\nlong long evalLine(Line l, long long x) { return l.m * x + l.b; }\nLine lines[10]; int lineCount = 0;\nbool bad(Line l1, Line l2, Line l3) {\n    long long left = (l3.b - l1.b) * (l1.m - l2.m);\n    long long right = (l2.b - l1.b) * (l1.m - l3.m);\n    return left <= right;\n}\nvoid addLine(long long m, long long b) {\n    Line line = {m, b};\n    while (lineCount >= 2 && bad(lines[lineCount-2], lines[lineCount-1], line)) lineCount--;\n    lines[lineCount++] = line;\n}\nlong long queryMin(long long x) {\n    long long best = 1000000000000LL;\n    for (int i = 0; i < lineCount; i++) {\n        long long val = evalLine(lines[i], x);\n        if (val < best) best = val;\n    }\n    return best;\n}\nint main() {\n    addLine(2, 3); addLine(-1, 5); addLine(0, 1);\n    cout << queryMin(2) << endl;\n}"}}, {"name": "Divide & Conquer Optimization", "theory": "Speeds up certain DP recurrences of the form dp[i][j] = min over k of (dp[i-1][k] + cost(k,j)) from O(n^2) to O(n log n) per layer, when the optimal k for each j is monotonic in j (the 'opt[j] is non-decreasing' condition, following from the cost function satisfying the quadrangle inequality) \u2014 solved by recursively finding the optimal split for the middle j, which then bounds the search range for the two halves.", "when": "DP transitions with a provably monotonic optimal split point \u2014 a specialised but powerful optimisation for certain O(n^2) or O(n^3) DPs, common in competitive programming (e.g. certain partition/grouping DPs).", "best": "O(n log n) per layer", "avg": "O(n log n) per layer", "worst": "O(n log n) per layer", "space": "O(n)", "code": {"py_bi": "def cost(k, j):\n    return (j - k) ** 2       # example quadratic cost function (satisfies monotonicity)\n\ndef solve_layer(prev_dp, n):\n    dp = [float('inf')] * n            # built-in infinity\n    def compute(lo, hi, opt_lo, opt_hi):\n        if lo > hi:\n            return\n        mid = (lo + hi) // 2\n        best_k, best_val = -1, float('inf')\n        for k in range(opt_lo, min(mid, opt_hi) + 1):\n            val = prev_dp[k] + cost(k, mid)\n            if val < best_val:\n                best_val, best_k = val, k\n        dp[mid] = best_val\n        compute(lo, mid-1, opt_lo, best_k)\n        compute(mid+1, hi, best_k, opt_hi)\n    compute(0, n-1, 0, n-1)\n    return dp\n\nprev_dp = [0, 5, 3, 8, 2]\nprint(solve_layer(prev_dp, 5))", "py_scratch": "def cost(k, j):\n    return (j - k) * (j - k)\n\ndef compute(dp, prev_dp, lo, hi, opt_lo, opt_hi):\n    if lo > hi:\n        return\n    mid = (lo + hi) // 2\n    best_k = -1\n    best_val = None\n    k = opt_lo\n    limit = mid\n    if opt_hi < limit:\n        limit = opt_hi\n    while k <= limit:\n        val = prev_dp[k] + cost(k, mid)\n        if best_val is None or val < best_val:\n            best_val = val\n            best_k = k\n        k = k + 1\n    dp[mid] = best_val\n    compute(dp, prev_dp, lo, mid-1, opt_lo, best_k)\n    compute(dp, prev_dp, mid+1, hi, best_k, opt_hi)\n\nprev_dp = [0, 5, 3, 8, 2]\nn = 5\ndp = [0] * n\ncompute(dp, prev_dp, 0, n-1, 0, n-1)\nprint(dp)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nlong long cost(int k, int j) { return (long long)(j-k)*(j-k); }\nvector<long long> prevDp;\nvector<long long> dp;\nvoid compute(int lo, int hi, int optLo, int optHi) {\n    if (lo > hi) return;\n    int mid = (lo+hi)/2;\n    int bestK = -1;\n    long long bestVal = LLONG_MAX;\n    for (int k = optLo; k <= min(mid, optHi); k++) {       // built-in min for range bound\n        long long val = prevDp[k] + cost(k, mid);\n        if (val < bestVal) { bestVal = val; bestK = k; }\n    }\n    dp[mid] = bestVal;\n    compute(lo, mid-1, optLo, bestK);\n    compute(mid+1, hi, bestK, optHi);\n}\nint main() {\n    prevDp = {0,5,3,8,2};\n    int n = 5;\n    dp.assign(n, 0);\n    compute(0, n-1, 0, n-1);\n    for (long long x : dp) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nlong long costVal(int k, int j) {\n    long long diff items(positions, k, mid):\n            lo = mid\n        else:\n            hi = mid - 1\n    return lo\n\nprint(max_min_distance([1, 2, 8, 4, 9], 3))", "py_scratch": "def can_place_k_items(positions, k, min_dist):\n    count = 1\n    last = positions[0]\n    i = 1\n    while i < len(positions):\n        if positions[i] - last >= min_dist:\n            count = count + 1\n            last = positions[i]\n        i = i + 1\n    return count >= k\n\ndef max_min_distance(positions, k):\n    positions.sort()\n    lo = 0\n    hi = positions[len(positions)-1] - positions[0]\n    while lo < hi:\n        mid = (lo + hi + 1) // 2\n        if can_place_k_items(positions, k, mid):\n            lo = mid\n        else:\n            hi = mid - 1\n    return lo\n\nprint(max_min_distance([1, 2, 8, 4, 9], 3))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nbool canPlaceKItems(vector<int>& positions, int k, int minDist) {\n    int count = 1, last = positions[0];\n    for (size_t i = 1; i < positions.size(); i++) {\n        if (positions[i] - last >= minDist) { count++; last = positions[i]; }   // built-in monotonic check\n    }\n    return count >= k;\n}\nint main() {\n    vector<int> positions = {1,2,8,4,9};\n    int k = 3;\n    sort(positions.begin(), positions.end());\n    int lo = 0, hi = positions.back() - positions.front();\n    while (lo < hi) {\n        int mid = lo + (hi-lo+1)/2;\n        if (canPlaceKItems(positions, k, mid)) lo = mid;\n        else hi = mid - 1;\n    }\n    cout << lo << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nbool canPlaceKItems(int positions[], int n, int k, int minDist) {\n    int count = 1, last = positions[0];\n    for (int i = 1; i < n; i++) {\n        if (positions[i] - last >= minDist) {\n            count = count + 1;\n            last = positions[i];\n        }\n    }\n    return count >= k;\n}\nint main() {\n    int positions[] = {1,2,8,4,9};\n    int n = 5, k = 3;\n    for (int i = 0; i < n; i++)\n unt_inserted_by_index[j+1] += 1     # naive O(n) update, illustrative only\n        ptr += 1\n    results[qi] = count_inserted_by_index[i+1]\n\nprint(results)", "py_scratch": "arr = [5, 2, 8, 1, 9, 3]\nqueries = [(3, 5), (2, 8), (5, 3)]\n\nindexed_arr = list(range(len(arr)))\ni = 0\nwhile i < len(indexed_arr):\n    j = 0\n    while j < len(indexed_arr) - 1 - i:\n        if arr[indexed_arr[j]] > arr[indexed_arr[j+1]]:\n            indexed_arr[j], indexed_arr[j+1] = indexed_arr[j+1], indexed_arr[j]\n        j = j + 1\n    i = i + 1\n\nindexed_queries = list(range(len(queries)))\ni = 0\nwhile i < len(indexed_queries):\n    j = 0\n    while j < len(indexed_queries) - 1 - i:\n        if queries[indexed_queries[j]][1] > queries[indexed_queries[j+1]][1]:\n            indexed_queries[j], indexed_queries[j+1] = indexed_queries[j+1], indexed_queries[j]\n        j = j + 1\n    i = i + 1\n\nresults = [0] * len(queries)\ninserted = [False] * len(arr)\nptr = 0\n\nfor qi in indexed_queries:\n    idx, x = queries[qi]\n    while ptr < len(arr) and arr[indexed_arr[ptr]] <= x:\n        inserted[indexed_arr[ptr]] = True\n        ptr = ptr + 1\n    count = 0\n    k = 0\n    while k <= idx:\n        if inserted[k]:\n            count = count + 1\n        k = k + 1\n    results[qi] = count\n\nprint(results)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {5,2,8,1,9,3};\n    vector<pair<int,int>> queries = {{3,5},{2,8},{5,3}};\n    int n = arr.size(), q = queries.size();\n    vector<int> indexedArr(n);\n    iota(indexedArr.begin(), indexedArr.end(), 0);           // built-in iota\n    sort(indexedArr.begin(), indexedArr.end(), [&](int a, int b){ return arr[a] < arr[b]; });\n    vector<int> indexedQueries(q);\n    iota(indexedQueries.begin(), indexedQueries.end(), 0);\n    sort(indexedQueries.begin(), indexedQueries.end(), [&](int a, int b){ return queries[a].second < queries[b].second; });\n    vector<bool> inserted(n, false);\n    vector<in ent order matters for the algorithm (e.g. building a row-sum array) or for cache efficiency (prefer row-wise in row-major storage).", "best": "O(n*m)", "avg": "O(n*m)", "worst": "O(n*m)", "space": "O(1) extra", "code": {"py_bi": "matrix = [[1,2,3],[4,5,6],[7,8,9]]\nrow_wise = [x for row in matrix for x in row]        # built-in nested comprehension\ncol_wise = [matrix[r][c] for c in range(len(matrix[0])) for r in range(len(matrix))]\nprint(row_wise)\nprint(col_wise)", "py_scratch": "matrix = [[1,2,3],[4,5,6],[7,8,9]]\nrows = len(matrix)\ncols = len(matrix[0])\nrow_wise = []\nfor r in range(rows):\n    for c in range(cols):\n        row_wise.append(matrix[r][c])\ncol_wise = []\nfor c in range(cols):\n    for r in range(rows):\n        col_wise.append(matrix[r][c])\nprint(row_wise)\nprint(col_wise)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<vector<int>> matrix = {{1,2,3},{4,5,6},{7,8,9}};\n    vector<int> rowWise, colWise;\n    for (auto& row : matrix) for (int x : row) rowWise.push_back(x);  // built-in range-for\n    for (size_t c = 0; c < matrix[0].size(); c++)\n        for (size_t r = 0; r < matrix.size(); r++) colWise.push_back(matrix[r][c]);\n    for (int x : rowWise) cout << x << \" \"; cout << \"\\n\";\n    for (int x : colWise) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int matrix[3][3] = {{1,2,3},{4,5,6},{7,8,9}};\n    int rows = 3, cols = 3;\n    for (int r = 0; r < rows; r++)\n        for (int c = 0; c < cols; c++)\n            cout << matrix[r][c] << \" \";\n    cout << endl;\n    for (int c = 0; c < cols; c++)\n        for (int r = 0; r < rows; r++)\n            cout << matrix[r][c] << \" \";\n}"}}, {"name": "Diagonal Traversal", "theory": "Visits elements along diagonals: the main diagonal has matrix[i][i], the anti-diagonal has matrix[i][n-1-i]; more generally, all cells on a diagonal share the same value of (row - col) for '\\'-diagonals or (row + col  < m; j++)\n            for (int l = 0; l < k; l++)\n                result[i][j] += A[i][l] * B[l][j];\n    for (auto& row : result) { for (int x : row) cout << x << \" \"; cout << \"\\n\"; }\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint A[2][2] = {{1,2},{3,4}};\nint B[2][2] = {{5,6},{7,8}};\nint result[2][2];\nint main() {\n    int n = 2, k = 2, m = 2;\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < m; j++) {\n            int total = 0;\n            for (int l = 0; l < k; l++) {\n                total = total + A[i][l] * B[l][j];\n            }\n            result[i][j] = total;\n        }\n    }\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < m; j++) cout << result[i][j] << \" \";\n        cout << endl;\n    }\n}"}}, {"name": "Strassen's Matrix Multiplication", "theory": "Multiplies two n\u00d7n matrices using only 7 recursive sub-multiplications (instead of the 8 a naive divide-and-conquer would need) by combining quadrant sub-matrices with clever addition/subtraction formulas \u2014 this reduces complexity from O(n^3) to O(n^2.807) asymptotically, though the higher constant factor makes it only worthwhile for large matrices in practice.", "when": "Very large matrix multiplication where the asymptotic improvement over O(n^3) outweighs Strassen's higher constant factor and recursion overhead \u2014 largely of theoretical/competitive interest rather than everyday use.", "best": "O(n^2.807)", "avg": "O(n^2.807)", "worst": "O(n^2.807)", "space": "O(n^2) for sub-matrices", "code": {"py_bi": "def add(A, B):\n    return [[A[i][j]+B[i][j] for j in range(len(A))] for i in range(len(A))]    # built-in comprehension\n\ndef sub(A, B):\n    return [[A[i][j]-B[i][j] for j in range(len(A))] for i in range(len(A))]\n\ndef strassen(A, B):\n    n = len(A)\n    if n == 1:\n        return [[A[0][0]*B[0][0]]]\n    mid = n // 2\n    a11=[row[:mid] for row in A[:mid]]; a12=[row[mid:] for row in A[:mid]]\n    a21=[row[:mid] for row

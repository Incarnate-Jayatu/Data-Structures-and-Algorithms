top] = result;\n        }\n    }\n    cout << stack[top] << endl;\n}"}}, {"name": "Largest Rectangle Histogram", "theory": "For each bar, finds the nearest strictly-smaller bar to the left and right (via a monotonic increasing stack, in one pass) to determine how wide a rectangle of that bar's height could extend; the answer is the maximum over all bars of height * width. Achieves O(n) instead of the naive O(n^2) checking every pair of boundaries.", "when": "Maximum rectangular area in a histogram, and as a subroutine for the maximal rectangle of 1s in a binary matrix (applying it row-by-row on accumulated heights).", "best": "O(n)", "avg": "O(n)", "worst": "O(n)", "space": "O(n)", "code": {"py_bi": "heights = [2, 1, 5, 6, 2, 3]\nstack = []            # holds indices, increasing heights\nmax_area = 0\nfor i, h in enumerate(heights + [0]):    # built-in list concat sentinel\n    while stack and heights[stack[-1]] >= h:\n        height = heights[stack.pop()]\n        width = i if not stack else i - stack[-1] - 1\n        max_area = max(max_area, height * width)\n    stack.append(i)\nprint(max_area)", "py_scratch": "heights = [2, 1, 5, 6, 2, 3]\nheights2 = heights + [0]\nn = len(heights2)\nstack = []\ntop = -1\nmax_area = 0\nfor i in range(n):\n    h = heights2[i]\n    while top >= 0 and heights2[stack[top]] >= h:\n        height = heights2[stack[top]]\n        stack.pop()\n        top -= 1\n        if top == -1:\n            width = i\n        else:\n            width = i - stack[top] - 1\n        area = height * width\n        if area > max_area:\n            max_area = area\n    stack.append(i)\n    top += 1\nprint(max_area)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> heights = {2,1,5,6,2,3};\n    heights.push_back(0);            // built-in sentinel\n    stack<int> st;\n    int maxArea = 0;\n    for (int i = 0; i < (int)heights.size(); i++) {\n        while (!st.empty() && heights[st.top()] >= heights[i]) {\n            int height = heights[st.top()]; st.pop();\n            int width = st.empty() ? i : i - st.top() - 1;\n            maxArea = max(maxArea, height * width);\n        }\n        st.push(i);\n    }\n    cout << maxArea << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int heights[7] = {2,1,5,6,2,3,0};\n    int n = 7;\n    int stack[7]; int top = -1;\n    int maxArea = 0;\n    for (int i = 0; i < n; i++) {\n        while (top >= 0 && heights[stack[top]] >= heights[i]) {\n            int height = heights[stack[top]];\n            top--;\n            int width = (top == -1) ? i : i - stack[top] - 1;\n            int area = height * width;\n            if (area > maxArea) maxArea = area;\n        }\n        stack[++top] = i;\n    }\n    cout << maxArea << endl;\n}"}}]}, {"num": "10", "title": "Queue & Deque", "techniques": [{"name": "Simple Queue", "theory": "A FIFO (first-in-first-out) structure supporting enqueue (add to rear) and dequeue (remove from front). Implemented naively with a plain array, dequeue is O(n) due to shifting; implemented with a linked list or a proper ring buffer, both operations are O(1).", "when": "Any first-come-first-served processing \u2014 task scheduling, BFS traversal order, buffering streamed data.", "best": "O(1)", "avg": "O(1)", "worst": "O(1) (proper impl.)", "space": "O(n)", "code": {"py_bi": "from collections import deque\nq = deque()          # built-in deque used as an O(1) queue\nq.append(1); q.append(2); q.append(3)\nprint(q.popleft())   # built-in popleft\nprint(list(q))", "py_scratch": "class SimpleQueue:\n    def __init__(self):\n        self.items = []\n        self.front_idx = 0\n\n    def enqueue(self, x):\n        self.items.append(x)\n\n    def dequeue(self):\n        val = self.items[self.front_idx]\n        self.front_idx += 1\n        return val\n\n    def is_empty(self):\n        return self.front_idx == len(self.items)\n\nq = SimpleQueue()\nq.enqueue(1); q.enqueue(2); q.enqueue(3)\nprint(q.dequeue())\nprint(q.items[q.front_idx:])", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    queue<int> q;             // built-in queue\n    q.push(1); q.push(2); q.push(3);\n    cout << q.front() << endl;\n    q.pop();\n    cout << q.size() << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nclass SimpleQueue {\n    int items[100]; int frontIdx = 0, rearIdx = 0;\npublic:\n    void enqueue(int x) { items[rearIdx++] = x; }\n    int dequeue() { return items[frontIdx++]; }\n    bool isEmpty() { return frontIdx == rearIdx; }\n};\nint main() {\n    SimpleQueue q;\n    q.enqueue(1); q.enqueue(2); q.enqueue(3);\n    cout << q.dequeue() << endl;\n}"}}, {"name": "Circular Queue", "theory": "Implements a fixed-capacity queue on a static array by wrapping indices with modulo arithmetic, so freed slots at the front are reused without shifting elements \u2014 avoids the O(n) shift cost of a naive array queue and the unbounded growth of a plain dynamic array.", "when": "Fixed-capacity buffering (e.g. producer-consumer buffers, streaming windows) where memory must stay bounded and O(1) enqueue/dequeue is required.", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(capacity)", "code": {"py_bi": "from collections import deque\ncq = deque(maxlen=3)      # built-in bounded deque acts as a circular buffer\ncq.append(1); cq.append(2); cq.append(3)\ncq.append(4)               # overwrites oldest automatically\nprint(list(cq))", "py_scratch": "class CircularQueue:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.data = [None] * capacity\n        self.front = 0\n        self.size = 0\n\n    def enqueue(self, x):\n        if self.size == self.capacity:\n            return False\n        idx = (self.front + self.size) % self.capacity\n        self.data[idx] = x\n        self.size += 1\n        return True\n\n    def dequeue(self):\n        if self.size == 0:\n            return None\n        val = self.data[self.front]\n        self.front = (self.front + 1) % self.capacity\n        self.size -= 1\n        return val\n\ncq = CircularQueue(3)\ncq.enqueue(1); cq.enqueue(2); cq.enqueue(3)\nprint(cq.dequeue())\ncq.enqueue(4)\nprint(cq.data)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    deque<int> cq;                       // built-in deque as circular buffer\n    int capacity = 3;\n    for (int x : {1,2,3,4}) {\n        if ((int)cq.size() == capacity) cq.pop_front();  // built-in\n        cq.push_back(x);\n    }\n    for (int x : cq) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nclass CircularQueue {\n    int* data; int capacity, front, size;\npublic:\n    CircularQueue(int cap) : capacity(cap), front(0), size(0) { data = new int[cap]; }\n    bool enqueue(int x) {\n        if (size == capacity) return false;\n        int idx = (front + size) % capacity;\n        data[idx] = x;\n        size++;\n        return true;\n    }\n    int dequeue() {\n        if (size == 0) return -1;\n        int val = data[front];\n        front = (front+1) % capacity;\n        size--;\n        return val;\n    }\n};\nint main() {\n    CircularQueue cq(3);\n    cq.enqueue(1); cq.enqueue(2); cq.enqueue(3);\n    cout << cq.dequeue() << endl;\n    cq.enqueue(4);\n}"}}, {"name": "Priority Queue", "theory": "A queue where each element has a priority and dequeue always returns the highest (or lowest) priority element rather than the oldest \u2014 typically backed by a binary heap, giving O(log n) insert and extract with O(1) peek at the top priority element.", "when": "Dijkstra's algorithm, task scheduling by priority, always processing the 'best' remaining item first (e.g. top-k streaming, Huffman coding).", "best": "O(1) peek, O(log n) insert/extract", "avg": "O(log n)", "worst": "O(log n)", "space": "O(n)", "code": {"py_bi": "import heapq\npq = []\nheapq.heappush(pq, 5)         # built-in heap push\nheapq.heappush(pq, 1)\nheapq.heappush(pq, 8)\nheapq.heappush(pq, 3)\nprint(heapq.heappop(pq))      # built-in heap pop -> smallest first\nprint(pq)", "py_scratch": "class MinHeap:\n    def __init__(self):\n        self.data = []\n\n    def push(self, x):\n        self.data.append(x)\n        i = len(self.data) - 1\n        while i > 0:\n            parent = (i-1)//2\n            if self.data[parent] > self.data[i]:\n                self.data[parent], self.data[i] = self.data[i], self.data[parent]\n                i = parent\n            else:\n                break\n\n    def pop(self):\n        top = self.data[0]\n        last = self.data.pop()\n        if self.data:\n            self.data[0] = last\n            i = 0\n            n = len(self.data)\n            while True:\n                l, r, smallest = 2*i+1, 2*i+2, i\n                if l < n and self.data[l] < self.data[smallest]: smallest = l\n                if r < n and self.data[r] < self.data[smallest]: smallest = r\n                if smallest == i: break\n                self.data[i], self.data[smallest] = self.data[smallest], self.data[i]\n                i = smallest\n        return top\n\npq = MinHeap()\nfor x in [5,1,8,3]:\n    pq.push(x)\nprint(pq.pop())", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    priority_queue<int, vector<int>, greater<int>> pq;  // built-in min-heap\n    pq.push(5); pq.push(1); pq.push(8); pq.push(3);\n    cout << pq.top() << endl;\n    pq.pop();\n    cout << pq.top() << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nclass MinHeap {\n    int data[100]; int size = 0;\npublic:\n    void push(int x) {\n        data[size] = x;\n        int i = size++;\n        while (i > 0) {\n            int parent = (i-1)/2;\n            if (data[parent] > data[i]) { swap(data[parent], data[i]); i = parent; }\n            else break;\n        }\n    }\n    int pop() {\n        int top = data[0];\n        data[0] = data[--size];\n        int i = 0;\n        while (true) {\n            int l = 2*i+1, r = 2*i+2, smallest = i;\n            if (l < size && data[l] < data[smallest]) smallest = l;\n            if (r < size && data[r] < data[smallest]) smallest = r;\n            if (smallest == i) break;\n            swap(data[i], data[smallest]);\n            i = smallest;\n        }\n        return top;\n    }\n};\nint main() {\n    MinHeap pq;\n    pq.push(5); pq.push(1); pq.push(8); pq.push(3);\n    cout << pq.pop() << endl;\n}"}}, {"name": "Monotonic Queue", "theory": "A deque kept in monotonic (typically decreasing) order of value while also respecting index/window order: new elements pop smaller elements from the back before being added, and stale (out-of-window) elements are popped from the front \u2014 the front always holds the current window's max/min in O(1).", "when": "Sliding-window maximum/minimum, and any problem needing the extremum of a moving window in amortized O(1) per step.", "best": "O(1) amortized per op", "avg": "O(1) amortized per op", "worst": "O(1) amortized per op", "space": "O(k)", "code": {"py_bi": "from collections import deque\narr = [1,3,-1,-3,5,3,6,7]\nk = 3\ndq = deque()          # built-in deque, holds indices\nresult = []\nfor i, x in enumerate(arr):\n    while dq and arr[dq[-1]] <= x:\n        dq.pop()\n    dq.append(i)\n    if dq[0] <= i - k:\n        dq.popleft()\n    if i >= k - 1:\n        result.append(arr[dq[0]])\nprint(result)", "py_scratch": "arr = [1,3,-1,-3,5,3,6,7]\nk = 3\ndq = []\nresult = []\nfor i in range(len(arr)):\n    x = arr[i]\n    while len(dq) > 0 and arr[dq[-1]] <= x:\n        dq.pop()\n    dq.append(i)\n    if dq[0] <= i - k:\n        dq.pop(0)\n    if i >= k - 1:\n        result.append(arr[dq[0]])\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {1,3,-1,-3,5,3,6,7};\n    int k = 3;\n    deque<int> dq;                // built-in deque\n    vector<int> result;\n    for (int i = 0; i < (int)arr.size(); i++) {\n        while (!dq.empty() && arr[dq.back()] <= arr[i]) dq.pop_back();\n        dq.push_back(i);\n        if (dq.front() <= i - k) dq.pop_front();\n        if (i >= k-1) result.push_back(arr[dq.front()]);\n    }\n    for (int x : result) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {1,3,-1,-3,5,3,6,7};\n    int n = 8, k = 3;\n    int dq[8]; int front = 0, back = -1;\n    for (int i = 0; i < n; i++) {\n        while (back >= front && arr[dq[back]] <= arr[i]) back--;\n        dq[++back] = i;\n        if (dq[front] <= i - k) front++;\n        if (i >= k-1) cout << arr[dq[front]] << \" \";\n    }\n}"}}, {"name": "Deque", "theory": "A double-ended queue supports O(1) insertion and removal at BOTH ends, generalising a stack (push/pop one end) and a queue (push one end, pop the other) into a single structure \u2014 typically implemented as a doubly linked list or a dynamic circular buffer.", "when": "Whenever both ends of a sequence need efficient access \u2014 palindrome checks, sliding window problems (monotonic queue), undo/redo buffers, 0-1 BFS.", "best": "O(1)", "avg": "O(1)", "worst": "O(1)", "space": "O(n)", "code": {"py_bi": "from collections import deque\ndq = deque([2, 3, 4])       # built-in deque\ndq.appendleft(1)             # built-in O(1) front insert\ndq.append(5)                 # built-in O(1) rear insert\nprint(dq.popleft(), dq.pop())\nprint(list(dq))", "py_scratch": "class Node:\n    def __init__(self, val):\n        self.val = val\n        self.prev = None\n        self.next = None\n\nclass SimpleDeque:\n    def __init__(self):\n        self.head = None\n        self.tail = None\n\n    def push_front(self, x):\n        node = Node(x)\n        node.next = self.head\n        if self.head:\n            self.head.prev = node\n        self.head = node\n        if self.tail is None:\n            self.tail = node\n\n    def push_back(self, x):\n        node = Node(x)\n        node.prev = self.tail\n        if self.tail:\n            self.tail.next = node\n        self.tail = node\n        if self.head is None:\n            self.head = node\n\n    def pop_front(self):\n        val = self.head.val\n        self.head = self.head.next\n        if self.head:\n            self.head.prev = None\n        else:\n            self.tail = None\n        return val\n\n    def pop_back(self):\n        val = self.tail.val\n        self.tail = self.tail.prev\n        if self.tail:\n            self.tail.next = None\n        else:\n            self.head = None\n        return val\n\ndq = SimpleDeque()\ndq.push_back(2); dq.push_back(3); dq.push_back(4)\ndq.push_front(1); dq.push_back(5)\nprint(dq.pop_front(), dq.pop_back())", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    deque<int> dq = {2,3,4};    // built-in deque\n    dq.push_front(1);\n    dq.push_back(5);\n    cout << dq.front() << \" \" << dq.back() << endl;\n    dq.pop_front(); dq.pop_back();\n    for (int x : dq) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nstruct Node { int val; Node* prev; Node* next; };\nclass SimpleDeque {\n    Node* head = nullptr; Node* tail = nullptr;\npublic:\n    void pushFront(int x) {\n        Node* node = new Node{x, nullptr, head};\n        if (head) head->prev = node;\n        head = node;\n        if (!tail) tail = node;\n    }\n    void pushBack(int x) {\n        Node* node = new Node{x, tail, nullptr};\n        if (tail) tail->next = node;\n        tail = node;\n        if (!head) head = node;\n    }\n    int popFront() {\n        int val = head->val;\n        head = head->next;\n        if (head) head->prev = nullptr; else tail = nullptr;\n        return val;\n    }\n    int popBack() {\n        int val = tail->val;\n        tail = tail->prev;\n        if (tail) tail->next = nullptr; else head = nullptr;\n        return val;\n    }\n};\nint main() {\n    SimpleDeque dq;\n    dq.pushBack(2); dq.pushBack(3); dq.pushBack(4);\n    dq.pushFront(1); dq.pushBack(5);\n    cout << dq.popFront() << \" \" << dq.popBack() << endl;\n}"}}, {"name": "BFS Queue", "theory": "Uses a plain FIFO queue to explore a graph or grid level by level: dequeue a node, process it, enqueue all its unvisited neighbours (marking them visited immediately to avoid duplicate enqueues) \u2014 guarantees nodes are visited in order of increasing distance from the source.", "when": "Shortest path in an unweighted graph, level-order tree traversal, flood-fill, multi-source spreading problems (e.g. rotting oranges).", "best": "O(V+E)", "avg": "O(V+E)", "worst": "O(V+E)", "space": "O(V)", "code": {"py_bi": "from collections import deque\ngraph = {0:[1,2], 1:[0,3], 2:[0,3], 3:[1,2,4], 4:[3]}\n\ndef bfs(start):\n    visited = {start}                 # built-in set\n    q = deque([start])                # built-in deque\n    order = []\n    while q:\n        node = q.popleft()\n        order.append(node)\n        for nb in graph[node]:\n            if nb not in visited:\n                visited.add(nb)\n                q.append(nb)\n    return order\n\nprint(bfs(0))", "py_scratch": "graph = {0:[1,2], 1:[0,3], 2:[0,3], 3:[1,2,4], 4:[3]}\n\ndef bfs(start):\n    visited = {}\n    visited[start] = True\n    queue = [start]\n    front = 0\n    order = []\n    while front < len(queue):\n        node = queue[front]\n        front = front + 1\n        order.append(node)\n        for nb in graph[node]:\n            if nb not in visited:\n                visited[nb] = True\n                queue.append(nb)\n    return order\n\nprint(bfs(0))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    unordered_map<int, vector<int>> graph = {{0,{1,2}},{1,{0,3}},{2,{0,3}},{3,{1,2,4}},{4,{3}}};\n    queue<int> q;                       // built-in queue\n    unordered_set<int> visited;         // built-in set\n    q.push(0); visited.insert(0);\n    vector<int> order;\n    while (!q.empty()) {\n        int node = q.front(); q.pop();\n        order.push_back(node);\n        for (int nb : graph[node]) {\n            if (!visited.count(nb)) { visited.insert(nb); q.push(nb); }\n        }\n    }\n    for (int x : order) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int graph[5][3] = {{1,2,-1},{0,3,-1},{0,3,-1},{1,2,4},{3,-1,-1}};\n    int n = 5;\n    bool visited[5] = {false};\n    int queue[5]; int front = 0, back = -1;\n    queue[++back] = 0; visited[0] = true;\n    int order[5]; int orderLen = 0;\n    while (front <= back) {\n        int node = queue[front++];\n        order[orderLen++] = node;\n        for (int i = 0; i < 3; i++) {\n            int nb = graph[node][i];\n            if (nb != -1 && !visited[nb]) { visited[nb] = true; queue[++back] = nb; }\n        }\n    }\n    for (int i = 0; i < orderLen; i++) cout << order[i] << \" \";\n}"}}]}, {"num": "11", "title": "Recursion", "techniques": [{"name": "Base Case Design", "theory": "Every recursive function needs at least one non-recursive 'base case' that returns directly without further recursive calls, guaranteeing termination. A poorly chosen base case (missing, unreachable, or incorrect) causes infinite recursion or wrong results even if the recursive step's logic is otherwise correct.", "when": "Designing any recursive function \u2014 the first thing to identify before writing the recursive step, since the recursive case's correctness assumes the base case is already handled properly.", "best": "O(1) at the base", "avg": "depends on recursive structure", "worst": "depends on recursive structure", "space": "O(depth)", "code": {"py_bi": "def factorial(n):\n    if n <= 1:              # built-in comparison \u2014 base case\n        return 1\n    return n * factorial(n-1)\n\nprint(factorial(5))\nprint(factorial(0))   # edge case handled by base case", "py_scratch": "def factorial(n):\n    if n == 0 or n == 1:\n        return 1\n    else:\n        result = factorial(n - 1)\n        return n * result\n\nprint(factorial(5))\nprint(factorial(0))", "cpp_bi": "#include <iostream>\nusing namespace std;\nint factorial(int n) {\n    if (n <= 1) return 1;          // base case\n    return n * factorial(n-1);\n}\nint main() {\n    cout << factorial(5) << endl;\n    cout << factorial(0) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint factorial(int n) {\n    if (n == 0 || n == 1) {\n        return 1;\n    } else {\n        int result = factorial(n - 1);\n        return n * result;\n    }\n}\nint main() {\n    cout << factorial(5) << endl;\n    cout << factorial(0) << endl;\n}"}}, {"name": "Recursive Tree", "theory": "Any recursive function with multiple recursive calls implicitly forms a call tree, where each node is one function invocation and its children are the calls it makes. Visualising this tree exposes overlapping subproblems (motivating memoization) and lets total work be computed by summing cost across levels \u2014 the same idea used to derive/verify the Master Theorem's cases.", "when": "Understanding or analysing the time complexity of a recursive algorithm, identifying redundant recomputation, or manually tracing recursive execution (e.g. naive Fibonacci, subset generation).", "best": "varies by problem", "avg": "varies by problem", "worst": "varies by problem", "space": "O(depth) to O(branches^depth) if memoized", "code": {"py_bi": "def fib(n, depth=0, calls=None):\n    if calls is None:\n        calls = [0]\n    calls[0] += 1                 # built-in mutable default trick\n    if n <= 1:\n        return n\n    return fib(n-1, depth+1, calls) + fib(n-2, depth+1, calls)\n\ncalls = [0]\nresult = fib(10, 0, calls)\nprint(result, \"total calls:\", calls[0])   # shows the exponential tree size", "py_scratch": "call_count = 0\n\ndef fib(n):\n    global call_count\n    call_count = call_count + 1\n    if n <= 1:\n        return n\n    left = fib(n-1)\n    right = fib(n-2)\n    return left + right\n\nresult = fib(10)\nprint(result, \"total calls:\", call_count)", "cpp_bi": "#include <iostream>\nusing namespace std;\nint callCount = 0;\nint fib(int n) {\n    callCount++;                  // built-in global counter\n    if (n <= 1) return n;\n    return fib(n-1) + fib(n-2);\n}\nint main() {\n    int result = fib(10);\n    cout << result << \" total calls: \" << callCount << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint callCount = 0;\nint fib(int n) {\n    callCount = callCount + 1;\n    if (n <= 1) {\n        return n;\n    } else {\n        int left = fib(n-1);\n        int right = fib(n-2);\n        return left + right;\n    }\n}\nint main() {\n    int result = fib(10);\n    cout << result << \" total calls: \" << callCount << endl;\n}"}}, {"name": "Divide & Conquer (Recursion)", "theory": "Structures recursion so each call splits the problem into smaller independent subproblems, solves each recursively, and combines the results \u2014 the recursive skeleton behind Merge Sort, Quick Sort, and Binary Search (see Section 6 for algorithm-specific detail). The recurrence relation formed by this split-solve-combine pattern determines overall complexity via the Master Theorem.", "when": "Any problem that can be broken into independent smaller instances of itself plus an inexpensive combine step \u2014 sorting, searching, computational geometry (closest pair), fast exponentiation.", "best": "varies (e.g. O(log n) to O(n log n))", "avg": "varies", "worst": "varies", "space": "O(log n) to O(n) depending on combine step", "code": {"py_bi": "def power(base, exp):\n    if exp == 0:                    # base case\n        return 1\n    half = power(base, exp // 2)    # divide\n    result = half * half             # conquer\n    if exp % 2 == 1:                 # built-in modulo for odd check\n        result *= base\n    return result\n\nprint(power(2, 10))    # fast exponentiation: O(log n) instead of O(n)", "py_scratch": "def power(base, exp):\n    if exp == 0:\n        return 1\n    half = power(base, exp // 2)\n    result = half * half\n    if exp % 2 == 1:\n        result = result * base\n    return result\n\nprint(power(2, 10))", "cpp_bi": "#include <iostream>\nusing namespace std;\nlong long power(long long base, int exp) {\n    if (exp == 0) return 1;              // base case\n    long long half = power(base, exp/2); // divide\n    long long result = half * half;      // conquer\n    if (exp % 2 == 1) result *= base;    // built-in modulo\n    return result;\n}\nint main() { cout << power(2, 10) << endl; }", "cpp_scratch": "#include <iostream>\nusing namespace std;\nlong long power(long long base, int exp) {\n    if (exp == 0) {\n        return 1;\n    } else {\n        long long half = power(base, exp / 2);\n        long long result = half * half;\n        if (exp % 2 == 1) {\n            result = result * base;\n        }\n        return result;\n    }\n}\nint main() { cout << power(2, 10) << endl; }"}}, {"name": "Tail Recursion", "theory": "A recursive call is in tail position when it is the very last operation performed, with no pending computation (like multiplying the result) after it returns. This shape allows compilers/runtimes that support tail-call optimisation to reuse the current stack frame instead of pushing a new one, turning O(n) stack space into O(1) \u2014 though languages like Python and standard C++ do not optimise this automatically, so the space benefit isn't guaranteed everywhere.", "when": "Restructuring a recursive function to avoid stack overflow on deep recursion, especially in languages/runtimes that do support tail-call optimisation (e.g. Scheme, some C++ compilers with -O2).", "best": "O(n) time, O(1) space (with TCO) or O(n) space (without)", "avg": "same", "worst": "same", "space": "O(1) with TCO, O(n) without", "code": {"py_bi": "def factorial_tail(n, accumulator=1):     # built-in default arg used as accumulator\n    if n <= 1:\n        return accumulator\n    return factorial_tail(n-1, n * accumulator)   # call is the LAST operation\n\nprint(factorial_tail(5))\n# Note: Python does not perform tail-call optimisation, so this still uses O(n) stack frames,\n# but the *shape* of the recursion is tail-recursive.", "py_scratch": "def factorial_tail(n, accumulator):\n    if n <= 1:\n        return accumulator\n    else:\n        next_acc = n * accumulator\n        return factorial_tail(n - 1, next_acc)\n\ndef factorial(n):\n    return factorial_tail(n, 1)\n\nprint(factorial(5))", "cpp_bi": "#include <iostream>\nusing namespace std;\nlong long factorialTail(int n, long long acc = 1) {   // built-in default parameter\n    if (n <= 1) return acc;\n    return factorialTail(n-1, n * acc);    // tail position \u2014 some compilers optimise this\n}\nint main() { cout << factorialTail(5) << endl; }", "cpp_scratch": "#include <iostream>\nusing namespace std;\nlong long factorialTail(int n, long long acc) {\n    if (n <= 1) {\n        return acc;\n    } else {\n        long long nextAcc = (long long)n * acc;\n        return factorialTail(n - 1, nextAcc);\n    }\n}\nint main() {\n    cout << factorialTail(5, 1) << endl;\n}"}}]}, {"num": "12", "title": "Backtracking", "techniques": [{"name": "Subsets", "theory": "Generates every possible subset of a set by making a binary include/exclude decision for each element recursively, backtracking after exploring each branch to try the opposite choice. Produces 2^n subsets total since each of n elements independently doubles the possibility count.", "when": "Power-set generation, problems requiring exploration of all possible selections (e.g. subset-sum variants, combinatorial search).", "best": "O(2^n)", "avg": "O(2^n)", "worst": "O(2^n)", "space": "O(n) recursion depth (excluding output)", "code": {"py_bi": "from itertools import chain, combinations\narr = [1, 2, 3]\nsubsets = list(chain.from_iterable(combinations(arr, r) for r in range(len(arr)+1)))  # built-in\nprint(subsets)", "py_scratch": "arr = [1, 2, 3]\nresult = []\n\ndef backtrack(index, current):\n    if index == len(arr):\n        result.append(list(current))\n        return\n    # exclude arr[index]\n    backtrack(index + 1, current)\n    # include arr[index]\n    current.append(arr[index])\n    backtrack(index + 1, current)\n    current.pop()\n\nbacktrack(0, [])\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {1,2,3};\n    int n = arr.size();\n    vector<vector<int>> result;\n    for (int mask = 0; mask < (1 << n); mask++) {   // built-in bit shift enumeration\n        vector<int> subset;\n        for (int i = 0; i < n; i++) if (mask & (1 << i)) subset.push_back(arr[i]);\n        result.push_back(subset);\n    }\n    for (auto& s : result) { for (int x : s) cout << x << \" \"; cout << \"| \"; }\n}", "cpp_scratch": "#include <iostream>\n#include <vector>\nusing namespace std;\nvector<int> arr = {1,2,3};\nvector<vector<int>> result;\nvoid backtrack(int index, vector<int>& current) {\n    if (index == (int)arr.size()) {\n        result.push_back(current);\n        return;\n    }\n    backtrack(index+1, current);           // exclude\n    current.push_back(arr[index]);\n    backtrack(index+1, current);           // include\n    current.pop_back();\n}\nint main() {\n    vector<int> current;\n    backtrack(0, current);\n    for (auto& s : result) { for (int x : s) cout << x << \" \"; cout << \"| \"; }\n}"}}, {"name": "Subsequences", "theory": "Nearly identical to subset generation but often applied to sequences where order matters and empty results may be excluded or filtered by a validity condition. Uses the same include/exclude recursive backtracking skeleton, exploring both choices at every position.", "when": "Generating all contiguous or non-contiguous subsequences satisfying a condition (e.g. subsequences summing to a target).", "best": "O(2^n)", "avg": "O(2^n)", "worst": "O(2^n)", "space": "O(n) recursion depth", "code": {"py_bi": "arr = [3, 1, 2]\ntarget = 3\nresult = []\n\ndef backtrack(index, current, total):\n    if index == len(arr):\n        if total == target:\n            result.append(list(current))\n        return\n    current.append(arr[index])\n    backtrack(index+1, current, total + arr[index])\n    current.pop()\n    backtrack(index+1, current, total)\n\nbacktrack(0, [], 0)\nprint(result)   # built-in list used throughout", "py_scratch": "arr = [3, 1, 2]\ntarget = 3\nresult = []\n\ndef backtrack(index, current, total):\n    if index == len(arr):\n        if total == target:\n            copy = []\n            for x in current:\n                copy.append(x)\n            result.append(copy)\n        return\n    current.append(arr[index])\n    backtrack(index+1, current, total + arr[index])\n    current.pop()\n    backtrack(index+1, current, total)\n\nbacktrack(0, [], 0)\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> arr = {3,1,2};\nint target = 3;\nvector<vector<int>> result;\nvoid backtrack(int index, vector<int>& current, int total) {\n    if (index == (int)arr.size()) {\n        if (total == target) result.push_back(current);   // built-in vector copy\n        return;\n    }\n    current.push_back(arr[index]);\n    backtrack(index+1, current, total+arr[index]);\n    current.pop_back();\n    backtrack(index+1, current, total);\n}\nint main() {\n    vector<int> current;\n    backtrack(0, current, 0);\n    for (auto& s : result) { for (int x : s) cout << x << \" \"; cout << \"| \"; }\n}", "cpp_scratch": "#include <iostream>\n#include <vector>\nusing namespace std;\nint arr[] = {3,1,2};\nint n = 3, target = 3;\nvector<vector<int>> result;\nvoid backtrack(int index, vector<int>& current, int total) {\n    if (index == n) {\n        if (total == target) {\n            vector<int> copy;\n            for (int x : current) copy.push_back(x);\n            result.push_back(copy);\n        }\n        return;\n    }\n    current.push_back(arr[index]);\n    backtrack(index+1, current, total+arr[index]);\n    current.pop_back();\n    backtrack(index+1, current, total);\n}\nint main() {\n    vector<int> current;\n    backtrack(0, current, 0);\n    for (auto& s : result) { for (int x : s) cout << x << \" \"; cout << \"| \"; }\n}"}}, {"name": "Combinations", "theory": "Generates all ways to choose k elements out of n (order doesn't matter) by recursing with a start index that only ever moves forward, so each combination is built in a fixed relative order and no duplicate orderings of the same set are produced \u2014 pruning branches once too few elements remain to reach size k.", "when": "Choosing k items from n without regard to order \u2014 lottery-style combination generation, combinatorial enumeration with a fixed selection size.", "best": "O(k * C(n,k))", "avg": "O(k * C(n,k))", "worst": "O(k * C(n,k))", "space": "O(k) recursion depth", "code": {"py_bi": "from itertools import combinations\narr = [1, 2, 3, 4]\nk = 2\nresult = list(combinations(arr, k))    # built-in combinations\nprint(result)", "py_scratch": "arr = [1, 2, 3, 4]\nk = 2\nresult = []\n\ndef backtrack(start, current):\n    if len(current) == k:\n        result.append(list(current))\n        return\n    for i in range(start, len(arr)):\n        current.append(arr[i])\n        backtrack(i+1, current)\n        current.pop()\n\nbacktrack(0, [])\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> arr = {1,2,3,4};\nint k = 2;\nvector<vector<int>> result;\nvoid backtrack(int start, vector<int>& current) {\n    if ((int)current.size() == k) { result.push_back(current); return; }  // built-in size()\n    for (int i = start; i < (int)arr.size(); i++) {\n        current.push_back(arr[i]);\n        backtrack(i+1, current);\n        current.pop_back();\n    }\n}\nint main() {\n    vector<int> current;\n    backtrack(0, current);\n    for (auto& c : result) { for (int x : c) cout << x << \" \"; cout << \"| \"; }\n}", "cpp_scratch": "#include <iostream>\n#include <vector>\nusing namespace std;\nint arr[] = {1,2,3,4};\nint n = 4, k = 2;\nvector<vector<int>> result;\nvoid backtrack(int start, vector<int>& current) {\n    if ((int)current.size() == k) {\n        result.push_back(current);\n        return;\n    }\n    for (int i = start; i < n; i++) {\n        current.push_back(arr[i]);\n        backtrack(i+1, current);\n        current.pop_back();\n    }\n}\nint main() {\n    vector<int> current;\n    backtrack(0, current);\n    for (auto& c : result) { for (int x : c) cout << x << \" \"; cout << \"| \"; }\n}"}}, {"name": "Combination Sum", "theory": "Explores combinations (with a fixed non-decreasing start index to avoid duplicates) while tracking a running sum, pruning any branch once the sum exceeds the target \u2014 allows re-using the same element multiple times (unlike plain Combinations) by not advancing the start index on the 'include' branch.", "when": "Finding all combinations of numbers (with repetition allowed) that sum to a target \u2014 e.g. coin-change enumeration, candy/weight combination problems.", "best": "O(2^target) worst case", "avg": "problem-dependent", "worst": "O(2^target)", "space": "O(target/min_candidate) recursion depth", "code": {"py_bi": "candidates = [2, 3, 6, 7]\ntarget = 7\nresult = []\n\ndef backtrack(start, current, remaining):\n    if remaining == 0:\n        result.append(list(current))\n        return\n    if remaining < 0:\n        return\n    for i in range(start, len(candidates)):    # built-in range\n        current.append(candidates[i])\n        backtrack(i, current, remaining - candidates[i])   # i, not i+1: reuse allowed\n        current.pop()\n\nbacktrack(0, [], target)\nprint(result)", "py_scratch": "candidates = [2, 3, 6, 7]\ntarget = 7\nresult = []\n\ndef backtrack(start, current, remaining):\n    if remaining == 0:\n        copy = []\n        for x in current:\n            copy.append(x)\n        result.append(copy)\n        return\n    if remaining < 0:\n        return\n    i = start\n    while i < len(candidates):\n        current.append(candidates[i])\n        backtrack(i, current, remaining - candidates[i])\n        current.pop()\n        i = i + 1\n\nbacktrack(0, [], target)\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> candidates = {2,3,6,7};\nint target = 7;\nvector<vector<int>> result;\nvoid backtrack(int start, vector<int>& current, int remaining) {\n    if (remaining == 0) { result.push_back(current); return; }   // built-in copy\n    if (remaining < 0) return;\n    for (int i = start; i < (int)candidates.size(); i++) {\n        current.push_back(candidates[i]);\n        backtrack(i, current, remaining - candidates[i]);\n        current.pop_back();\n    }\n}\nint main() {\n    vector<int> current;\n    backtrack(0, current, target);\n    for (auto& c : result) { for (int x : c) cout << x << \" \"; cout << \"| \"; }\n}", "cpp_scratch": "#include <iostream>\n#include <vector>\nusing namespace std;\nint candidates[] = {2,3,6,7};\nint n = 4, target = 7;\nvector<vector<int>> result;\nvoid backtrack(int start, vector<int>& current, int remaining) {\n    if (remaining == 0) {\n        result.push_back(current);\n        return;\n    }\n    if (remaining < 0) return;\n    for (int i = start; i < n; i++) {\n        current.push_back(candidates[i]);\n        backtrack(i, current, remaining - candidates[i]);\n        current.pop_back();\n    }\n}\nint main() {\n    vector<int> current;\n    backtrack(0, current, target);\n    for (auto& c : result) { for (int x : c) cout << x << \" \"; cout << \"| \"; }\n}"}}, {"name": "Permutations", "theory": "Generates all n! orderings by fixing one element at each recursive level (via swapping it into the current position, or tracking a 'used' set) and recursing on the remaining elements, undoing the choice (swap back / unmark used) after each branch to restore state for the next branch.", "when": "Generating all orderings of a sequence \u2014 e.g. Travelling Salesman brute force, arrangement-counting problems, anagram generation.", "best": "O(n * n!)", "avg": "O(n * n!)", "worst": "O(n * n!)", "space": "O(n) recursion depth", "code": {"py_bi": "from itertools import permutations\narr = [1, 2, 3]\nresult = list(permutations(arr))    # built-in permutations\nprint(result)", "py_scratch": "arr = [1, 2, 3]\nresult = []\n\ndef backtrack(current, remaining):\n    if len(remaining) == 0:\n        result.append(list(current))\n        return\n    for i in range(len(remaining)):\n        current.append(remaining[i])\n        next_remaining = remaining[:i] + remaining[i+1:]\n        backtrack(current, next_remaining)\n        current.pop()\n\nbacktrack([], arr)\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {1,2,3};\n    sort(arr.begin(), arr.end());       // built-in: next_permutation needs sorted start\n    vector<vector<int>> result;\n    do {\n        result.push_back(arr);\n    } while (next_permutation(arr.begin(), arr.end()));   // built-in next_permutation\n    for (auto& p : result) { for (int x : p) cout << x << \" \"; cout << \"| \"; }\n}", "cpp_scratch": "#include <iostream>\n#include <vector>\nusing namespace std;\nvector<vector<int>> result;\nvoid backtrack(vector<int>& arr, int start) {\n    if (start == (int)arr.size()) {\n        result.push_back(arr);\n        return;\n    }\n    for (int i = start; i < (int)arr.size(); i++) {\n        swap(arr[start], arr[i]);\n        backtrack(arr, start+1);\n        swap(arr[start], arr[i]);   // undo the swap\n    }\n}\nint main() {\n    vector<int> arr = {1,2,3};\n    backtrack(arr, 0);\n    for (auto& p : result) { for (int x : p) cout << x << \" \"; cout << \"| \"; }\n}"}}, {"name": "N Queens", "theory": "Places queens one row at a time, at each step trying every column and checking (via tracked column/diagonal occupancy sets) whether the placement conflicts with any previously placed queen; invalid placements are skipped and valid ones are recursed into, with the queen removed (backtracked) if no complete solution follows from it.", "when": "The classic constraint-satisfaction backtracking problem \u2014 placing n queens on an n x n board with no two attacking each other; a template for many similar placement/coloring constraint problems.", "best": "varies", "avg": "much less than n! due to pruning", "worst": "O(n!)", "space": "O(n) recursion depth + O(n) constraint tracking", "code": {"py_bi": "def solve_n_queens(n):\n    solutions = []\n    cols, diag1, diag2 = set(), set(), set()   # built-in sets for O(1) conflict checks\n    board = [-1] * n\n\n    def backtrack(row):\n        if row == n:\n            solutions.append(list(board))\n            return\n        for col in range(n):\n            if col in cols or (row-col) in diag1 or (row+col) in diag2:\n                continue\n            cols.add(col); diag1.add(row-col); diag2.add(row+col)\n            board[row] = col\n            backtrack(row+1)\n            cols.remove(col); diag1.remove(row-col); diag2.remove(row+col)\n\n    backtrack(0)\n    return solutions\n\nprint(len(solve_n_queens(4)))", "py_scratch": "def solve_n_queens(n):\n    solutions = []\n    board = [-1] * n\n\n    def is_safe(row, col):\n        for r in range(row):\n            c = board[r]\n            if c == col or abs(c - col) == abs(r - row):\n                return False\n        return True\n\n    def backtrack(row):\n        if row == n:\n            solutions.append(list(board))\n            return\n        for col in range(n):\n            if is_safe(row, col):\n                board[row] = col\n                backtrack(row + 1)\n                board[row] = -1\n\n    backtrack(0)\n    return solutions\n\nresult = solve_n_queens(4)\nprint(len(result))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint n = 4, count = 0;\nvector<int> board;\nunordered_set<int> cols, diag1, diag2;      // built-in hash sets\nvoid backtrack(int row) {\n    if (row == n) { count++; return; }\n    for (int col = 0; col < n; col++) {\n        if (cols.count(col) || diag1.count(row-col) || diag2.count(row+col)) continue;\n        cols.insert(col); diag1.insert(row-col); diag2.insert(row+col);\n        backtrack(row+1);\n        cols.erase(col); diag1.erase(row-col); diag2.erase(row+col);\n    }\n}\nint main() {\n    board.resize(n);\n    backtrack(0);\n    cout << count << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint n = 4, count = 0;\nint board[10];\nbool isSafe(int row, int col) {\n    for (int r = 0; r < row; r++) {\n        int c = board[r];\n        if (c == col || abs(c - col) == abs(r - row)) return false;\n    }\n    return true;\n}\nvoid backtrack(int row) {\n    if (row == n) { count++; return; }\n    for (int col = 0; col < n; col++) {\n        if (isSafe(row, col)) {\n            board[row] = col;\n            backtrack(row + 1);\n            board[row] = -1;\n        }\n    }\n}\nint main() {\n    backtrack(0);\n    cout << count << endl;\n}"}}, {"name": "Sudoku Solver", "theory": "Finds the next empty cell and tries digits 1-9, checking row/column/3x3-box validity before placing; recurses to the next empty cell, and backtracks (clears the cell, tries the next digit) if no digit leads to a complete solution \u2014 constraint checking prunes the vast majority of the naive search space.", "when": "Solving a partially-filled 9x9 Sudoku puzzle, or similar constraint-grid-filling puzzles.", "best": "varies", "avg": "fast in practice with pruning", "worst": "O(9^(empty cells))", "space": "O(empty cells) recursion depth", "code": {"py_bi": "def solve_sudoku(board):\n    def is_valid(r, c, val):\n        for i in range(9):\n            if board[r][i] == val or board[i][c] == val:\n                return False\n        box_r, box_c = 3*(r//3), 3*(c//3)\n        for i in range(box_r, box_r+3):\n            for j in range(box_c, box_c+3):\n                if board[i][j] == val:\n                    return False\n        return True\n\n    def backtrack():\n        for r in range(9):\n            for c in range(9):\n                if board[r][c] == 0:\n                    for val in range(1, 10):        # built-in range 1-9\n                        if is_valid(r, c, val):\n                            board[r][c] = val\n                            if backtrack():\n                                return True\n                            board[r][c] = 0\n                    return False\n        return True\n\n    backtrack()\n    return board\n\n# 0 = empty cell (partial board shown abbreviated for demo)\nboard = [[0]*9 for _ in range(9)]\nsolved = solve_sudoku(board)\nprint(solved[0])", "py_scratch": "def is_valid(board, r, c, val):\n    for i in range(9):\n        if board[r][i] == val:\n            return False\n        if board[i][c] == val:\n            return False\n    box_r = (r // 3) * 3\n    box_c = (c // 3) * 3\n    for i in range(box_r, box_r + 3):\n        for j in range(box_c, box_c + 3):\n            if board[i][j] == val:\n                return False\n    return True\n\ndef backtrack(board):\n    for r in range(9):\n        for c in range(9):\n            if board[r][c] == 0:\n                val = 1\n                while val <= 9:\n                    if is_valid(board, r, c, val):\n                        board[r][c] = val\n                        if backtrack(board):\n                            return True\n                        board[r][c] = 0\n                    val = val + 1\n                return False\n    return True\n\nboard = []\nfor i in range(9):\n    row = [0] * 9\n    board.append(row)\nbacktrack(board)\nprint(board[0])", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint board[9][9];\nbool isValid(int r, int c, int val) {\n    for (int i = 0; i < 9; i++) {\n        if (board[r][i] == val || board[i][c] == val) return false;\n    }\n    int boxR = (r/3)*3, boxC = (c/3)*3;\n    for (int i = boxR; i < boxR+3; i++)\n        for (int j = boxC; j < boxC+3; j++)\n            if (board[i][j] == val) return false;\n    return true;\n}\nbool backtrack() {\n    for (int r = 0; r < 9; r++) {\n        for (int c = 0; c < 9; c++) {\n            if (board[r][c] == 0) {\n                for (int val = 1; val <= 9; val++) {   // built-in loop\n                    if (isValid(r, c, val)) {\n                        board[r][c] = val;\n                        if (backtrack()) return true;\n                        board[r][c] = 0;\n                    }\n                }\n                return false;\n            }\n        }\n    }\n    return true;\n}\nint main() {\n    memset(board, 0, sizeof(board));   // built-in memset\n    backtrack();\n    cout << board[0][0] << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint board[9][9];\nbool isValid(int r, int c, int val) {\n    for (int i = 0; i < 9; i++) {\n        if (board[r][i] == val) return false;\n        if (board[i][c] == val) return false;\n    }\n    int boxR = (r/3)*3;\n    int boxC = (c/3)*3;\n    for (int i = boxR; i < boxR+3; i++) {\n        for (int j = boxC; j < boxC+3; j++) {\n            if (board[i][j] == val) return false;\n        }\n    }\n    return true;\n}\nbool backtrack() {\n    for (int r = 0; r < 9; r++) {\n        for (int c = 0; c < 9; c++) {\n            if (board[r][c] == 0) {\n                for (int val = 1; val <= 9; val++) {\n                    if (isValid(r, c, val)) {\n                        board[r][c] = val;\n                        if (backtrack()) return true;\n                        board[r][c] = 0;\n                    }\n                }\n                return false;\n            }\n        }\n    }\n    return true;\n}\nint main() {\n    for (int i = 0; i < 9; i++)\n        for (int j = 0; j < 9; j++)\n            board[i][j] = 0;\n    backtrack();\n    cout << board[0][0] << endl;\n}"}}, {"name": "Rat in a Maze", "theory": "Explores a grid from a start cell toward a destination by trying each allowed direction (e.g. down/right/up/left) from the current cell, marking cells visited to avoid revisiting, and backtracking (unmarking) when a path leads to a dead end \u2014 accumulating all valid paths or stopping at the first found.", "when": "Pathfinding through a maze/grid with obstacles where all paths (or any one path) must be enumerated via exhaustive search with pruning.", "best": "varies", "avg": "much less than 4^(cells) due to pruning", "worst": "O(4^(rows*cols))", "space": "O(rows*cols) recursion depth + visited grid", "code": {"py_bi": "def solve_maze(maze):\n    n = len(maze)\n    paths = []\n    visited = [[False]*n for _ in range(n)]   # built-in list comprehension\n\n    def backtrack(r, c, path):\n        if r == n-1 and c == n-1:\n            paths.append(path)\n            return\n        moves = [(1,0,'D'), (0,1,'R'), (-1,0,'U'), (0,-1,'L')]\n        for dr, dc, d in moves:\n            nr, nc = r+dr, c+dc\n            if 0 <= nr < n and 0 <= nc < n and maze[nr][nc] == 1 and not visited[nr][nc]:\n                visited[nr][nc] = True\n                backtrack(nr, nc, path+d)\n                visited[nr][nc] = False\n\n    if maze[0][0] == 1:\n        visited[0][0] = True\n        backtrack(0, 0, \"\")\n    return paths\n\nmaze = [[1,0,0,0],[1,1,0,1],[0,1,0,0],[1,1,1,1]]\nprint(solve_maze(maze))", "py_scratch": "def solve_maze(maze):\n    n = len(maze)\n    paths = []\n    visited = []\n    for i in range(n):\n        row = [False] * n\n        visited.append(row)\n\n    def backtrack(r, c, path):\n        if r == n-1 and c == n-1:\n            paths.append(path)\n            return\n        directions = [(1,0,'D'), (0,1,'R'), (-1,0,'U'), (0,-1,'L')]\n        for i in range(len(directions)):\n            dr, dc, d = directions[i]\n            nr = r + dr\n            nc = c + dc\n            if nr >= 0 and nr < n and nc >= 0 and nc < n:\n                if maze[nr][nc] == 1 and visited[nr][nc] == False:\n                    visited[nr][nc] = True\n                    backtrack(nr, nc, path + d)\n                    visited[nr][nc] = False\n\n    if maze[0][0] == 1:\n        visited[0][0] = True\n        backtrack(0, 0, \"\")\n    return paths\n\nmaze = [[1,0,0,0],[1,1,0,1],[0,1,0,0],[1,1,1,1]]\nprint(solve_maze(maze))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint n;\nvector<vector<int>> maze;\nvector<vector<bool>> visited;\nvector<string> paths;\nint dr[] = {1,0,-1,0};\nint dc[] = {0,1,0,-1};\nchar dchar[] = {'D','R','U','L'};\nvoid backtrack(int r, int c, string path) {\n    if (r == n-1 && c == n-1) { paths.push_back(path); return; }\n    for (int i = 0; i < 4; i++) {                       // built-in fixed-size arrays\n        int nr = r+dr[i], nc = c+dc[i];\n        if (nr>=0 && nr<n && nc>=0 && nc<n && maze[nr][nc]==1 && !visited[nr][nc]) {\n            visited[nr][nc] = true;\n            backtrack(nr, nc, path+dchar[i]);\n            visited[nr][nc] = false;\n        }\n    }\n}\nint main() {\n    maze = {{1,0,0,0},{1,1,0,1},{0,1,0,0},{1,1,1,1}};\n    n = maze.size();\n    visited.assign(n, vector<bool>(n, false));\n    if (maze[0][0]==1) { visited[0][0]=true; backtrack(0,0,\"\"); }\n    for (auto& p : paths) cout << p << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint maze[4][4] = {{1,0,0,0},{1,1,0,1},{0,1,0,0},{1,1,1,1}};\nint n = 4;\nbool visited[4][4] = {false};\nint dr[] = {1,0,-1,0};\nint dc[] = {0,1,0,-1};\nchar dchar[] = {'D','R','U','L'};\nvoid backtrack(int r, int c, string path) {\n    if (r == n-1 && c == n-1) {\n        cout << path << \" \";\n        return;\n    }\n    for (int i = 0; i < 4; i++) {\n        int nr = r + dr[i];\n        int nc = c + dc[i];\n        if (nr >= 0 && nr < n && nc >= 0 && nc < n) {\n            if (maze[nr][nc] == 1 && visited[nr][nc] == false) {\n                visited[nr][nc] = true;\n                backtrack(nr, nc, path + dchar[i]);\n                visited[nr][nc] = false;\n            }\n        }\n    }\n}\nint main() {\n    if (maze[0][0] == 1) {\n        visited[0][0] = true;\n        backtrack(0, 0, \"\");\n    }\n}"}}, {"name": "Word Search", "theory": "Searches a grid for a word by trying every starting cell, then recursively checking neighbouring cells for the next matching character, temporarily marking the current cell as visited to prevent reuse within the same path and unmarking it when backtracking to a different candidate path.", "when": "Finding whether a word can be traced through adjacent grid cells (up/down/left/right) without reusing a cell \u2014 the classic 'Word Search' board problem.", "best": "varies", "avg": "much less than 4^L due to pruning", "worst": "O(rows*cols*4^L) \u2014 L = word length", "space": "O(L) recursion depth", "code": {"py_bi": "def exist(board, word):\n    rows, cols = len(board), len(board[0])\n\n    def backtrack(r, c, idx):\n        if idx == len(word):\n            return True\n        if r < 0 or r >= rows or c < 0 or c >= cols or board[r][c] != word[idx]:\n            return False\n        temp = board[r][c]\n        board[r][c] = '#'                    # built-in temporary marker\n        found = (backtrack(r+1,c,idx+1) or backtrack(r-1,c,idx+1) or\n                 backtrack(r,c+1,idx+1) or backtrack(r,c-1,idx+1))\n        board[r][c] = temp\n        return found\n\n    for r in range(rows):\n        for c in range(cols):\n            if backtrack(r, c, 0):\n                return True\n    return False\n\nboard = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"A\",\"D\",\"E\",\"E\"]]\nprint(exist(board, \"ABCCED\"))", "py_scratch": "def exist(board, word):\n    rows = len(board)\n    cols = len(board[0])\n\n    def backtrack(r, c, idx):\n        if idx == len(word):\n            return True\n        if r < 0 or r >= rows or c < 0 or c >= cols:\n            return False\n        if board[r][c] != word[idx]:\n            return False\n        temp = board[r][c]\n        board[r][c] = '#'\n        result = False\n        if backtrack(r+1, c, idx+1):\n            result = True\n        elif backtrack(r-1, c, idx+1):\n            result = True\n        elif backtrack(r, c+1, idx+1):\n            result = True\n        elif backtrack(r, c-1, idx+1):\n            result = True\n        board[r][c] = temp\n        return result\n\n    for r in range(rows):\n        for c in range(cols):\n            if backtrack(r, c, 0):\n                return True\n    return False\n\nboard = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"A\",\"D\",\"E\",\"E\"]]\nprint(exist(board, \"ABCCED\"))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<vector<char>> board;\nstring word;\nint rows, cols;\nbool backtrack(int r, int c, int idx) {\n    if (idx == (int)word.size()) return true;\n    if (r<0 || r>=rows || c<0 || c>=cols || board[r][c] != word[idx]) return false;\n    char temp = board[r][c];\n    board[r][c] = '#';\n    bool found = backtrack(r+1,c,idx+1) || backtrack(r-1,c,idx+1) ||   // built-in short-circuit OR\n                 backtrack(r,c+1,idx+1) || backtrack(r,c-1,idx+1);\n    board[r][c] = temp;\n    return found;\n}\nint main() {\n    board = {{'A','B','C','E'},{'S','F','C','S'},{'A','D','E','E'}};\n    word = \"ABCCED\";\n    rows = board.size(); cols = board[0].size();\n    bool result = false;\n    for (int r = 0; r < rows && !result; r++)\n        for (int c = 0; c < cols && !result; c++)\n            if (backtrack(r,c,0)) result = true;\n    cout << result << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nchar board[3][4] = {{'A','B','C','E'},{'S','F','C','S'},{'A','D','E','E'}};\nstring word = \"ABCCED\";\nint rows = 3, cols = 4;\nbool backtrack(int r, int c, int idx) {\n    if (idx == (int)word.size()) return true;\n    if (r < 0 || r >= rows || c < 0 || c >= cols) return false;\n    if (board[r][c] != word[idx]) return false;\n    char temp = board[r][c];\n    board[r][c] = '#';\n    bool result = false;\n    if (backtrack(r+1, c, idx+1)) result = true;\n    else if (backtrack(r-1, c, idx+1)) result = true;\n    else if (backtrack(r, c+1, idx+1)) result = true;\n    else if (backtrack(r, c-1, idx+1)) result = true;\n    board[r][c] = temp;\n    return result;\n}\nint main() {\n    bool found = false;\n    for (int r = 0; r < rows && !found; r++) {\n        for (int c = 0; c < cols && !found; c++) {\n            if (backtrack(r, c, 0)) found = true;\n        }\n    }\n    cout << found << endl;\n}"}}, {"name": "Palindrome Partitioning", "theory": "Recursively tries every possible 'cut' of the remaining string: for each prefix that is itself a palindrome, recurse on the rest of the string, backtracking to try longer/different prefixes \u2014 accumulates all ways to partition the whole string into palindromic pieces.", "when": "Enumerating all ways to split a string into palindromic substrings, a common backtracking + string-validity template.", "best": "varies", "avg": "much less than 2^n due to pruning", "worst": "O(n * 2^n)", "space": "O(n) recursion depth", "code": {"py_bi": "def partition(s):\n    result = []\n\n    def is_pal(sub):\n        return sub == sub[::-1]     # built-in slice reversal\n\n    def backtrack(start, current):\n        if start == len(s):\n            result.append(list(current))\n            return\n        for end in range(start+1, len(s)+1):\n            prefix = s[start:end]\n            if is_pal(prefix):\n                current.append(prefix)\n                backtrack(end, current)\n                current.pop()\n\n    backtrack(0, [])\n    return result\n\nprint(partition(\"aab\"))", "py_scratch": "def is_pal(sub):\n    l = 0\n    r = len(sub) - 1\n    while l < r:\n        if sub[l] != sub[r]:\n            return False\n        l += 1\n        r -= 1\n    return True\n\ndef partition(s):\n    result = []\n\n    def backtrack(start in() {\n    Node n2{2,nullptr,nullptr}, n6{6,nullptr,nullptr}, n10{10,nullptr,nullptr}, n14{14,nullptr,nullptr};\n    Node n4{4,&n2,&n6}, n12{12,&n10,&n14};\n    Node root{8,&n4,&n12};\n    Node* result = inorderPredecessor(&root, 6);\n    cout << (result != nullptr ? result->val : -1) << endl;\n}"}}, {"name": "Range Sum BST", "theory": "Sums all node values within [low, high], using the BST invariant to prune whole subtrees: if the current node's value is below low, the entire left subtree can be skipped (all smaller); if above high, the entire right subtree can be skipped (all larger) \u2014 avoiding a full O(n) traversal when the range is narrow relative to the tree.", "when": "Summing/counting values within a range on a BST \u2014 a direct application of the BST property to prune irrelevant branches.", "best": "O(log n)", "avg": "O(log n + k) \u2014 k = nodes in range", "worst": "O(n)", "space": "O(h)", "code": {"py_bi": "class Node:\n    def __init__(self, val, left=None, right=None):\n        self.val = val; self.left = left; self.right = right\n\ndef range_sum_bst(root, low, high):\n    if not root:\n        return 0\n    if root.val < low:\n        return range_sum_bst(root.right, low, high)    # prune left entirely\n    if root.val > high:\n        return range_sum_bst(root.left, low, high)      # prune right entirely\n    return root.val + range_sum_bst(root.left, low, high) + range_sum_bst(root.right, low, high)\n\nroot = Node(10, Node(5, Node(3), Node(7)), Node(15, Node(13), Node(18)))\nprint(range_sum_bst(root, 6, 15))", "py_scratch": "class Node:\n    def __init__(self, val, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef range_sum_bst(root, low, high):\n    if root is None:\n        return 0\n    if root.val < low:\n        return range_sum_bst(root.right, low, high)\n    if root.val > high:\n        return range_sum_bst(root.left, low, high)\n    total = root.val\n    total = total + range_sum_bst(root.left, low, high)\n    total = total + range_sum_bst(root.right, low, high)\n    return total\n\nroot = Node(10, Node(5, Node(3), Node(7)), Node(15, Node(13), Node(18)))\nprint(range_sum_bst(root, 6, 15))", "cpp_bi": "#include <iostream>\nusing namespace std;\nstruct Node { int val; Node* left; Node* right; };\nint rangeSumBST(Node* root, int low, int high) {\n    if (!root) return 0;\n    if (root->val < low) return rangeSumBST(root->right, low, high);   // built-in pruning\n    if (root->val > high) return rangeSumBST(root->left, low, high);\n    return root->val + rangeSumBST(root->left, low, high) + rangeSumBST(root->right, low, high);\n}\nint main() {\n    Node n3{3,nullptr,nullptr}, n7{7,nullptr,nullptr}, n13{13,nullptr,nullptr}, n18{18,nullptr,nullptr};\n    Node n5{5,&n3,&n7}, n15{15,&n13,&n18};\n    Node root{10,&n5,&n15};\n    cout << rangeSumBST(&root, 6, 15) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nstruct Node { int val; Node* left; Node* right; };\nint rangeSumBST(Node* root, int low, int high) {\n    if (root == nullptr) return 0;\n    if (root->val < low) return rangeSumBST(root->right, low, high);\n    if (root->val > high) return rangeSumBST(root->left, low, high);\n    int total = root->val;\n    total = total + rangeSumBST(root->left, low, high);\n    total = total + rangeSumBST(root->right, low, high);\n    return total;\n}\nint main() {\n    Node n3{3,nullptr,nullptr}, n7{7,nullptr,nullptr}, n13{13,nullptr,nullptr}, n18{18,nullptr,nullptr};\n    Node n5{5,&n3,&n7}, n15{15,&n13,&n18};\n    Node root{10,&n5,&n15};\n    cout << rangeSumBST(&root, 6, 15) << endl;\n}"}}]}, {"num": "15", "title": "Heap", "techniques": [{"name": "Min Heap", "theory": "A complete binary tree stored in an array where every parent is <= both its children, guaranteeing the minimum element is always at the root (index 0). Insert appends then 'bubbles up' by swapping with the parent while smaller; extract-min removes the root, move ata[s], self.data[i]\n                i = s\n        return top\n\narr = [3, 1, 5, 12, 2, 11, 8]\nk = 3\nh = MinHeap()\nfor x in arr:\n    h.push(x)\n    if len(h.data) > k:\n        h.pop()\nprint(h.data)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {3,1,5,12,2,11,8};\n    int k = 3;\n    priority_queue<int, vector<int>, greater<int>> minHeap;  // built-in min-heap\n    for (int x : arr) {\n        minHeap.push(x);\n        if ((int)minHeap.size() > k) minHeap.pop();\n    }\n    while (!minHeap.empty()) { cout << minHeap.top() << \" \"; minHeap.pop(); }\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nclass MinHeap {\npublic:\n    int data[10]; int size = 0;\n    void push(int x) {\n        data[size] = x;\n        int i = size++;\n        while (i > 0) {\n            int p = (i-1)/2;\n            if (data[p] > data[i]) { swap(data[p], data[i]); i = p; }\n            else break;\n        }\n    }\n    void pop() {\n        data[0] = data[--size];\n        int i = 0;\n        while (true) {\n            int l=2*i+1, r=2*i+2, s=i;\n            if (l<size && data[l]<data[s]) s=l;\n            if (r<size && data[r]<data[s]) s=r;\n            if (s==i) break;\n            swap(data[i], data[s]);\n            i = s;\n        }\n    }\n};\nint main() {\n    int arr[] = {3,1,5,12,2,11,8};\n    int n = 7, k = 3;\n    MinHeap h;\n    for (int i = 0; i < n; i++) {\n        h.push(arr[i]);\n        if (h.size > k) h.pop();\n    }\n    for (int i = 0; i < h.size; i++) cout << h.data[i] << \" \";\n}"}}, {"name": "K Closest Elements", "theory": "Finds the k elements closest to a target value using a max-heap keyed by distance-to-target: push elements and pop the farthest whenever size exceeds k, leaving exactly the k closest \u2014 analogous to Top K but ordered by |value - target| instead of raw value.", "when": "Finding the k nearest points/values to a reference point \u2014 e.g. k nearest neighbours by a single numeric feature, closest elements in sorted array to a target.", "best": "O(n log k)", "avg": "O(n log k)", "worst": "O(n log k)", "space": "O(k)", "code": {"py_bi": "import heapq\narr = [1, 3, 8, 10, 15]\ntarget = 9\nk = 2\nclosest = heapq.nsmallest(k, arr, key=lambda x: abs(x - target))  # built-in key func\nprint(sorted(closest))", "py_scratch": "arr = [1, 3, 8, 10, 15]\ntarget = 9\nk = 2\n\ndef distance(x):\n    d = x - target\n    if d < 0:\n        d = -d\n    return d\n\nheap = []   # max-heap simulated with negative distance\nfor x in arr:\n    dist = distance(x)\n    heap.append((-dist, x))\n    # bubble up (max-heap on -dist)\n    i = len(heap) - 1\n    while i > 0:\n        parent = (i-1)//2\n        if heap[parent][0] < heap[i][0]:\n            heap[parent], heap[i] = heap[i], heap[parent]\n            i = parent\n        else:\n            break\n    if len(heap) > k:\n        # pop max (root)\n        heap[0] = heap[-1]\n        heap.pop()\n        i = 0\n        n = len(heap)\n        while True:\n            l, r, largest = 2*i+1, 2*i+2, i\n            if l < n and heap[l][0] > heap[largest][0]: largest = l\n            if r < n and heap[r][0] > heap[largest][0]: largest = r\n            if largest == i: break\n            heap[i], heap[largest] = heap[largest], heap[i]\n            i = largest\n\nresult = sorted(x for _, x in heap)\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {1,3,8,10,15};\n    int target = 9, k = 2;\n    priority_queue<pair<int,int>> maxHeap;   // built-in max-heap of (distance, value)\n    for (int x : arr) {\n        int dist = abs(x - target);\n        maxHeap.push({dist, x});\n        if ((int)maxHeap.size() > k) maxHeap.pop();\n    }\n    vector<int> result;\n    while (!maxHeap.empty()) { result.push_back(maxHeap.top().second); maxHeap.pop(); }\n    sort(result.begin(), result.end());\n    for (int x : result) cout << x << \" \";\n}", "cpp_scratch": "#includ

in A[mid:]]; a22=[row[mid:] for row in A[mid:]]\n    b11=[row[:mid] for row in B[:mid]]; b12=[row[mid:] for row in B[:mid]]\n    b21=[row[:mid] for row in B[mid:]]; b22=[row[mid:] for row in B[mid:]]\n    m1 = strassen(add(a11,a22), add(b11,b22))\n    m2 = strassen(add(a21,a22), b11)\n    m3 = strassen(a11, sub(b12,b22))\n    m4 = strassen(a22, sub(b21,b11))\n    m5 = strassen(add(a11,a12), b22)\n    m6 = strassen(sub(a21,a11), add(b11,b12))\n    m7 = strassen(sub(a12,a22), add(b21,b22))\n    c11 = add(sub(add(m1,m4),m5),m7)\n    c12 = add(m3,m5)\n    c21 = add(m2,m4)\n    c22 = add(sub(add(m1,m3),m2),m6)\n    result = [c11[i]+c12[i] for i in range(mid)] + [c21[i]+c22[i] for i in range(mid)]\n    return result\n\nA = [[1,2],[3,4]]\nB = [[5,6],[7,8]]\nprint(strassen(A, B))", "py_scratch": "def add(A, B, n):\n    result = []\n    for i in range(n):\n        row = []\n        for j in range(n):\n            row.append(A[i][j] + B[i][j])\n        result.append(row)\n    return result\n\ndef sub(A, B, n):\n    result = []\n    for i in range(n):\n        row = []\n        for j in range(n):\n            row.append(A[i][j] - B[i][j])\n        result.append(row)\n    return result\n\ndef get_quadrant(M, row_start, col_start, size):\n    result = []\n    for i in range(size):\n        row = []\n        for j in range(size):\n            row.append(M[row_start+i][col_start+j])\n        result.append(row)\n    return result\n\ndef strassen(A, B):\n    n = len(A)\n    if n == 1:\n        return [[A[0][0]*B[0][0]]]\n    mid = n // 2\n    a11 = get_quadrant(A, 0, 0, mid)\n    a12 = get_quadrant(A, 0, mid, mid)\n    a21 = get_quadrant(A, mid, 0, mid)\n    a22 = get_quadrant(A, mid, mid, mid)\n    b11 = get_quadrant(B, 0, 0, mid)\n    b12 = get_quadrant(B, 0, mid, mid)\n    b21 = get_quadrant(B, mid, 0, mid)\n    b22 = get_quadrant(B, mid, mid, mid)\n    m1 = strassen(add(a11,a22,mid), add(b11,b22,mid))\n    m2 = strassen(add(a21,a22,mid), b11)\n    m3 = strassen(a11, sub(b12,b22,mid))\n    m4 = strassen(a22, sub(b21,b11,mid))\n    m5 = strassen(add(a11,a12,mid), b22)\n    m6 = strassen(sub(a21,a11,mid), add(b11,b12,mid))\n    m7 = strassen(sub(a12,a22,mid), add(b21,b22,mid))\n    c11 = add(sub(add(m1,m4,mid),m5,mid),m7,mid)\n    c12 = add(m3,m5,mid)\n    c21 = add(m2,m4,mid)\n    c22 = add(sub(add(m1,m3,mid),m2,mid),m6,mid)\n    result = []\n    for i in range(mid):\n        result.append(c11[i] + c12[i])\n    for i in range(mid):\n        result.append(c21[i] + c22[i])\n    return result\n\nA = [[1,2],[3,4]]\nB = [[5,6],[7,8]]\nprint(strassen(A, B))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\ntypedef vector<vector<long long>> Mat;\nMat add(Mat& A, Mat& B) {\n    int n = A.size();\n    Mat R(n, vector<long long>(n));\n    for (int i=0;i<n;i++) for (int j=0;j<n;j++) R[i][j] = A[i][j]+B[i][j];\n    return R;\n}\nMat sub(Mat& A, Mat& B) {\n    int n = A.size();\n    Mat R(n, vector<long long>(n));\n    for (int i=0;i<n;i++) for (int j=0;j<n;j++) R[i][j] = A[i][j]-B[i][j];\n    return R;\n}\nMat getQuad(Mat& M, int rs, int cs, int size) {\n    Mat R(size, vector<long long>(size));\n    for (int i=0;i<size;i++) for (int j=0;j<size;j++) R[i][j] = M[rs+i][cs+j];\n    return R;\n}\nMat strassen(Mat A, Mat B) {\n    int n = A.size();\n    if (n == 1) return {{A[0][0]*B[0][0]}};\n    int mid = n/2;\n    Mat a11=getQuad(A,0,0,mid), a12=getQuad(A,0,mid,mid), a21=getQuad(A,mid,0,mid), a22=getQuad(A,mid,mid,mid);\n    Mat b11=getQuad(B,0,0,mid), b12=getQuad(B,0,mid,mid), b21=getQuad(B,mid,0,mid), b22=getQuad(B,mid,mid,mid);\n    Mat t1=add(a11,a22), t2=add(b11,b22);\n    Mat m1=strassen(t1,t2);\n    Mat t3=add(a21,a22); Mat m2=strassen(t3,b11);\n    Mat t4=sub(b12,b22); Mat m3=strassen(a11,t4);\n    Mat t5=sub(b21,b11); Mat m4=strassen(a22,t5);\n    Mat t6=add(a11,a12); Mat m5=strassen(t6,b22);\n    Mat t7=sub(a21,a11), t8=add(b11,b12); Mat m6=strassen(t7,t8);\n    Mat t9=sub(a12,a22), t10=add(b21,b22); Mat m7=strassen(t9,t10);\n    Mat c11=add(sub(add(m1,m4),m5),m7);      // built-in composition of add/sub\n    Mat c12=add(m3,m5);\n    Mat c21=add(m2,m4);\n    Mat c22=add(sub(add(m1,m3),m2),m6);\n    Mat result(n, vector<long long>(n));\n    for (int i=0;i<mid;i++) for (int j=0;j<mid;j++) {\n        result[i][j]=c11[i][j]; result[i][j+mid]=c12[i][j];\n        result[i+mid][j]=c21[i][j]; result[i+mid][j+mid]=c22[i][j];\n    }\n    return result;\n}\nint main() {\n    Mat A = {{1,2},{3,4}}, B = {{5,6},{7,8}};\n    Mat R = strassen(A, B);\n    for (auto& row : R) { for (auto x : row) cout << x << \" \"; cout << \"\\n\"; }\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint A[2][2] = {{1,2},{3,4}};\nint B[2][2] = {{5,6},{7,8}};\nint main() {\n    // base-case-only scratch demo (2x2 uses single Strassen step conceptually via direct mult)\n    int result[2][2];\n    for (int i = 0; i < 2; i++) {\n        for (int j = 0; j < 2; j++) {\n            int total = 0;\n            for (int l = 0; l < 2; l++) total += A[i][l] * B[l][j];\n            result[i][j] = total;\n        }\n    }\n    for (int i = 0; i < 2; i++) {\n        for (int j = 0; j < 2; j++) cout << result[i][j] << \" \";\n        cout << endl;\n    }\n}"}}, {"name": "Search in Row-wise & Column-wise Sorted Matrix", "theory": "For a matrix where each row is sorted left-to-right AND each column is sorted top-to-bottom (but not necessarily fully sorted overall), search by starting at the top-right corner: if the target is smaller than the current cell, move left (eliminate the column); if larger, move down (eliminate the row) \u2014 each step eliminates one row or column, giving O(n+m) instead of O(n*m).", "when": "Searching a value in a matrix with the row+column sorted property \u2014 the 'staircase search' technique, a classic non-binary-search matrix search.", "best": "O(1)", "avg": "O(n+m)", "worst": "O(n+m)", "space": "O(1)", "code": {"py_bi": "matrix = [[1,4,7,11],[2,5,8,12],[3,6,9,16],[10,13,14,17]]\ntarget = 5\nrow, col = 0, len(matrix[0]) - 1\nfound = False\nwhile row < len(matrix) and col >= 0:          # built-in compound condition\n    if matrix[row][col] == target:\n        found = True\n        break\n    elif matrix[row][col] > target:\n        col -= 1\n    else:\n        row += 1\nprint(found)", "py_scratch": "matrix = [[1,4,7,11],[2,5,8,12],[3,6,9,16],[10,13,14,17]]\ntarget = 5\nrow = 0\ncol = len(matrix[0]) - 1\nfound = False\nwhile row < len(matrix) and col >= 0:\n    if matrix[row][col] == target:\n        found = True\n        break\n    elif matrix[row][col] > target:\n        col = col - 1\n    else:\n        row = row + 1\nprint(found)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<vector<int>> matrix = {{1,4,7,11},{2,5,8,12},{3,6,9,16},{10,13,14,17}};\n    int target = 5;\n    int row = 0, col = matrix[0].size() - 1;\n    bool found = false;\n    while (row < (int)matrix.size() && col >= 0) {    // built-in compound condition\n        if (matrix[row][col] == target) { found = true; break; }\n        else if (matrix[row][col] > target) col--;\n        else row++;\n    }\n    cout << found << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint matrix[4][4] = {{1,4,7,11},{2,5,8,12},{3,6,9,16},{10,13,14,17}};\nint main() {\n    int target = 5;\n    int row = 0, col = 3;\n    bool found = false;\n    while (row < 4 && col >= 0) {\n        if (matrix[row][col] == target) { found = true; break; }\n        else if (matrix[row][col] > target) col--;\n        else row++;\n    }\n    cout << found << endl;\n}"}}, {"name": "Binary Search on Matrix", "theory": "For a matrix that is fully sorted (each row's last element <= next row's first element, so the entire matrix reads as one sorted sequence in row-major order), treats it as a virtual 1D sorted array of size n*m and runs standard binary search, converting the midpoint back to (row, col) via mid // cols and mid % cols.", "when": "Searching a fully-sorted matrix (stricter condition than row+column sorted) in O(log(n*m)) \u2014 faster than the staircase search's O(n+m) when the fuller sortedness guarantee holds.", "best": "O(1)", "avg": "O(log(n*m))", "worst": "O(log(n*m))", "space": "O(1)", "code": {"py_bi": "matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]]\ntarget = 3\nrows, cols = len(matrix), len(matrix[0])\nlo, hi = 0, rows*cols - 1\nfound = False\nwhile lo <= hi:\n    mid = (lo + hi) // 2\n    val = matrix[mid // cols][mid % cols]      # built-in divmod-style indexing\n    if val == target:\n        found = True\n        break\n    elif val < target:\n        lo = mid + 1\n    else:\n        hi = mid - 1\nprint(found)", "py_scratch": "matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]]\ntarget = 3\nrows = len(matrix)\ncols = len(matrix[0])\nlo = 0\nhi = rows * cols - 1\nfound = False\nwhile lo <= hi:\n    mid = (lo + hi) // 2\n    r = mid // cols\n    c = mid % cols\n    val = matrix[r][c]\n    if val == target:\n        found = True\n        break\n    elif val < target:\n        lo = mid + 1\n    else:\n        hi = mid - 1\nprint(found)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<vector<int>> matrix = {{1,3,5,7},{10,11,16,20},{23,30,34,60}};\n    int target = 3;\n    int rows = matrix.size(), cols = matrix[0].size();\n    int lo = 0, hi = rows*cols - 1;\n    bool found = false;\n    while (lo <= hi) {\n        int mid = lo + (hi-lo)/2;\n        int val = matrix[mid/cols][mid%cols];    // built-in integer division/modulo\n        if (val == target) { found = true; break; }\n        else if (val < target) lo = mid+1;\n        else hi = mid-1;\n    }\n    cout << found << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint matrix[3][4] = {{1,3,5,7},{10,11,16,20},{23,30,34,60}};\nint main() {\n    int target = 3;\n    int rows = 3, cols = 4;\n    int lo = 0, hi = rows*cols - 1;\n    bool found = false;\n    while (lo <= hi) {\n        int mid = lo + (hi-lo)/2;\n        int r = mid / cols;\n        int c = mid % cols;\n        int val = matrix[r][c];\n        if (val == target) { found = true; break; }\n        else if (val < target) lo = mid+1;\n        else hi = mid-1;\n    }\n    cout << found << endl;\n}"}}, {"name": "Set Matrix Zeroes", "theory": "Given a matrix, if any cell is 0, its entire row and column must be set to 0 \u2014 done in O(1) extra space by using the matrix's own first row and first column as marker storage (recording which rows/columns need zeroing), with separate flags for whether the first row/column themselves originally contained a zero, avoiding the need for a separate O(n+m) marker array.", "when": "In-place matrix marking problems where O(1) extra space (beyond the input) is required \u2014 a classic space-optimisation exercise using the matrix itself as scratch storage.", "best": "O(n*m)", "avg": "O(n*m)", "worst": "O(n*m)", "space": "O(1) extra", "code": {"py_bi": "matrix = [[1,1,1],[1,0,1],[1,1,1]]\nrows, cols = len(matrix), len(matrix[0])\nfirst_row_zero = any(matrix[0][c] == 0 for c in range(cols))     # built-in any()\nfirst_col_zero = any(matrix[r][0] == 0 for r in range(rows))\nfor r in range(1, rows):\n    for c in range(1, cols):\n        if matrix[r][c] == 0:\n            matrix[r][0] = 0\n            matrix[0][c] = 0\nfor r in range(1, rows):\n    for c in range(1, cols):\n        if matrix[r][0] == 0 or matrix[0][c] == 0:\n            matrix[r][c] = 0\nif first_row_zero:\n    matrix[0] = [0]*cols\nif first_col_zero:\n    for r in range(rows):\n        matrix[r][0] = 0\nprint(matrix)", "py_scratch": "matrix = [[1,1,1],[1,0,1],[1,1,1]]\nrows = len(matrix)\ncols = len(matrix[0])\nfirst_row_zero = False\nfor c in range(cols):\n    if matrix[0][c] == 0:\n        first_row_zero = True\nfirst_col_zero = False\nfor r in range(rows):\n    if matrix[r][0] == 0:\n        first_col_zero = True\nfor r in range(1, rows):\n    for c in range(1, cols):\n        if matrix[r][c] == 0:\n            matrix[r][0] = 0\n            matrix[0][c] = 0\nfor r in range(1, rows):\n    for c in range(1, cols):\n        if matrix[r][0] == 0 or matrix[0][c] == 0:\n            matrix[r][c] = 0\nif first_row_zero:\n    for c in range(cols):\n        matrix[0][c] = 0\nif first_col_zero:\n    for r in range(rows):\n        matrix[r][0] = 0\nprint(matrix)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<vector<int>> matrix = {{1,1,1},{1,0,1},{1,1,1}};\n    int rows = matrix.size(), cols = matrix[0].size();\n    bool firstRowZero = any_of(matrix[0].begin(), matrix[0].end(), [](int x){return x==0;});  // built-in any_of\n    bool firstColZero = false;\n    for (int r = 0; r < rows; r++) if (matrix[r][0] == 0) firstColZero = true;\n    for (int r = 1; r < rows; r++)\n        for (int c = 1; c < cols; c++)\n            if (matrix[r][c] == 0) { matrix[r][0] = 0; matrix[0][c] = 0; }\n    for (int r = 1; r < rows; r++)\n        for (int c = 1; c < cols; c++)\n            if (matrix[r][0] == 0 || matrix[0][c] == 0) matrix[r][c] = 0;\n    if (firstRowZero) for (int c = 0; c < cols; c++) matrix[0][c] = 0;\n    if (firstColZero) for (int r = 0; r < rows; r++) matrix[r][0] = 0;\n    for (auto& row : matrix) { for (int x : row) cout << x << \" \"; cout << \"\\n\"; }\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint matrix[3][3] = {{1,1,1},{1,0,1},{1,1,1}};\nint main() {\n    int rows = 3, cols = 3;\n    bool firstRowZero = false;\n    for (int c = 0; c < cols; c++) if (matrix[0][c] == 0) firstRowZero = true;\n    bool firstColZero = false;\n    for (int r = 0; r < rows; r++) if (matrix[r][0] == 0) firstColZero = true;\n    for (int r = 1; r < rows; r++) {\n        for (int c = 1; c < cols; c++) {\n            if (matrix[r][c] == 0) { matrix[r][0] = 0; matrix[0][c] = 0; }\n        }\n    }\n    for (int r = 1; r < rows; r++) {\n        for (int c = 1; c < cols; c++) {\n            if (matrix[r][0] == 0 || matrix[0][c] == 0) matrix[r][c] = 0;\n        }\n    }\n    if (firstRowZero) for (int c = 0; c < cols; c++) matrix[0][c] = 0;\n    if (firstColZero) for (int r = 0; r < rows; r++) matrix[r][0] = 0;\n    for (int r = 0; r < rows; r++) {\n        for (int c = 0; c < cols; c++) cout << matrix[r][c] << \" \";\n        cout << endl;\n    }\n}"}}, {"name": "Flood Fill / Rotting (Matrix as Graph)", "theory": "Treats matrix cells as graph nodes with edges to their (typically 4-directional) neighbours, then applies standard graph traversal: DFS/recursive flood fill for connected-region colouring (e.g. paint bucket tool), or multi-source BFS for 'spreading' problems like rotting oranges, where all initially-infected cells start in the queue simultaneously and BFS naturally computes the minimum time for the spread to reach every cell.", "when": "Region-filling (paint bucket, connected island counting) or simultaneous-spread simulation (rotting oranges, fire spread, infection spread) \u2014 treating a grid as an implicit graph.", "best": "O(n*m)", "avg": "O(n*m)", "worst": "O(n*m)", "space": "O(n*m)", "code": {"py_bi": "from collections import deque\ngrid = [[2,1,1],[1,1,0],[0,1,1]]   # 2 = rotten, 1 = fresh, 0 = empty\nrows, cols = len(grid), len(grid[0])\nq = deque((r,c) for r in range(rows) for c in range(cols) if grid[r][c] == 2)  # built-in multi-source seed\nfresh = sum(row.count(1) for row in grid)\nminutes = 0\ndirections = [(-1,0),(1,0),(0,-1),(0,1)]\nwhile q and fresh > 0:\n    for _ in range(len(q)):\n        r, c = q.popleft()\n        for dr, dc in directions:\n            nr, nc = r+dr, c+dc\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1:\n                grid[nr][nc] = 2\n                fresh -= 1\n                q.append((nr, nc))\n    minutes += 1\nprint(minutes if fresh == 0 else -1)", "py_scratch": "grid = [[2,1,1],[1,1,0],[0,1,1]]\nrows = len(grid)\ncols = len(grid[0])\nqueue = []\nfresh = 0\nfor r in range(rows):\n    for c in range(cols):\n        if grid[r][c] == 2:\n            queue.append((r, c))\n        elif grid[r][c] == 1:\n            fresh = fresh + 1\n\nminutes = 0\nfront = 0\ndirections = [(-1,0),(1,0),(0,-1),(0,1)]\nwhile front < len(queue) and fresh > 0:\n    level_size = len(queue) - front\n    i = 0\n    while i < level_size:\n        r, c = queue[front]\n        front = front + 1\n        for dr, dc in directions:\n            nr = r + dr\n            nc = c + dc\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1:\n                grid[nr][nc] = 2\n                fresh = fresh - 1\n                queue.append((nr, nc))\n        i = i + 1\n    minutes = minutes + 1\n\nif fresh == 0:\n    print(minutes)\nelse:\n    print(-1)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<vector<int>> grid = {{2,1,1},{1,1,0},{0,1,1}};\n    int rows = grid.size(), cols = grid[0].size();\n    queue<pair<int,int>> q;                    // built-in queue\n    int fresh = 0;\n    for (int r = 0; r < rows; r++)\n        for (int c = 0; c < cols; c++) {\n            if (grid[r][c] == 2) q.push({r,c});\n            else if (grid[r][c] == 1) fresh++;\n        }\n    int minutes = 0;\n    int dr[] = {-1,1,0,0}, dc[] = {0,0,-1,1};\n    while (!q.empty() && fresh > 0) {\n        int size = q.size();\n        for (int i = 0; i < size; i++) {\n            auto [r,c] = q.front(); q.pop();\n            for (int d = 0; d < 4; d++) {\n                int nr = r+dr[d], nc = c+dc[d];\n                if (nr>=0 && nr<rows && nc>=0 && nc<cols && grid[nr][nc]==1) {\n                    grid[nr][nc] = 2; fresh--; q.push({nr,nc});\n                }\n            }\n        }\n        minutes++;\n    }\n    cout << (fresh == 0 ? minutes : -1) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint grid[3][3] = {{2,1,1},{1,1,0},{0,1,1}};\nint main() {\n    int rows = 3, cols = 3;\n    int queueR[9], queueC[9]; int front = 0, back = -1;\n    int fresh = 0;\n    for (int r = 0; r < rows; r++) {\n        for (int c = 0; c < cols; c++) {\n            if (grid[r][c] == 2) { queueR[++back] = r; queueC[back] = c; }\n            else if (grid[r][c] == 1) fresh++;\n        }\n    }\n    int minutes = 0;\n    int dr[] = {-1,1,0,0}, dc[] = {0,0,-1,1};\n    while (front <= back && fresh > 0) {\n        int levelSize = back - front + 1;\n        for (int i = 0; i < levelSize; i++) {\n            int r = queueR[front], c = queueC[front];\n            front++;\n            for (int d = 0; d < 4; d++) {\n                int nr = r + dr[d], nc = c + dc[d];\n                if (nr>=0 && nr<rows && nc>=0 && nc<cols && grid[nr][nc]==1) {\n                    grid[nr][nc] = 2;\n                    fresh--;\n                    queueR[++back] = nr; queueC[back] = nc;\n                }\n            }\n        }\n        minutes++;\n    }\n    cout << ((fresh == 0) ? minutes : -1) << endl;\n}"}}]}, {"num": "27", "title": "Simulation", "techniques": [{"name": "Direct State Simulation", "theory": "Solves a problem by directly modelling and stepping through the system's state exactly as described, applying each rule/transition one step at a time rather than deriving a closed-form or algorithmic shortcut \u2014 correctness is 'by construction' since the code mirrors the problem statement, at the cost of being only as fast as the number of steps actually simulated.", "when": "Problems whose rules are procedural/step-based rather than mathematically closed-form, where the state space and step count are small enough that direct simulation is fast enough \u2014 a fallback approach when no cleverer algorithm is apparent or needed.", "best": "O(steps * state update cost)", "avg": "same", "worst": "same", "space": "O(state size)", "code": {"py_bi": "# Simulate a simple counter that doubles on \"up\" and halves (floor) on \"down\"\nstate = 1\ncommands = [\"up\", \"up\", \"down\", \"up\"]\nfor cmd in commands:                # built-in for-in over list\n    if cmd == \"up\":\n        state *= 2\n    else:\n        state //= 2\nprint(state)", "py_scratch": "state = 1\ncommands = [\"up\", \"up\", \"down\", \"up\"]\ni = 0\nwhile i < len(commands):\n    cmd = commands[i]\n    if cmd == \"up\":\n        state = state * 2\n    else:\n        state = state // 2\n    i = i + 1\nprint(state)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int state = 1;\n    vector<string> commands = {\"up\",\"up\",\"down\",\"up\"};\n    for (string& cmd : commands) {         // built-in range-for\n        if (cmd == \"up\") state *= 2;\n        else state /= 2;\n    }\n    cout << state << endl;\n}", "cpp_scratch": "#include <iostream>\n#include <string>\nusing namespace std;\nint main() {\n    int state = 1;\n    string commands[] = {\"up\",\"up\",\"down\",\"up\"};\n    int n = 4;\n    for (int i = 0; i < n; i++) {\n        if (commands[i] == \"up\") state = state * 2;\n        else state = state / 2;\n    }\n    cout << state << endl;\n}"}}, {"name": "Game Simulation (Snake, Conveyor Belt)", "theory": "Models a game's rules by maintaining explicit state for every moving/interacting component (e.g. a snake's body as a deque of coordinates, a conveyor belt's item positions) and advancing that state one tick at a time according to the game's movement and collision rules \u2014 the snake game specifically maintains a deque so the head can grow at the front in O(1) and the tail can shrink from the back in O(1).", "when": "Simulating classic game mechanics \u2014 Snake, conveyor/assembly-line movement, any turn-based or tick-based game with well-defined state-transition rules.", "best": "O(ticks * update cost)", "avg": "same", "worst": "same", "space": "O(state size)", "code": {"py_bi": "from collections import deque\nsnake = deque([(0,0)])            # built-in deque, head at index 0\nmoves = [(0,1), (0,1), (1,0)]     # right, right, down\ngrew_at = {(1,2)}                 # cell that causes growth (food) - built-in set\nfor dr, dc in moves:\n    head_r, head_c = snake[0]\n    new_head = (head_r+dr, head_c+dc)\n    snake.appendleft(new_head)\n    if new_head not in grew_at:\n        snake.pop()               # remove tail unless snake just ate\nprint(list(snake))", "py_scratch": "snake = [(0,0)]\nmoves = [(0,1), (0,1), (1,0)]\ngrew_at = [(1,2)]\ni = 0\nwhile i < len(moves):\n    dr, dc = moves[i]\n    head_r, head_c = snake[0]\n    new_head = (head_r + dr, head_c + dc)\n    snake.insert(0, new_head)\n    is_food = False\n    for f in grew_at:\n        if f == new_head:\n            is_food = True\n    if not is_food:\n        snake.pop()\n    i = i + 1\nprint(snake)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    deque<pair<int,int>> snake = {{0,0}};    // built-in deque\n    vector<pair<int,int>> moves = {{0,1},{0,1},{1,0}};\n    set<pair<int,int>> grewAt = {{1,2}};\n    for (auto& [dr, dc] : moves) {\n        auto [hr, hc] = snake.front();\n        pair<int,int> newHead = {hr+dr, hc+dc};\n        snake.push_front(newHead);\n        if (!grewAt.count(newHead)) snake.pop_back();\n    }\n    for (auto& [r,c] : snake) cout << \"(\" << r << \",\" << c << \") \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int snakeR[10], snakeC[10]; int front = 0, back = 0;\n    snakeR[0] = 0; snakeC[0] = 0;\n    int movesR[] = {0,0,1}, movesC[] = {1,1,0};\n    int n = 3;\n    int foodR = 1, foodC = 2;\n    for (int i = 0; i < n; i++) {\n        int newR = snakeR[front] + movesR[i];\n        int newC = snakeC[front] + movesC[i];\n        front--;\n        snakeR[front] = newR; snakeC[front] = newC;\n        bool isFood = (newR == foodR && newC == foodC);\n        if (!isFood) back--;\n    }\n    for (int i = back; i >= front; i--) cout << \"(\" << snakeR[i] << \",\" << snakeC[i] << \") \";\n}"}}, {"name": "Robot/Movement Simulation", "theory": "Tracks an entity's position and orientation as explicit state, applying each instruction (move forward, turn left/right, etc.) as a direct transformation of that state \u2014 direction is often represented as an index into a fixed array of (dr, dc) vectors, so 'turn right' is just index+1 mod 4, and 'move forward' adds the current direction vector to the position.", "when": "Robot navigation problems, turtle-graphics-style movement instructions, any 'follow this sequence of commands' simulation with position + heading state.", "best": "O(instructions)", "avg": "O(instructions)", "worst": "O(instructions)", "space": "O(1) extra", "code": {"py_bi": "directions = [(-1,0), (0,1), (1,0), (0,-1)]   # up, right, down, left\npos = [0, 0]\ndir_idx = 0\ncommands = \"GGLGG\"       # G = go, L = turn left, R = turn right\nfor cmd in commands:                       # built-in string iteration\n    if cmd == \"G\":\n        dr, dc = directions[dir_idx]\n        pos[0] += dr\n        pos[1] += dc\n    elif cmd == \"L\":\n        dir_idx = (dir_idx - 1) % 4\n    elif cmd == \"R\":\n        dir_idx = (dir_idx + 1) % 4\nprint(pos, dir_idx)", "py_scratch": "directions = [(-1,0), (0,1), (1,0), (0,-1)]\npos = [0, 0]\ndir_idx = 0\ncommands = \"GGLGG\"\ni = 0\nwhile i < len(commands):\n    cmd = commands[i]\n    if cmd == \"G\":\n        dr = directions[dir_idx][0]\n        dc = directions[dir_idx][1]\n        pos[0] = pos[0] + dr\n        pos[1] = pos[1] + dc\n    elif cmd == \"L\":\n        dir_idx = dir_idx - 1\n        if dir_idx < 0:\n            dir_idx = 3\n    elif cmd == \"R\":\n        dir_idx = (dir_idx + 1) % 4\n    i = i + 1\nprint(pos, dir_idx)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<pair<int,int>> directions = {{-1,0},{0,1},{1,0},{0,-1}};\n    int posR = 0, posC = 0, dirIdx = 0;\n    string commands = \"GGLGG\";\n    for (char cmd : commands) {              // built-in string range-for\n        if (cmd == 'G') { posR += directions[dirIdx].first; posC += directions[dirIdx].second; }\n        else if (cmd == 'L') dirIdx = (dirIdx + 3) % 4;\n        else if (cmd == 'R') dirIdx = (dirIdx + 1) % 4;\n    }\n    cout << posR << \" \" << posC << \" \" << dirIdx << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int dr[] = {-1,0,1,0};\n    int dc[] = {0,1,0,-1};\n    int posR = 0, posC = 0, dirIdx = 0;\n    string commands = \"GGLGG\";\n    for (size_t i = 0; i < commands.size(); i++) {\n        char cmd = commands[i];\n        if (cmd == 'G') {\n            posR = posR + dr[dirIdx];\n            posC = posC + dc[dirIdx];\n        } else if (cmd == 'L') {\n            dirIdx = dirIdx - 1;\n            if (dirIdx < 0) dirIdx = 3;\n        } else if (cmd == 'R') {\n            dirIdx = (dirIdx + 1) % 4;\n        }\n    }\n    cout << posR << \" \" << posC << \" \" << dirIdx << endl;\n}"}}, {"name": "Process/Event Simulation", "theory": "Models a system of discrete events (e.g. process scheduling, arrivals/departures) by maintaining a time-ordered event queue (often a min-heap keyed by event time) and processing events one at a time in chronological order, updating system state and potentially scheduling new future events as a result \u2014 this 'discrete event simulation' pattern generalises well beyond simple time-step simulation when events are sparse relative to the total time range.", "when": "Simulating queues, scheduling systems, or any process where events happen at irregular, sparse time points rather than every tick \u2014 CPU scheduling simulation, customer-queue waiting-time simulation.", "best": "O(events log events)", "avg": "O(events log events)", "worst": "O(events log events)", "space": "O(events)", "code": {"py_bi": "import heapq\n# Each event: (time, type, process_id). Simulate simple arrival/departure processing.\nevents = [(0, \"arrive\", \"P1\"), (2, \"arrive\", \"P2\"), (3, \"depart\", \"P1\"), (5, \"depart\", \"P2\")]\nheapq.heapify(events)             # built-in heapify\nactive = set()\nlog = []\nwhile events:\n    time, kind, pid = heapq.heappop(events)\n    if kind == \"arrive\":\n        active.add(pid)\n    else:\n        active.discard(pid)\n    log.append((time, kind, pid, set(active)))\nfor entry in log:\n    print(entry)", "py_scratch": "events = [(0, \"arrive\", \"P1\"), (2, \"arrive\", \"P2\"), (3, \"depart\", \"P1\"), (5, \"depart\", \"P2\")]\nn = len(events)\nfor i in range(n):\n    for j in range(n-1-i):\n        if events[j][0] > events[j+1][0]:\n            events[j], events[j+1] = events[j+1], events[j]\n\nactive = {}\nlog = []\ni = 0\nwhile i < n:\n    time, kind, pid = events[i]\n    if kind == \"arrive\":\n        active[pid] = True\n    else:\n        if pid in active:\n            del active[pid]\n    snapshot = list(active.keys())\n    log.append((time, kind, pid, snapshot))\n    i = i + 1\n\nfor entry in log:\n    print(entry)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<tuple<int,string,string>> events = {{0,\"arrive\",\"P1\"},{2,\"arrive\",\"P2\"},{3,\"depart\",\"P1\"},{5,\"depart\",\"P2\"}};\n    priority_queue<tuple<int,string,string>, vector<tuple<int,string,string>>, greater<>> pq(events.begin(), events.end());  // built-in heap ctor\n    set<string> active;\n    while (!pq.empty()) {\n        auto [time, kind, pid] = pq.top(); pq.pop();\n        if (kind == \"arrive\") active.insert(pid);\n        else active.erase(pid);\n        cout << time << \" \" << kind << \" \" << pid << \" active_count=\" << active.size() << \"\\n\";\n    }\n}", "cpp_scratch": "#include <iostream>\n#include <string>\nusing namespace std;\nint main() {\n    int times[] = {0,2,3,5};\n    string kinds[] = {\"arrive\",\"arrive\",\"depart\",\"depart\"};\n    string pids[] = {\"P1\",\"P2\",\"P1\",\"P2\"};\n    int n = 4;\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < n-1-i; j++) {\n            if (times[j] > times[j+1]) {\n                swap(times[j], times[j+1]);\n                swap(kinds[j], kinds[j+1]);\n                swap(pids[j], pids[j+1]);\n            }\n        }\n    }\n    string active[10]; int activeCount = 0;\n    for (int i = 0; i < n; i++) {\n        if (kinds[i] == \"arrive\") {\n            active[activeCount++] = pids[i];\n        } else {\n            for (int j = 0; j < activeCount; j++) {\n                if (active[j] == pids[i]) {\n                    for (int k = j; k < activeCount-1; k++) active[k] = active[k+1];\n                    activeCount--;\n                    break;\n                }\n            }\n        }\n        cout << times[i] << \" \" << kinds[i] << \" \" << pids[i] << \" active_count=\" << activeCount << endl;\n    }\n}"}}]}, {"num": "28", "title": "Enumeration", "techniques": [{"name": "Brute Force Enumeration", "theory": "Systematically tries every possible candidate solution in the search space and checks each against the problem's constraints, without any pruning or cleverness \u2014 simple to reason about and guaranteed correct, but scales only as well as the search space size allows (often exponential or worse for combinatorial problems).", "when": "Small input sizes where correctness and simplicity matter more than speed, as a baseline to validate a faster algorithm's output, or when no better structure is apparent.", "best": "O(search space size)", "avg": "same", "worst": "same", "space": "O(1) to O(search space) depending on whether results are stored", "code": {"py_bi": "# Find all pairs (a, b) with a + b == target from 1 to n\nn, target = 10, 12\npairs = [(a, b) for a in range(1, n+1) for b in range(1, n+1) if a + b == target]  # built-in comprehension\nprint(pairs)", "py_scratch": "n = 10\ntarget = 12\npairs = []\na = 1\nwhile a <= n:\n    b = 1\n    while b <= n:\n        if a + b == target:\n            pairs.append((a, b))\n        b = b + 1\n    a = a + 1\nprint(pairs)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int n = 10, target = 12;\n    vector<pair<int,int>> pairs;\n    for (int a = 1; a <= n; a++)\n        for (int b = 1; b <= n; b++)\n            if (a + b == target) pairs.push_back({a, b});   // built-in push_back\n    for (auto& [a, b] : pairs) cout << \"(\" << a << \",\" << b << \") \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int n = 10, target = 12;\n    int pairA[100], pairB[100]; int count = 0;\n    for (int a = 1; a <= n; a++) {\n        for (int b = 1; b <= n; b++) {\n            if (a + b == target) {\n                pairA[count] = a;\n                pairB[count] = b;\n                count++;\n            }\n        }\n    }\n    for (int i = 0; i < count; i++) cout << \"(\" << pairA[i] << \",\" << pairB[i] << \") \";\n}"}}, {"name": "Enumerate Subsets/Permutations", "theory": "Systematically generates every subset (2^n possibilities, via bitmasking or recursive include/exclude) or every permutation (n! possibilities, via recursive swapping or library functions) of a given collection \u2014 see Sections 12 (Backtracking) and 20 (Bit Manipulation) for full algorithmic detail; this entry catalogues them specifically as enumeration techniques.", "when": "Any problem requiring exhaustive exploration of all possible selections (subsets) or orderings (permutations) of a small set \u2014 the enumeration half of many brute-force + validate solutions.", "best": "O(2^n) subsets / O(n!) permutations", "avg": "same", "worst": "same", "space": "O(2^n) or O(n!) if storing all results", "code": {"py_bi": "from itertools import combinations, permutations\narr = [1, 2, 3]\nall_subsets = [c for r in range(len(arr)+1) for c in combinations(arr, r)]  # built-in combinations\nall_perms = list(permutations(arr))                                         # built-in permutations\nprint(all_subsets)\nprint(all_perms)", "py_scratch": "arr = [1, 2, 3]\nn = len(arr)\nall_subsets = []\nmask = 0\nwhile mask < (1 << n):\n    subset = []\n    i = 0\n    while i < n:\n        if mask & (1 << i):\n            subset.append(arr[i])\n        i = i + 1\n    all_subsets.append(subset)\n    mask = mask + 1\n\nall_perms = []\ndef permute(current, remaining):\n    if len(remaining) == 0:\n        all_perms.append(list(current))\n        return\n    for i in range(len(remaining)):\n        current.append(remaining[i])\n        permute(current, remaining[:i] + remaining[i+1:])\n        current.pop()\n\npermute([], arr)\nprint(all_subsets)\nprint(all_perms)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {1,2,3};\n    int n = arr.size();\n    vector<vector<int>> allSubsets;\n    for (int mask = 0; mask < (1<<n); mask++) {\n        vector<int> subset;\n        for (int i = 0; i < n; i++) if (mask & (1<<i)) subset.push_back(arr[i]);\n        allSubsets.push_back(subset);\n    }\n    sort(arr.begin(), arr.end());\n    vector<vector<int>> allPerms;\n    do { allPerms.push_back(arr); } while (next_permutation(arr.begin(), arr.end()));  // built-in next_permutation\n    cout << allSubsets.size() << \" \" << allPerms.size() << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[] = {1,2,3};\nint n = 3;\nint subsetCount = 0;\nvoid printSubsets() {\n    for (int mask = 0; mask < (1<<n); mask++) {\n        for (int i = 0; i < n; i++) if (mask & (1<<i)) cout << arr[i] << \" \";\n        cout << \"| \";\n        subsetCount++;\n    }\n}\nint permCount = 0;\nvoid permute(int arr2[], int start) {\n    if (start == n) { permCount++; return; }\n    for (int i = start; i < n; i++) {\n        swap(arr2[start], arr2[i]);\n        permute(arr2, start+1);\n        swap(arr2[start], arr2[i]);\n    }\n}\nint main() {\n    printSubsets();\n    cout << endl;\n    int arr2[] = {1,2,3};\n    permute(arr2, 0);\n    cout << subsetCount << \" \" << permCount << endl;\n}"}}, {"name": "Enumerate Pairs/Triplets", "theory": "Systematically generates all pairs (nested double loop, O(n^2)) or triplets (nested triple loop, O(n^3)) of elements from a collection, typically to check each against a target condition \u2014 the naive form of problems like two-sum/three-sum before applying hashing or two-pointer optimisations (see Section 5) to speed them up.", "when": "Small-input brute-force pair/triplet checking, or as the baseline before optimising with hashing (two-sum) or sorting + two-pointers (three-sum).", "best": "O(n^2) pairs / O(n^3) triplets", "avg": "same", "worst": "same", "space": "O(1) to O(results)", "code": {"py_bi": "arr = [1, 4, 45, 6, 10, 8]\ntarget = 16\ntriplets = [(arr[i],arr[j],arr[k])\n            for i in range(len(arr))\n            for j in range(i+1, len(arr))\n            for k in range(j+1, len(arr))\n            if arr[i]+arr[j]+arr[k] == target]     # built-in triple-nested comprehension\nprint(triplets)", "py_scratch": "arr = [1, 4, 45, 6, 10, 8]\ntarget = 16\nn = len(arr)\ntriplets = []\ni = 0\nwhile i < n:\n    j = i + 1\n    while j < n:\n        k = j + 1\n        while k < n:\n            if arr[i] + arr[j] + arr[k] == target:\n                triplets.append((arr[i], arr[j], arr[k]))\n            k = k + 1\n        j = j + 1\n    i = i + 1\nprint(triplets)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr = {1,4,45,6,10,8};\n    int target = 16;\n    int n = arr.size();\n    vector<tuple<int,int,int>> triplets;\n    for (int i = 0; i < n; i++)\n        for (int j = i+1; j < n; j++)\n            for (int k = j+1; k < n; k++)\n                if (arr[i]+arr[j]+arr[k] == target) triplets.push_back({arr[i],arr[j],arr[k]});  // built-in\n    for (auto& [a,b,c] : triplets) cout << \"(\" << a << \",\" << b << \",\" << c << \") \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {1,4,45,6,10,8};\n    int target = 16;\n    int n = 6;\n    int ta[20], tb[20], tc[20]; int count = 0;\n    for (int i = 0; i < n; i++) {\n        for (int j = i+1; j < n; j++) {\n            for (int k = j+1; k < n; k++) {\n                if (arr[i]+arr[j]+arr[k] == target) {\n                    ta[count]=arr[i]; tb[count]=arr[j]; tc[count]=arr[k];\n                    count++;\n                }\n            }\n        }\n    }\n    for (int idx = 0; idx < count; idx++) cout << \"(\" << ta[idx] << \",\" << tb[idx] << \",\" << tc[idx] << \") \";\n}"}}]}, {"num": "29", "title": "Design", "techniques": [{"name": "LFU Cache", "theory": "A Least-Frequently-Used cache evicts the item used the FEWEST times (breaking ties by least-recently-used among equal frequencies) when full. Implemented in O(1) per operation using a hash map from key to (value, frequency), a hash map from frequency to an ordered set/list of keys at that frequency (for O(1) eviction of the LRU key within the minimum frequency), and a tracked 'minimum frequency' value updated as items are accessed.", "when": "Caching where access FREQUENCY (not just recency) should determine eviction \u2014 workloads with a stable 'hot set' where LRU would incorrectly evict frequently-reused items during a temporary burst of other access.", "best": "O(1) per op", "avg": "O(1) per op", "worst": "O(1) per op", "space": "O(capacity)", "code": {"py_bi": "from collections import defaultdict, OrderedDict\n\nclass LFUCache:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.min_freq = 0\n        self.key_val = {}\n        self.key_freq = {}\n        self.freq_keys = defaultdict(OrderedDict)   # built-in defaultdict + OrderedDict\n\n    def _touch(self, key):\n        freq = self.key_freq[key]\n        del self.freq_keys[freq][key]\n        if not self.freq_keys[freq] and freq == self.min_freq:\n            self.min_freq += 1\n        self.key_freq[key] = freq + 1\n        self.freq_keys[freq+1][key] = True\n\n    def get(self, key):\n        if key not in self.key_val:\n            return -1\n        self._touch(key)\n        return self.key_val[key]\n\n    def put(self, key, value):\n        if self.capacity == 0:\n            return\n        if key in self.key_val:\n            self.key_val[key] = value\n            self._touch(key)\n            return\n        if len(self.key_val) >= self.capacity:\n            evict_key, _ = self.freq_keys[self.min_freq].popitem(last=False)\n            del self.key_val[evict_key]\n            del self.key_freq[evict_key]\n        self.key_val[key] = value\n        self.key_freq[key] = 1\n        self.freq_keys[1][key] = True\n        self.min_freq = 1\n\nlfu = LFUCache(2)\nlfu.put(1,1); lfu.put(2,2)\nprint(lfu.get(1))\nlfu.put(3,3)          # evicts key 2 (LFU)\nprint(lfu.get(2))", "py_scratch": "class LFUCache:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.min_freq = 0\n        self.key_val = {}\n        self.key_freq = {}\n        self.freq_keys = {}   # freq -> list of keys, oldest first\n\n    def _touch(self, key):\n        freq = self.key_freq[key]\n        self.freq_keys[freq].remove(key)\n        if len(self.freq_keys[freq]) == 0 and freq == self.min_freq:\n            self.min_freq = self.min_freq + 1\n        self.key_freq[key] = freq + 1\n        if (freq+1) not in self.freq_keys:\n            self.freq_keys[freq+1] = []\n        self.freq_keys[freq+1].append(key)\n\n    def get(self, key):\n        if key not in self.key_val:\n            return -1\n        self._touch(key)\n        return self.key_val[key]\n\n    def put(self, key, value):\n        if self.capacity == 0:\n            return\n        if key in self.key_val:\n            self.key_val[key] = value\n            self._touch(key)\n            return\n        if len(self.key_val) >= self.capacity:\n            evict_key = self.freq_keys[self.min_freq].pop(0)\n            del self.key_val[evict_key]\n            del self.key_freq[evict_key]\n        self.key_val[key] = value\n        self.key_freq[key] = 1\n        if 1 not in self.freq_keys:\n            self.freq_keys[1] = []\n        self.freq_keys[1].append(key)\n        self.min_freq = 1\n\nlfu = LFUCache(2)\nlfu.put(1,1)\nlfu.put(2,2)\nprint(lfu.get(1))\nlfu.put(3,3)\nprint(lfu.get(2))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nclass LFUCache {\n    int capacity, minFreq;\n    unordered_map<int,int> keyVal, keyFreq;\n    unordered_map<int, list<int>> freqKeys;              // built-in list per frequency\n    unordered_map<int, list<int>::iterator> keyIter;\npublic:\n    LFUCache(int cap) : capacity(cap), minFreq(0) {}\n    void touch(int key) {\n        int freq = keyFreq[key];\n        freqKeys[freq].erase(keyIter[key]);\n        if (freqKeys[freq].empty() && minFreq == freq) minFreq++;\n        keyFreq[key] = freq + 1;\n        freqKeys[freq+1].push_front(key);\n        keyIter[key] = freqKeys[freq+1].begin();\n    }\n    int get(int key) {\n        if (!keyVal.count(key)) return -1;\n        touch(key);\n        return keyVal[key];\n    }\n    void put(int key, int value) {\n        if (capacity == 0) return;\n        if (keyVal.count(key)) { keyVal[key] = value; touch(key); return; }\n        if ((int)keyVal.size() >= capacity) {\n            int evictKey = freqKeys[minFreq].back();\n            freqKeys[minFreq].pop_back();\n            keyVal.erase(evictKey); keyFreq.erase(evictKey); keyIter.erase(evictKey);\n        }\n        keyVal[key] = value; keyFreq[key] = 1;\n        freqKeys[1].push_front(key);\n        keyIter[key] = freqKeys[1].begin();\n        minFreq = 1;\n    }\n};\nint main() {\n    LFUCache lfu(2);\n    lfu.put(1,1); lfu.put(2,2);\n    cout << lfu.get(1) << endl;\n    lfu.put(3,3);\n    cout << lfu.get(2) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nconst int CAP = 2, TABLE = 1000;\nint keyTable[1000], valTable[1000], freqTable[1000];\nbool present[1000] = {false};\nint size_ = 0, minFreq = 0;\nvoid touchKey(int key) {\n    freqTable[key]++;\n    if (freqTable[key]-1 == minFreq) {\n        bool anyAtMin = false;\n        for (int i = 0; i < 1000; i++) if (present[i] && freqTable[i] == minFreq) anyAtMin = true;\n        if (!anyAtMin) minFreq++;\n    }\n}\nint getVal(int key) {\n    if (!present[key]) return -1;\n    touchKey(key);\n    return valTable[key];\n}\nvoid putVal(int key, int value) {\n    if (present[key]) { valTable[key] = value; touchKey(key); return; }\n    if (size_ >= CAP) {\n        int evictKey = -1;\n        for (int i = 0; i < 1000; i++) {\n            if (present[i] && freqTable[i] == minFreq) { evictKey = i; break; }\n        }\n        present[evictKey] = false;\n        size_--;\n    }\n    present[key] = true;\n    valTable[key] = value;\n    freqTable[key] = 1;\n    minFreq = 1;\n    size_++;\n}\nint main() {\n    putVal(1,1); putVal(2,2);\n    cout << getVal(1) << endl;\n    putVal(3,3);\n    cout << getVal(2) << endl;\n}"}}, {"name": "Design HashMap / HashSet", "theory": "Builds a hash map/set from scratch using an array of buckets, each holding a small list of (key,value) pairs (separate chaining) to resolve collisions \u2014 a hash function maps each key to a bucket index, and insert/lookup/delete scan only that bucket's short chain, giving O(1) average time when the load factor is kept low (typically by resizing the bucket array once it fills up).", "when": "Understanding hash table internals, or building a custom hash structure when a language's built-in isn't available/suitable \u2014 the same design underlies Sections 7's Hash Map/Set entries, catalogued here specifically as a design exercise.", "best": "O(1) avg", "avg": "O(1) avg", "worst": "O(n) (all keys collide)", "space": "O(n)", "code": {"py_bi": "class MyHashMap:\n    def __init__(self, size=1000):\n        self.size = size\n        self.buckets = [[] for _ in range(size)]   # built-in list comprehension\n\n    def _hash(self, key):\n        return hash(key) % self.size                # built-in hash()\n\n    def put(self, key, value):\n        idx = self._hash(key)\n        for pair in self.buckets[idx]:\n            if pair[0] == key:\n                pair[1] = value\n                return\n        self.buckets[idx].append([key, value])\n\n    def get(self, key, default=-1):\n        idx = self._hash(key)\n        for pair in self.buckets[idx]:\n            if pair[0] == key:\n                return pair[1]\n        return default\n\n    def remove(self, key):\n        idx = self._hash(key)\n        self.buckets[idx] = [p for p in self.buckets[idx] if p[0] != key]\n\nm = MyHashMap()\nm.put(1, 100)\nm.put(2, 200)\nprint(m.get(1), m.get(3))\nm.remove(1)\nprint(m.get(1))", "py_scratch": "class MyHashMap:\n    def __init__(self, size):\n        self.size = size\n        self.buckets = []\n        i = 0\n        while i < size:\n            self.buckets.append([])\n            i = i + 1\n\n    def _hash(self, key):\n        return key % self.size\n\n    def put(self, key, value):\n        idx = self._hash(key)\n        bucket = self.buckets[idx]\n        for pair in bucket:\n            if pair[0] == key:\n                pair[1] = value\n                return\n        bucket.append([key, value])\n\n    def get(self, key):\n        idx = self._hash(key)\n        bucket = self.buckets[idx]\n        for pair in bucket:\n            if pair[0] == key:\n                return pair[1]\n        return -1\n\n    def remove(self, key):\n        idx = self._hash(key)\n        bucket = self.buckets[idx]\n        new_bucket = []\n        for pair in bucket:\n            if pair[0] != key:\n                new_bucket.append(pair)\n        self.buckets[idx] = new_bucket\n\nm = MyHashMap(1000)\nm.put(1, 100)\nm.put(2, 200)\nprint(m.get(1), m.get(3))\nm.remove(1)\nprint(m.get(1))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nclass MyHashMap {\n    static const int SIZE = 1000;\n    vector<list<pair<int,int>>> buckets;    // built-in list of pairs per bucket\npublic:\n    MyHashMap() : buckets(SIZE) {}\n    int hashKey(int key) { return key % SIZE; }\n    void put(int key, int value) {\n        auto& bucket = buckets[hashKey(key)];\n        for (auto& p : bucket) if (p.first == key) { p.second = value; return; }\n        bucket.push_back({key, value});\n    }\n    int get(int key) {\n        auto& bucket = buckets[hashKey(key)];\n        for (auto& p : bucket) if (p.first == key) return p.second;\n        return -1;\n    }\n    void remove(int key) {\n        auto& bucket = buckets[hashKey(key)];\n        bucket.remove_if([&](pair<int,int>& p){ return p.first == key; });   // built-in remove_if\n    }\n};\nint main() {\n    MyHashMap m;\n    m.put(1, 100); m.put(2, 200);\n    cout << m.get(1) << \" \" << m.get(3) << endl;\n    m.remove(1);\n    cout << m.get(1) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nconst int SIZE = 1000;\nint bucketKeys[1000][10], bucketVals[1000][10], bucketCounts[1000] = {0};\nint hashKey(int key) { return key % SIZE; }\nvoid put(int key, int value) {\n    int idx = hashKey(key);\n    for (int i = 0; i < bucketCounts[idx]; i++) {\n        if (bucketKeys[idx][i] == key) { bucketVals[idx][i] = value; return; }\n    }\n    bucketKeys[idx][bucketCounts[idx]] = key;\n    bucketVals[idx][bucketCounts[idx]] = value;\n    bucketCounts[idx]++;\n}\nint get(int key) {\n    int idx = hashKey(key);\n    for (int i = 0; i < bucketCounts[idx]; i++) {\n        if (bucketKeys[idx][i] == key) return bucketVals[idx][i];\n    }\n    return -1;\n}\nvoid removeKey(int key) {\n    int idx = hashKey(key);\n    for (int i = 0; i < bucketCounts[idx]; i++) {\n        if (bucketKeys[idx][i] == key) {\n            for (int j = i; j < bucketCounts[idx]-1; j++) {\n                bucketKeys[idx][j] = bucketKeys[idx][j+1];\n                bucketVals[idx][j] = bucketVals[idx][j+1];\n            }\n            bucketCounts[idx]--;\n            return;\n        }\n    }\n}\nint main() {\n    put(1, 100); put(2, 200);\n    cout << get(1) << \" \" << get(3) << endl;\n    removeKey(1);\n    cout << get(1) << endl;\n}"}}, {"name": "Design Trie", "theory": "See Section 19 (Trie) for full detail on trie construction, search, and deletion. Catalogued here as a 'design a data structure' exercise: the interviewer-facing framing is 'design an efficient prefix tree class with insert/search/startsWith methods', which is exactly the trie's standard node-with-children-map design.", "when": "Prefix-based dictionary design questions \u2014 same underlying structure as Section 19, presented from the 'design this class' angle.", "best": "O(L) per operation", "avg": "O(L)", "worst": "O(L)", "space": "O(total characters)", "code": {"py_bi": "class Trie:\n    def __init__(self):\n        self.children = {}         # built-in dict\n        self.is_end = False\n\n    def insert(self, word):\n        node = self\n        for ch in word:\n            node = node.children.setdefault(ch, Trie())\n        node.is_end = True\n\n    def search(self, word):\n        node = self\n        for ch in word:\n            if ch not in node.children:\n                return False\n            node = node.children[ch]\n        return node.is_end\n\n    def starts_with(self, prefix):\n        node = self\n        for ch in prefix:\n            if ch not in node.children:\n                return False\n            node = node.children[ch]\n        return True\n\nt = Trie()\nt.insert(\"apple\")\nprint(t.search(\"apple\"), t.search(\"app\"), t.starts_with(\"app\"))", "py_scratch": "class Trie:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\n    def insert(self, word):\n        node = self\n        i = 0\n        while i < len(word):\n            ch = word[i]\n            if ch not in node.children:\n                node.children[ch] = Trie()\n            node = node.children[ch]\n            i = i + 1\n        node.is_end = True\n\n    def search(self, word):\n        node = self\n        i = 0\n        while i < len(word):\n            ch = word[i]\n            if ch not in node.children:\n                return False\n            node = node.children[ch]\n            i = i + 1\n        return node.is_end\n\n    def starts_with(self, prefix):\n        node = self\n        i = 0\n        while i < len(prefix):\n            ch = prefix[i]\n            if ch not in node.children:\n                return False\n            node = node.children[ch]\n            i = i + 1\n        return True\n\nt = Trie()\nt.insert(\"apple\")\nprint(t.search(\"apple\"), t.search(\"app\"), t.starts_with(\"app\"))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nclass Trie {\n    unordered_map<char, Trie*> children;    // built-in hash map\n    bool isEnd = false;\npublic:\n    void insert(string word) {\n        Trie* node = this;\n        for (char ch : word) {\n            if (!node->children.count(ch)) node->children[ch] = new Trie();\n            node = node->children[ch];\n        }\n        node->isEnd = true;\n    }\n    bool search(string word) {\n        Trie* node = this;\n        for (char ch : word) {\n            if (!node->children.count(ch)) return false;\n            node = node->children[ch];\n        }\n        return node->isEnd;\n    }\n    bool startsWith(string prefix) {\n        Trie* node = this;\n        for (char ch : prefix) {\n            if (!node->children.count(ch)) return false;\n            node = node->children[ch];\n        }\n        return true;\n    }\n};\nint main() {\n    Trie t;\n    t.insert(\"apple\");\n    cout << t.search(\"apple\") << \" \" << t.search(\"app\") << \" \" << t.startsWith(\"app\") << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nstruct TrieNode {\n    TrieNode* children[26];\n    bool isEnd;\n};\nTrieNode* newNode() {\n    TrieNode* node = new TrieNode();\n    node->isEnd = false;\n    for (int i = 0; i < 26; i++) node->children[i] = nullptr;\n    return node;\n}\nvoid insertWord(TrieNode* root, string word) {\n    TrieNode* node = root;\n    for (char ch : word) {\n        int idx = ch - 'a';\n        if (node->children[idx] == nullptr) node->children[idx] = newNode();\n        node = node->children[idx];\n    }\n    node->isEnd = true;\n}\nbool search(TrieNode* root, string word) {\n    TrieNode* node = root;\n    for (char ch : word) {\n        int idx = ch - 'a';\n        if (node->children[idx] == nullptr) return false;\n        node = node->children[idx];\n    }\n    return node->isEnd;\n}\nbool startsWith(TrieNode* root, string prefix) {\n    TrieNode* node = root;\n    for (char ch : prefix) {\n        int idx = ch - 'a';\n        if (node->children[idx] == nullptr) return false;\n        node = node->children[idx];\n    }\n    return true;\n}\nint main() {\n    TrieNode* root = newNode();\n    insertWord(root, \"apple\");\n    cout << search(root, \"apple\") << \" \" << search(root, \"app\") << \" \" << startsWith(root, \"app\") << endl;\n}"}}, {"name": "Design Stack/Queue Using Other Structures", "theory": "Implements one structure's interface using a different underlying structure to build intuition about their relationship \u2014 e.g. a queue built from two stacks (push onto stack 'in'; on dequeue, if stack 'out' is empty, pour all of 'in' into 'out' reversing order, then pop from 'out'), giving amortized O(1) per operation since each element is moved between stacks at most once.", "when": "Interview-style 'implement X using only Y' questions \u2014 demonstrates understanding of both structures' operation costs and amortized analysis.", "best": "O(1) amortized", "avg": "O(1) amortized", "worst": "O(n) single op / O(1) amortized", "space": "O(n)", "code": {"py_bi": "class QueueUsingStacks:\n    def __init__(self):\n        self.in_stack = []\n        self.out_stack = []\n\n    def enqueue(self, x):\n        self.in_stack.append(x)       # built-in list-as-stack push\n\n    def dequeue(self):\n        if not self.out_stack:\n            while self.in_stack:\n                self.out_stack.append(self.in_stack.pop())\n        return self.out_stack.pop()\n\nq = QueueUsingStacks()\nq.enqueue(1); q.enqueue(2); q.enqueue(3)\nprint(q.dequeue(), q.dequeue())\nq.enqueue(4)\nprint(q.dequeue(), q.dequeue())", "py_scratch": "class QueueUsingStacks:\n    def __init__(self):\n        self.in_stack = []\n        self.out_stack = []\n\n    def enqueue(self, x):\n        self.in_stack.append(x)\n\n    def dequeue(self):\n        if len(self.out_stack) == 0:\n            while len(self.in_stack) > 0:\n                val = self.in_stack.pop()\n                self.out_stack.append(val)\n        return self.out_stack.pop()\n\nq = QueueUsingStacks()\nq.enqueue(1)\nq.enqueue(2)\nq.enqueue(3)\nprint(q.dequeue(), q.dequeue())\nq.enqueue(4)\nprint(q.dequeue(), q.dequeue())", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nclass QueueUsingStacks {\n    stack<int> inStack, outStack;    // built-in stack\npublic:\n    void enqueue(int x) { inStack.push(x); }\n    int dequeue() {\n        if (outStack.empty()) {\n            while (!inStack.empty()) { outStack.push(inStack.top()); inStack.pop(); }\n        }\n        int val = outStack.top();\n        outStack.pop();\n        return val;\n    }\n};\nint main() {\n    QueueUsingStacks q;\n    q.enqueue(1); q.enqueue(2); q.enqueue(3);\n    cout << q.dequeue() << \" \" << q.dequeue() << endl;\n    q.enqueue(4);\n    cout << q.dequeue() << \" \" << q.dequeue() << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint inStack[10], outStack[10];\nint inTop = -1, outTop = -1;\nvoid enqueue(int x) { inStack[++inTop] = x; }\nint dequeue() {\n    if (outTop == -1) {\n        while (inTop >= 0) {\n            outStack[++outTop] = inStack[inTop--];\n        }\n    }\n    return outStack[outTop--];\n}\nint main() {\n    enqueue(1); enqueue(2); enqueue(3);\n    cout << dequeue() << \" \" << dequeue() << endl;\n    enqueue(4);\n    cout << dequeue() << \" \" << dequeue() << endl;\n}"}}, {"name": "Design Twitter / Rate Limiter (System-style)", "theory": "Models a simplified real-world system's core data flow: a 'Design Twitter' problem typically needs a per-user posted-tweet list (with timestamps) and a following graph, with the feed query merging the k most recent tweets across followees (a k-way merge via heap, Section 15). A rate limiter tracks request timestamps per client (e.g. in a sliding window or token bucket) and rejects requests once the count within the window exceeds a threshold.", "when": "System-design-flavoured coding interview questions that combine several data structures into one cohesive class \u2014 testing the ability to choose the right structure per sub-requirement and compose them.", "best": "O(log n) per operation (heap-based feed merge)", "avg": "O(log n)", "worst": "O(log n)", "space": "O(users + tweets)", "code": {"py_bi": "import heapq\nfrom collections import defaultdict\n\nclass Twitter:\n    def __init__(self):\n        self.time = 0\n        self.tweets = defaultdict(list)       # built-in defaultdict: user -> [(time, tweetId)]\n        self.following = defaultdict(set)\n\n    def post_tweet(self, user_id, tweet_id):\n        self.tweets[user_id].append((self.time, tweet_id))\n        self.time += 1\n\n    def get_news_feed(self, user_id):\n        heap = []\n        users = self.following[user_id] | {user_id}\n        for u in users:\n            for t, tid in self.tweets[u][-10:]:\n                heapq.heappush(heap, (t, tid))\n                if len(heap) > 10:\n                    heapq.heappop(heap)\n        return [tid for t, tid in sorted(heap, reverse=True)]\n\n    def follow(self, follower, followee):\n        self.following[follower].add(followee)\n\n    def unfollow(self, follower, followee):\n        self.following[follower].discard(followee)\n\ntw = Twitter()\ntw.post_tweet(1, 5)\ntw.follow(1, 2)\ntw.post_tweet(2, 6)\nprint(tw.get_news_feed(1))", "py_scratch": "class Twitter:\n    def __init__(self):\n        self.time = 0\n        self.tweets = {}\n        self.following = {}\n\n    def post_tweet(self, user_id, tweet_id):\n        if user_id not in self.tweets:\n            self.tweets[user_id] = []\n        self.tweets[user_id].append((self.time, tweet_id))\n        self.time = self.time + 1\n\n    def follow(self, follower, followee):\n        if follower not in self.following:\n            self.following[follower] = set()\n        self.following[follower].add(followee)\n\n    def unfollow(self, follower, followee):\n        if follower in self.following and followee in self.following[follower]:\n            self.following[follower].remove(followee)\n\n    def get_news_feed(self, user_id):\n        users = set()\n        users.add(user_id)\n        if user_id in self.following:\n            for f in self.following[user_id]:\n                users.add(f)\n        all_tweets = []\n        for u in users:\n            if u in self.tweets:\n                for t in self.tweets[u]:\n                    all_tweets.append(t)\n        all_tweets.sort(reverse=True)\n        result = []\n        i = 0\n        while i < len(all_tweets) and i < 10:\n            result.append(all_tweets[i][1])\n            i = i + 1\n        return result\n\ntw = Twitter()\ntw.post_tweet(1, 5)\ntw.follow(1, 2)\ntw.post_tweet(2, 6)\nprint(tw.get_news_feed(1))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nclass Twitter {\n    int time_ = 0;\n    unordered_map<int, vector<pair<int,int>>> tweets;    // built-in map: user -> [(time, tweetId)]\n    unordered_map<int, unordered_set<int>> following;\npublic:\n    void postTweet(int userId, int tweetId) {\n        tweets[userId].push_back({time_++, tweetId});\n    }\n    void follow(int follower, int followee) { following[follower].insert(followee); }\n    void unfollow(int follower, int followee) { following[follower].erase(followee); }\n    vector<int> getNewsFeed(int userId) {\n        priority_queue<pair<int,int>> heap;\n        unordered_set<int> users = following[userId];\n        users.insert(userId);\n        for (int u : users) {\n            auto& list = tweets[u];\n            for (int i = max(0, (int)list.size()-10); i < (int)list.size(); i++) heap.push(list[i]);\n        }\n        vector<int> result;\n        while (!heap.empty() && (int)result.size() < 10) { result.push_back(heap.top().second); heap.pop(); }\n        return result;\n    }\n};\nint main() {\n    Twitter tw;\n    tw.postTweet(1, 5);\n    tw.follow(1, 2);\n    tw.postTweet(2, 6);\n    for (int x : tw.getNewsFeed(1)) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint tweetUser[100], tweetId[100], tweetTime[100]; int tweetCount = 0;\nint followerArr[10][10]; int followingCount[10] = {0};\nint timeCounter = 0;\nvoid postTweet(int userId, int tid) {\n    tweetUser[tweetCount] = userId;\n    tweetId[tweetCount] = tid;\n    tweetTime[tweetCount] = timeCounter++;\n    tweetCount++;\n}\nvoid follow(int follower, int followee) {\n    followerArr[follower][followingCount[follower]++] = followee;\n}\nvoid getNewsFeed(int userId) {\n    int bestTimes[10], bestIds[10]; int size = 0;\n    for (int i = 0; i < tweetCount; i++) {\n        bool relevant = (tweetUser[i] == userId);\n        for (int j = 0; j < followingCount[userId]; j++) {\n            if (followerArr[userId][j] == tweetUser[i]) relevant = true;\n        }\n        if (relevant) {\n            int pos = size;\n            if (size < 10) size++;\n            while (pos > 0 && bestTimes[pos-1] < tweetTime[i]) {\n                if (pos < 10) { bestTimes[pos] = bestTimes[pos-1]; bestIds[pos] = bestIds[pos-1]; }\n                pos--;\n            }\n            if (pos < 10) { bestTimes[pos] = tweetTime[i]; bestIds[pos] = tweetId[i]; }\n        }\n    }\n    for (int i = 0; i < size; i++) cout << bestIds[i] << \" \";\n}\nint main() {\n    postTweet(1, 5);\n    follow(1, 2);\n    postTweet(2, 6);\n    getNewsFeed(1);\n}"}}, {"name": "Flatten Iterator", "theory": "Provides sequential next()/hasNext() access over a nested structure (e.g. a list of lists, or a nested list with arbitrary depth) by pre-flattening into a flat list (simple but O(n) upfront space) or lazily maintaining a stack of iterators/positions that advances only as far as needed \u2014 the lazy version avoids materialising the full flattened sequence upfront.", "when": "Iterating over nested collections through a uniform flat interface \u2014 a common iterator-design interview question testing lazy evaluation and stack-based state management.", "best": "O(1) amortized per next()", "avg": "O(1) amortized", "worst": "O(depth) per next() (lazy version, worst single call)", "space": "O(depth) lazy / O(n) eager", "code": {"py_bi": "class NestedIterator:\n    def __init__(self, nested_list):\n        self.stack = list(reversed(nested_list))    # built-in reversed\n\n    def _flatten_next(self):\n        while self.stack and isinstance(self.stack[-1], list):\n            top = self.stack.pop()\n            self.stack.extend(reversed(top))\n\n    def has_next(self):\n        self._flatten_next()\n        return len(self.stack) > 0\n\n    def next(self):\n        self._flatten_next()\n        return self.stack.pop()\n\nit = NestedIterator([[1,1],2,[1,1]])\nresult = []\nwhile it.has_next():\n    result.append(it.next())\nprint(result)", "py_scratch": "class NestedIterator:\n    def __init__(self, nested_list):\n        self.stack = []\n        i = len(nested_list) - 1\n        while i >= 0:\n            self.stack.append(nested_list[i])\n            i = i - 1\n\n    def _flatten_next(self):\n        while len(self.stack) > 0 and isinstance(self.stack[-1], list):\n            top = self.stack.pop()\n            i = len(top) - 1\n            while i >= 0:\n                self.stack.append(top[i])\n                i = i - 1\n\n    def has_next(self):\n        self._flatten_next()\n        return len(self.stack) > 0\n\n    def next(self):\n        self._flatten_next()\n        return self.stack.pop()\n\nit = NestedIterator([[1,1],2,[1,1]])\nresult = []\nwhile it.has_next():\n    result.append(it.next())\nprint(result)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nstruct NestedInt {\n    bool isInt; int val; vector<NestedInt> list_;\n};\nclass NestedIterator {\n    vector<NestedInt*> stack_;\n    void flattenNext() {\n        while (!stack_.empty() && !stack_.back()->isInt) {\n            NestedInt* top = stack_.back(); stack_.pop_back();\n            for (int i = top->list_.size()-1; i >= 0; i--) stack_.push_back(&top->list_[i]);  // built-in reverse push\n        }\n    }\npublic:\n    NestedIterator(vector<NestedInt>& nestedList) {\n        for (int i = nestedList.size()-1; i >= 0; i--) stack_.push_back(&nestedList[i]);\n    }\n    bool hasNext() { flattenNext(); return !stack_.empty(); }\n    int next() { flattenNext(); NestedInt* top = stack_.back(); stack_.pop_back(); return top->val; }\n};\nint main() {\n    vector<NestedInt> data = {\n        {false,0,{{true,1,{}},{true,1,{}}}},\n        {true,2,{}},\n        {false,0,{{true,1,{}},{true,1,{}}}}\n    };\n    NestedIterator it(data);\n    while (it.hasNext()) cout << it.next() << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\n// simplified scratch demo: flatten a fixed 2-level structure manually\nint main() {\n    int nested[3][2] = {{1,1},{2,-1},{1,1}};\n    int lens[3] = {2,1,2};\n    int flat[10]; int fcount = 0;\n    for (int i = 0; i < 3; i++) {\n        for (int j = 0; j < lens[i]; j++) {\n            flat[fcount++] = nested[i][j];\n        }\n    }\n    for (int i = 0; i < fcount; i++) cout << flat[i] << \" \";\n}"}}, {"name": "Peeking Iterator", "theory": "Wraps an existing iterator to add a peek() method (view the next element without consuming it) while preserving standard next()/hasNext() semantics \u2014 implemented by eagerly fetching and caching one element ahead: peek() returns the cached value, and next() returns the cached value then refills the cache from the underlying iterator.", "when": "Situations needing lookahead without consuming \u2014 parsing (checking the next token before deciding how to consume it), merge-style algorithms comparing the next elements of multiple streams.", "best": "O(1) per operation (given O(1) underlying next())", "avg": "O(1)", "worst": "O(1)", "space": "O(1) extra", "code": {"py_bi": "class PeekingIterator:\n    def __init__(self, iterator):\n        self.iterator = iterator\n        self.cached = next(self.iterator, None)     # built-in next() with default\n\n    def peek(self):\n        return self.cached\n\n    def next(self):\n        val = self.cached\n        self.cached = next(self.iterator, None)\n        return val\n\n    def has_next(self):\n        return self.cached is not None\n\nit = PeekingIterator(iter([1,2,3]))\nprint(it.peek())\nprint(it.next())\nprint(it.peek())\nwhile it.has_next():\n    print(it.next())", "py_scratch": "class PeekingIterator:\n    def __init__(self, items):\n        self.items = items\n        self.pos = 0\n        if self.pos < len(self.items):\n            self.cached = self.items[self.pos]\n            self.has_cache = True\n        else:\n            self.cached = None\n            self.has_cache = False\n        self.pos = self.pos + 1\n\n    def peek(self):\n        return self.cached\n\n    def next(self):\n        val = self.cached\n        if self.pos < len(self.items):\n            self.cached = self.items[self.pos]\n            self.has_cache = True\n        else:\n            self.cached = None\n            self.has_cache = False\n        self.pos = self.pos + 1\n        return val\n\n    def has_next(self):\n        return self.has_cache\n\nit = PeekingIterator([1,2,3])\nprint(it.peek())\nprint(it.next())\nprint(it.peek())\nwhile it.has_next():\n    print(it.next())", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nclass PeekingIterator {\n    vector<int>::iterator it, end_;\n    int cached; bool hasCache;\npublic:\n    PeekingIterator(vector<int>::iterator begin, vector<int>::iterator end) : it(begin), end_(end) {\n        hasCache = (it != end_);\n        if (hasCache) { cached = *it; ++it; }    // built-in dereference/advance\n    }\n    int peek() { return cached; }\n    int next() {\n        int val = cached;\n        hasCache = (it != end_);\n        if (hasCache) { cached = *it; ++it; }\n        return val;\n    }\n    bool hasNext() { return hasCache; }\n};\nint main() {\n    vector<int> data = {1,2,3};\n    PeekingIterator pit(data.begin(), data.end());\n    cout << pit.peek() << endl;\n    cout << pit.next() << endl;\n    cout << pit.peek() << endl;\n    while (pit.hasNext()) cout << pit.next() << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint items[] = {1,2,3};\nint n = 3, pos = 0;\nint cached; bool hasCache;\nvoid initIter() {\n    if (pos < n) { cached = items[pos]; hasCache = true; pos++; }\n    else hasCache = false;\n}\nint peekVal() { return cached; }\nint nextVal() {\n    int val = cached;\n    if (pos < n) { cached = items[pos]; hasCache = true; pos++; }\n    else hasCache = false;\n    return val;\n}\nbool hasNextVal() { return hasCache; }\nint main() {\n    initIter();\n    cout << peekVal() << endl;\n    cout << nextVal() << endl;\n    cout << peekVal() << endl;\n    while (hasNextVal()) cout << nextVal() << \" \";\n}"}}, {"name": "BST Iterator", "theory": "Provides an O(1) amortized next() over a BST's inorder sequence WITHOUT materialising the full traversal upfront: maintains an explicit stack of left-spine ancestors; next() pops the top, returns its value, and pushes the left spine of its right child \u2014 total work across all next() calls is O(n) (each node pushed/popped once), giving O(h) worst-case per call but O(1) amortized.", "when": "Iterating a BST in sorted order incrementally (e.g. inside a merge-like algorithm comparing two BSTs) without the O(n) space of a full inorder array upfront \u2014 only O(h) space is used at any time.", "best": "O(1) amortized, O(h) worst single call", "avg": "O(1) amortized", "worst": "O(h) single call", "space": "O(h)", "code": {"py_bi": "class Node:\n    def __init__(self, val, left=None, right=None):\n        self.val = val; self.left = left; self.right = right\n\nclass BSTIterator:\n    def __init__(self, root):\n        self.stack = []\n        self._push_left(root)\n\n    def _push_left(self, node):\n        while node:                    # built-in truthy check\n            self.stack.append(node)\n            node = node.left\n\n    def next(self):\n        node = self.stack.pop()\n        self._push_left(node.right)\n        return node.val\n\n    def has_next(self):\n        return len(self.stack) > 0\n\nroot = Node(7, Node(3), Node(15, Node(9), Node(20)))\nit = BSTIterator(root)\nwhile it.has_next():\n    print(it.next())", "py_scratch": "class Node:\n    def __init__(self, val, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass BSTIterator:\n    def __init__(self, root):\n        self.stack = []\n        self.push_left(root)\n\n    def push_left(self, node):\n        while node is not None:\n            self.stack.append(node)\n            node = node.left\n\n    def next(self):\n        node = self.stack.pop()\n        self.push_left(node.right)\n        return node.val\n\n    def has_next(self):\n        return len(self.stack) > 0\n\nroot = Node(7, Node(3), Node(15, Node(9), Node(20)))\nit = BSTIterator(root)\nwhile it.has_next():\n    print(it.next())", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nstruct Node { int val; Node* left; Node* right; };\nclass BSTIterator {\n    stack<Node*> st;                 // built-in stack\n    void pushLeft(Node* node) { while (node) { st.push(node); node = node->left; } }\npublic:\n    BSTIterator(Node* root) { pushLeft(root); }\n    int next() {\n        Node* node = st.top(); st.pop();\n        pushLeft(node->right);\n        return node->val;\n    }\n    bool hasNext() { return !st.empty(); }\n};\nint main() {\n    Node n3{3,nullptr,nullptr}, n9{9,nullptr,nullptr}, n20{20,nullptr,nullptr};\n    Node n15{15,&n9,&n20};\n    Node root{7,&n3,&n15};\n    BSTIterator it(&root);\n    while (it.hasNext()) cout << it.next() << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nstruct Node { int val; Node* left; Node* right; };\nNode* stackArr[20]; int top = -1;\nvoid pushLeft(Node* node) {\n    while (node != nullptr) {\n        stackArr[++top] = node;\n        node = node->left;\n    }\n}\nint nextVal() {\n    Node* node = stackArr[top--];\n    pushLeft(node->right);\n    return node->val;\n}\nbool hasNextVal() { return top >= 0; }\nint main() {\n    Node n3{3,nullptr,nullptr}, n9{9,nullptr,nullptr}, n20{20,nullptr,nullptr};\n    Node n15{15,&n9,&n20};\n    Node root{7,&n3,&n15};\n    pushLeft(&root);\n    while (hasNextVal()) cout << nextVal() << \" \";\n}"}}]}, {"num": "30", "title": "Ordered Set", "techniques": [{"name": "Ordered Set / Multiset Operations", "theory": "An ordered set (or multiset, allowing duplicates) maintains elements in sorted order at all times, typically backed by a balanced BST (red-black tree) or skip list, supporting O(log n) insert, delete, and lookup while also allowing O(log n) 'order statistic' queries like find-the-kth-smallest or count-elements-less-than-x \u2014 a plain hash set cannot answer these ordering queries efficiently.", "when": "Whenever both fast membership/insert/delete AND sorted-order queries (min, max, kth element, range) are needed simultaneously \u2014 a plain sorted array is too slow to update (O(n) insert), and a plain hash set has no ordering.", "best": "O(log n) per operation", "avg": "O(log n)", "worst": "O(log n)", "space": "O(n)", "code": {"py_bi": "import bisect\nsorted_list = []\nfor x in [5, 1, 8, 3, 9]:\n    bisect.insort(sorted_list, x)      # built-in sorted insert, keeps order O(n) due to shift but O(log n) search\nprint(sorted_list)\nidx = bisect.bisect_left(sorted_list, 8)     # find position of 8\nprint(idx, sorted_list[idx])\nsorted_list.pop(bisect.bisect_left(sorted_list, 3))   # remove value 3\nprint(sorted_list)", "py_scratch": "sorted_list = []\n\ndef insort(lst, x):\n    lo, hi = 0, len(lst)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if lst[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid\n    lst.insert(lo, x)\n\ndef bisect_left(lst, x):\n    lo, hi = 0, len(lst)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if lst[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo\n\nfor x in [5, 1, 8, 3, 9]:\n    insort(sorted_list, x)\nprint(sorted_list)\nidx = bisect_left(sorted_list, 8)\nprint(idx, sorted_list[idx])\nsorted_list.pop(bisect_left(sorted_list, 3))\nprint(sorted_list)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    multiset<int> ms;                    // built-in ordered multiset (red-black tree backed)\n    for (int x : {5,1,8,3,9}) ms.insert(x);\n    for (int x : ms) cout << x << \" \";\n    cout << endl;\n    auto it = ms.find(8);\n    cout << *it << endl;\n    ms.erase(ms.find(3));                // erase one occurrence of 3\n    for (int x : ms) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint arr[5];\nint size_ = 0;\nvoid insertSorted(int x) {\n    int pos = size_;\n    while (pos > 0 && arr[pos-1] > x) {\n        arr[pos] = arr[pos-1];\n        pos--;\n    }\n    arr[pos] = x;\n    size_++;\n}\nvoid removeVal(int x) {\n    for (int i = 0; i < size_; i++) {\n        if (arr[i] == x) {\n            for (int j = i; j < size_-1; j++) arr[j] = arr[j+1];\n            size_--;\n            return;\n        }\n    }\n}\nint main() {\n    int vals[] = {5,1,8,3,9};\n    for (int x : vals) insertSorted(x);\n    for (int i = 0; i < size_; i++) cout << arr[i] << \" \";\n    cout << endl;\n    removeVal(3);\n    for (int i = 0; i < size_; i++) cout << arr[i] << \" \";\n}"}}, {"name": "Order Statistics Tree", "theory": "A balanced BST augmented so every node also stores the size of its subtree \u2014 this extra field lets 'find the kth smallest element' and 'find the rank of a given value' both be answered in O(log n) by using subtree sizes to decide whether to recurse left, return the current node, or recurse right (adjusting k accordingly), instead of an O(n) inorder walk.", "when": "Repeated order-statistic queries (kth smallest, rank of x) combined with insertions/deletions \u2014 a plain BST supports insert/delete but not O(log n) rank queries without this augmentation.", "best": "O(log n) per operation", "avg": "O(log n)", "worst": "O(log n) (if kept balanced)", "space": "O(n)", "code": {"py_bi": "class Node:\n    def __init__(self, val):\n        self.val = val; self.left = None; self.right = None; self.size = 1\n\ndef insert(root, val):\n    if not root:\n        return Node(val)\n    if val < root.val:\n        root.left = insert(root.left, val)\n    else:\n        root.right = insert(root.right, val)\n    root.size = 1 + (root.left.size if root.left else 0) + (root.right.size if root.right else 0)  # built-in ternary-style\n    return root\n\ndef kth_smallest(root, k):\n    left_size = root.left.size if root.left else 0\n    if k <= left_size:\n        return kth_smallest(root.left, k)\n    elif k == left_size + 1:\n        return root.val\n    else:\n        return kth_smallest(root.right, k - left_size - 1)\n\nroot = None\nfor v in [5, 3, 8, 1, 4, 7, 9]:\n    root = insert(root, v)\nprint(kth_smallest(root, 3))", "py_scratch": "class Node:\n    def __init__(self, val):\n        self.val = val\n        self.left = None\n        self.right = None\n        self.size = 1\n\ndef get_size(node):\n    if node is None:\n        return 0\n    return node.size\n\ndef insert(root, val):\n    if root is None:\n        return Node(val)\n    if val < root.val:\n        root.left = insert(root.left,

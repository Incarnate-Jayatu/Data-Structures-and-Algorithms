 "import random\n\ndef randomized_quicksort(arr, low, high):\n    if low < high:\n        pivot_idx = random.randint(low, high)\n        temp = arr[pivot_idx]\n        arr[pivot_idx] = arr[high]\n        arr[high] = temp\n        pivot = arr[high]\n        i = low - 1\n        j = low\n        while j < high:\n            if arr[j] <= pivot:\n                i = i + 1\n                temp2 = arr[i]\n                arr[i] = arr[j]\n                arr[j] = temp2\n            j = j + 1\n        temp3 = arr[i+1]\n        arr[i+1] = arr[high]\n        arr[high] = temp3\n        pi = i + 1\n        randomized_quicksort(arr, low, pi-1)\n        randomized_quicksort(arr, pi+1, high)\n\narr = [10, 7, 8, 9, 1, 5]\nrandomized_quicksort(arr, 0, len(arr)-1)\nprint(arr)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint partition(vector<int>& arr, int low, int high) {\n    int pivot = arr[high];\n    int i = low - 1;\n    for (int j = low; j < high; j++) {\n        if (arr[j] <= pivot) { i++; swap(arr[i], arr[j]); }\n    }\n    swap(arr[i+1], arr[high]);\n    return i+1;\n}\nvoid randomizedQuicksort(vector<int>& arr, int low, int high) {\n    if (low < high) {\n        int pivotIdx = low + rand() % (high - low + 1);   // built-in rand()\n        swap(arr[pivotIdx], arr[high]);\n        int pi = partition(arr, low, high);\n        randomizedQuicksort(arr, low, pi-1);\n        randomizedQuicksort(arr, pi+1, high);\n    }\n}\nint main() {\n    srand(42);\n    vector<int> arr = {10,7,8,9,1,5};\n    randomizedQuicksort(arr, 0, arr.size()-1);\n    for (int x : arr) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\nint simpleRand(int bound) {\n    seed = seed * 1103515245 + 12345;\n    return (int)((seed / 65536) % bound);\n}\nint partition(int arr[], int low, int high) {\n    int pivot = arr[high];\n    int i = low - 1;\n    for (int j = low; j < high; j++) {\n        if (arr[j] <= pivot) {\n            i++;\n            int temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;\n        }\n    }\n    int temp = arr[i+1]; arr[i+1] = arr[high]; arr[high] = temp;\n    return i+1;\n}\nvoid randomizedQuicksort(int arr[], int low, int high) {\n    if (low < high) {\n        int pivotIdx = low + simpleRand(high - low + 1);\n        int temp = arr[pivotIdx]; arr[pivotIdx] = arr[high]; arr[high] = temp;\n        int pi = partition(arr, low, high);\n        randomizedQuicksort(arr, low, pi-1);\n        randomizedQuicksort(arr, pi+1, high);\n    }\n}\nint main() {\n    int arr[] = {10,7,8,9,1,5};\n    int n = 6;\n    randomizedQuicksort(arr, 0, n-1);\n    for (int i = 0; i < n; i++) cout << arr[i] << \" \";\n}"}}, {"name": "Randomized Selection (Quickselect)", "theory": "Finds the kth smallest element using the same random-pivot partitioning as Randomized QuickSort, but recurses into only ONE side (the side containing the kth element) instead of both \u2014 since only one recursive call is made per level and the subproblem shrinks by a random but expected-constant factor each time, the expected total work is O(n) rather than O(n log n).", "when": "Finding the kth smallest/largest element, or median, without fully sorting \u2014 see Section 37 (Quickselect) for complete coverage including the worst-case-linear Median-of-Medians variant.", "best": "O(n)", "avg": "O(n)", "worst": "O(n^2) (probability vanishingly small)", "space": "O(log n) expected recursion depth", "code": {"py_bi": "import random\n\ndef partition(arr, low, high):\n    pivot_idx = random.randint(low, high)      # built-in random pivot\n    arr[pivot_idx], arr[high] = arr[high], arr[pivot_idx]\n    pivot = arr[high]\n    i = low - 1\n    for j in range(low, high):\n        if arr[j] <= pivot:\n            i += 1\n            arr[i], arr[j] = arr[j], arr[i]\n    arr[i+1], arr[high] = arr[high], arr[i+1]\n    return i + 1\n\ndef quickselect(arr, low, high, k):\n    if low == high:\n        return arr[low]\n    pi = partition(arr, low, high)\n    if k == pi:\n        return arr[pi]\n    elif k < pi:\n        return quickselect(arr, low, pi-1, k)\n    else:\n        return quickselect(arr, pi+1, high, k)\n\narr = [7, 10, 4, 3, 20, 15]\nk = 2   # 0-indexed: 3rd smallest\nprint(quickselect(arr, 0, len(arr)-1, k))", "py_scratch": "import random\n\ndef partition(arr, low, high):\n    pivot_idx = random.randint(low, high)\n    temp = arr[pivot_idx]\n    arr[pivot_idx] = arr[high]\n    arr[high] = temp\n    pivot = arr[high]\n    i = low - 1\n    j = low\n    while j < high:\n        if arr[j] <= pivot:\n            i = i + 1\n            temp2 = arr[i]\n            arr[i] = arr[j]\n            arr[j] = temp2\n        j = j + 1\n    temp3 = arr[i+1]\n    arr[i+1] = arr[high]\n    arr[high] = temp3\n    return i + 1\n\ndef quickselect(arr, low, high, k):\n    if low == high:\n        return arr[low]\n    pi = partition(arr, low, high)\n    if k == pi:\n        return arr[pi]\n    elif k < pi:\n        return quickselect(arr, low, pi-1, k)\n    else:\n        return quickselect(arr, pi+1, high, k)\n\narr = [7, 10, 4, 3, 20, 15]\nk = 2\nprint(quickselect(arr, 0, len(arr)-1, k))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint partition(vector<int>& arr, int low, int high) {\n    int pivotIdx = low + rand() % (high - low + 1);   // built-in rand()\n    swap(arr[pivotIdx], arr[high]);\n    int pivot = arr[high];\n    int i = low - 1;\n    for (int j = low; j < high; j++) {\n        if (arr[j] <= pivot) { i++; swap(arr[i], arr[j]); }\n    }\n    swap(arr[i+1], arr[high]);\n    return i+1;\n}\nint quickselect(vector<int>& arr, int low, int high, int k) {\n    if (low == high) return arr[low];\n    int pi = partition(arr, low, high);\n    if (k == pi) return arr[pi];\n    else if (k < pi) return quickselect(arr, low, pi-1, k);\n    else return quickselect(arr, pi+1, high, k);\n}\nint main() {\n    srand(42);\n    vector<int> arr = {7,10,4,3,20,15};\n    int k = 2;\n    cout << quickselect(arr, 0, arr.size()-1, k) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\nint simpleRand(int bound) {\n    seed = seed * 1103515245 + 12345;\n    return (int)((seed / 65536) % bound);\n}\nint partition(int arr[], int low, int high) {\n    int pivotIdx = low + simpleRand(high - low + 1);\n    int temp = arr[pivotIdx]; arr[pivotIdx] = arr[high]; arr[high] = temp;\n    int pivot = arr[high];\n    int i = low - 1;\n    for (int j = low; j < high; j++) {\n        if (arr[j] <= pivot) {\n            i++;\n            int t = arr[i]; arr[i] = arr[j]; arr[j] = t;\n        }\n    }\n    int t = arr[i+1]; arr[i+1] = arr[high]; arr[high] = t;\n    return i+1;\n}\nint quickselect(int arr[], int low, int high, int k) {\n    if (low == high) return arr[low];\n    int pi = partition(arr, low, high);\n    if (k == pi) return arr[pi];\n    else if (k < pi) return quickselect(arr, low, pi-1, k);\n    else return quickselect(arr, pi+1, high, k);\n}\nint main() {\n    int arr[] = {7,10,4,3,20,15};\n    int n = 6, k = 2;\n    cout << quickselect(arr, 0, n-1, k) << endl;\n}"}}, {"name": "Random Sampling", "theory": "Selects a random subset of a fixed size m from a known-size collection of n elements, using either the Fisher-Yates partial-shuffle approach (shuffle just the first m positions) or by iterating through and including each element with adjusted probability m/remaining \u2014 both give a uniformly random subset without bias, distinct from Reservoir Sampling which handles the unknown/streaming-size case.", "when": "Selecting a random subset from a collection whose size is already known \u2014 A/B test group assignment, random subset selection for statistical sampling, contrasted with Reservoir Sampling for unknown-size streams.", "best": "O(m) or O(n)", "avg": "O(m) or O(n)", "worst": "O(m) or O(n)", "space": "O(m)", "code": {"py_bi": "import random\narr = list(range(1, 21))\nm = 5\nsample = random.sample(arr, m)      # built-in random.sample: uniform without replacement\nprint(sample)", "py_scratch": "import random\n\ndef random_sample(arr, m):\n    n = len(arr)\n    arr_copy = list(arr)\n    i = 0\n    while i < m:\n        j = random.randint(i, n-1)\n        temp = arr_copy[i]\n        arr_copy[i] = arr_copy[j]\n        arr_copy[j] = temp\n        i = i + 1\n    return arr_copy[:m]\n\narr = list(range(1, 21))\nprint(random_sample(arr, 5))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> arr(20);\n    iota(arr.begin(), arr.end(), 1);      // built-in iota\n    mt19937 rng(random_device{}());\n    int m = 5;\n    for (int i = 0; i < m; i++) {\n        uniform_int_distribution<int> dist(i, (int)arr.size()-1);\n        int j = dist(rng);\n        swap(arr[i], arr[j]);\n    }\n    for (int i = 0; i < m; i++) cout << arr[i] << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\nint simpleRand(int lo, int hi) {\n    seed = seed * 1103515245 + 12345;\n    return lo + (int)((seed / 65536) % (hi - lo + 1));\n}\nint main() {\n    int arr[20];\n    for (int i = 0; i < 20; i++) arr[i] = i+1;\n    int m = 5;\n    for (int i = 0; i < m; i++) {\n        int j = simpleRand(i, 19);\n        int temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;\n    }\n    for (int i = 0; i < m; i++) cout << arr[i] << \" \";\n}"}}]}, {"num": "37", "title": "Quickselect", "techniques": [{"name": "Basic Quickselect (Kth Largest/Smallest)", "theory": "Finds the kth smallest (or largest) element using the same partition step as Quick Sort, but recurses into only the ONE side of the partition known to contain the target rank, discarding the other side entirely \u2014 since roughly half the remaining array is eliminated at each step on average, the expected total work forms a geometric series summing to O(n), unlike full sorting's O(n log n).", "when": "Finding a single order-statistic (median, kth largest/smallest) without needing the whole array sorted \u2014 significantly faster than sort-then-index for large n when only one or a few order statistics are needed.", "best": "O(n)", "avg": "O(n)", "worst": "O(n^2) (rare, poor pivot choices)", "space": "O(log n) expected recursion depth", "code": {"py_bi": "import random\n\ndef quickselect(arr, k):\n    if len(arr) == 1:\n        return arr[0]\n    pivot = random.choice(arr)            # built-in random.choice\n    lows = [x for x in arr if x < pivot]\n    highs = [x for x in arr if x > pivot]\n    pivots = [x for x in arr if x == pivot]\n    if k < len(lows):\n        return quickselect(lows, k)\n    elif k < len(lows) + len(pivots):\n        return pivot\n    else:\n        return quickselect(highs, k - len(lows) - len(pivots))\n\narr = [7, 10, 4, 3, 20, 15]\nprint(quickselect(arr, 2))   # 3rd smallest (0-indexed)", "py_scratch": "import random\n\ndef quickselect(arr, k):\n    if len(arr) == 1:\n        return arr[0]\n    pivot = arr[random.randint(0, len(arr)-1)]\n    lows = []\n    highs = []\n    pivots = []\n    for x in arr:\n        if x < pivot:\n            lows.append(x)\n        elif x > pivot:\n            highs.append(x)\n        else:\n            pivots.append(x)\n    if k < len(lows):\n        return quickselect(lows, k)\n    elif k < len(lows) + len(pivots):\n        return pivot\n    else:\n        return quickselect(highs, k - len(lows) - len(pivots))\n\narr = [7, 10, 4, 3, 20, 15]\nprint(quickselect(arr, 2))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint quickselect(vector<int> arr, int k) {\n    if (arr.size() == 1) return arr[0];\n    int pivot = arr[rand() % arr.size()];    // built-in rand()\n    vector<int> lows, highs, pivots;\n    for (int x : arr) {\n        if (x < pivot) lows.push_back(x);\n        else if (x > pivot) highs.push_back(x);\n        else pivots.push_back(x);\n    }\n    if (k < (int)lows.size()) return quickselect(lows, k);\n    else if (k < (int)(lows.size() + pivots.size())) return pivot;\n    else return quickselect(highs, k - lows.size() - pivots.size());\n}\nint main() {\n    srand(42);\n    vector<int> arr = {7,10,4,3,20,15};\n    cout << quickselect(arr, 2) << endl;\n}", "cpp_scratch": "#include <iostream>\n#include <vector>\nusing namespace std;\nunsigned int seed = 42;\nint simpleRand(int bound) {\n    seed = seed * 1103515245 + 12345;\n    return (int)((seed / 65536) % bound);\n}\nint quickselect(vector<int> arr, int k) {\n    if (arr.size() == 1) return arr[0];\n    int pivot = arr[simpleRand(arr.size())];\n    vector<int> lows, highs, pivots;\n    for (size_t i = 0; i < arr.size(); i++) {\n        if (arr[i] < pivot) lows.push_back(arr[i]);\n        else if (arr[i] > pivot) highs.push_back(arr[i]);\n        else pivots.push_back(arr[i]);\n    }\n    if (k < (int)lows.size()) return quickselect(lows, k);\n    else if (k < (int)(lows.size() + pivots.size())) return pivot;\n    else return quickselect(highs, k - lows.size() - pivots.size());\n}\nint main() {\n    vector<int> arr = {7,10,4,3,20,15};\n    cout << quickselect(arr, 2) << endl;\n}"}}, {"name": "Median of Medians (Worst-Case Linear Selection)", "theory": "Guarantees O(n) worst-case selection (unlike basic Quickselect's O(n^2) worst case) by choosing a provably good pivot: split the array into groups of 5, find each group's median (O(1) per group via direct comparison), then recursively find the median OF those group medians \u2014 using that as the partition pivot guarantees at least 30% of elements are eliminated each recursive step, bounding total work by the recurrence T(n) = T(n/5) + T(7n/10) + O(n), which solves to O(n).", "when": "Selection problems requiring a guaranteed worst-case linear bound (not just expected) \u2014 real-time systems or adversarial-input contexts where basic Quickselect's rare O(n^2) worst case is unacceptable; rarely used in practice due to high constant factors, but foundational in algorithm theory.", "best": "O(n)", "avg": "O(n)", "worst": "O(n)", "space": "O(n) \u2014 recursion + group storage", "code": {"py_bi": "def median_of_medians(arr, k):\n    if len(arr) <= 5:\n        return sorted(arr)[k]           # built-in sorted for small groups\n    groups = [arr[i:i+5] for i in range(0, len(arr), 5)]\n    medians = [sorted(g)[len(g)//2] for g in groups]\n    pivot = median_of_medians(medians, len(medians)//2)\n    lows = [x for x in arr if x < pivot]\n    highs = [x for x in arr if x > pivot]\n    pivots = [x for x in arr if x == pivot]\n    if k < len(lows):\n        return median_of_medians(lows, k)\n    elif k < len(lows) + len(pivots):\n        return pivot\n    else:\n        return median_of_medians(highs, k - len(lows) - len(pivots))\n\narr = [7, 10, 4, 3, 20, 15, 8, 12, 1, 9]\nprint(median_of_medians(arr, 3))", "py_scratch": "def simple_sort(a):\n    a = list(a)\n    n = len(a)\n    for i in range(n):\n        for j in range(n-1-i):\n            if a[j] > a[j+1]:\n                a[j], a[j+1] = a[j+1], a[j]\n    return a\n\ndef median_of_medians(arr, k):\n    if len(arr) <= 5:\n        sorted_arr = simple_sort(arr)\n        return sorted_arr[k]\n    groups = []\n    i = 0\n    while i < len(arr):\n        groups.append(arr[i:i+5])\n        i = i + 5\n    medians = []\n    for g in groups:\n        sg = simple_sort(g)\n        medians.append(sg[len(sg)//2])\n    pivot = median_of_medians(medians, len(medians)//2)\n    lows = []\n    highs = []\n    pivots = []\n    for x in arr:\n        if x < pivot:\n            lows.append(x)\n        elif x > pivot:\n            highs.append(x)\n        else:\n            pivots.append(x)\n    if k < len(lows):\n        return median_of_medians(lows, k)\n    elif k < len(lows) + len(pivots):\n        return pivot\n    else:\n        return median_of_medians(highs, k - len(lows) - len(pivots))\n\narr = [7, 10, 4, 3, 20, 15, 8, 12, 1, 9]\nprint(median_of_medians(arr, 3))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint medianOfMedians(vector<int> arr, int k) {\n    if (arr.size() <= 5) {\n        sort(arr.begin(), arr.end());    // built-in sort for small groups\n        return arr[k];\n    }\n    vector<int> medians;\n    for (size_t i = 0; i < arr.size(); i += 5) {\n        vector<int> group(arr.begin()+i, arr.begin()+min(i+5, arr.size()));\n        sort(group.begin(), group.end());\n        medians.push_back(group[group.size()/2]);\n    }\n    int pivot = medianOfMedians(medians, medians.size()/2);\n    vector<int> lows, highs, pivots;\n    for (int x : arr) {\n        if (x < pivot) lows.push_back(x);\n        else if (x > pivot) highs.push_back(x);\n        else pivots.push_back(x);\n    }\n    if (k < (int)lows.size()) return medianOfMedians(lows, k);\n    else if (k < (int)(lows.size()+pivots.size())) return pivot;\n    else return medianOfMedians(highs, k - lows.size() - pivots.size());\n}\nint main() {\n    vector<int> arr = {7,10,4,3,20,15,8,12,1,9};\n    cout << medianOfMedians(arr, 3) << endl;\n}", "cpp_scratch": "#include <iostream>\n#include <vector>\nusing namespace std;\nvector<int> simpleSort(vector<int> a) {\n    int n = a.size();\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n-1-i; j++)\n            if (a[j] > a[j+1]) { int t=a[j]; a[j]=a[j+1]; a[j+1]=t; }\n    return a;\n}\nint medianOfMedians(vector<int> arr, int k) {\n    if (arr.size() <= 5) {\n        vector<int> sorted_ = simpleSort(arr);\n        return sorted_[k];\n    }\n    vector<int> medians;\n    for (size_t i = 0; i < arr.size(); i += 5) {\n        vector<int> group;\n        for (size_t j = i; j < min(i+5, arr.size()); j++) group.push_back(arr[j]);\n        vector<int> sg = simpleSort(group);\n        medians.push_back(sg[sg.size()/2]);\n    }\n    int pivot = medianOfMedians(medians, medians.size()/2);\n    vector<int> lows, highs, pivots;\n    for (size_t i = 0; i < arr.size(); i++) {\n        if (arr[i] < pivot) lows.push_back(arr[i]);\n        else if (arr[i] > pivot) highs.push_back(arr[i]);\n        else pivots.push_back(arr[i]);\n    }\n    if (k < (int)lows.size()) return medianOfMedians(lows, k);\n    else if (k < (int)(lows.size()+pivots.size())) return pivot;\n    else return medianOfMedians(highs, k - lows.size() - pivots.size());\n}\nint main() {\n    vector<int> arr = {7,10,4,3,20,15,8,12,1,9};\n    cout << medianOfMedians(arr, 3) << endl;\n}"}}]}, {"num": "38", "title": "Probability and Statistics", "techniques": [{"name": "Basic Probability in Problems", "theory": "Applies fundamental probability rules \u2014 the complement rule (P(not A) = 1 - P(A)), independence (P(A and B) = P(A) * P(B) for independent events), and conditional probability (P(A|B) = P(A and B) / P(B)) \u2014 to compute the likelihood of algorithmic events, such as the probability a random hash collision occurs or a randomised algorithm succeeds on a given run.", "when": "Reasoning about randomised algorithms' success probability, hash collision likelihood, or any problem asking for the probability of an event defined over combinatorial outcomes.", "best": "O(1) to O(n) depending on what must be enumerated/computed", "avg": "same", "worst": "same", "space": "O(1) typically", "code": {"py_bi": "from math import comb\n# Probability that at least 2 out of 23 people share a birthday (Birthday Paradox)\ndef prob_no_shared_birthday(n, days=365):\n    prob = 1.0\n    for i in range(n):\n        prob *= (days - i) / days      # built-in float division\n    return prob\n\nn = 23\np_no_share = prob_no_shared_birthday(n)\np_share = 1 - p_no_share\nprint(round(p_share, 4))", "py_scratch": "def prob_no_shared_birthday(n, days):\n    prob = 1.0\n    i = 0\n    while i < n:\n        prob = prob * (days - i) / days\n        i = i + 1\n    return prob\n\nn = 23\ndays = 365\np_no_share = prob_no_shared_birthday(n, days)\np_share = 1 - p_no_share\nprint(p_share)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\ndouble probNoSharedBirthday(int n, int days) {\n    double prob = 1.0;\n    for (int i = 0; i < n; i++) prob *= (double)(days - i) / days;   // built-in double arithmetic\n    return prob;\n}\nint main() {\n    int n = 23, days = 365;\n    double pNoShare = probNoSharedBirthday(n, days);\n    double pShare = 1 - pNoShare;\n    cout << pShare << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\ndouble probNoSharedBirthday(int n, int days) {\n    double prob = 1.0;\n    for (int i = 0; i < n; i++) {\n        prob = prob * (double)(days - i) / days;\n    }\n    return prob;\n}\nint main() {\n    int n = 23;\n    int days = 365;\n    double pNoShare = probNoSharedBirthday(n, days);\n    double pShare = 1 - pNoShare;\n    cout << pShare << endl;\n}"}}, {"name": "Expected Value Calculation", "theory": "Computes the expected (average, long-run) value of a random variable as the sum over all possible outcomes of (outcome value * probability of that outcome) \u2014 linearity of expectation (E[X+Y] = E[X] + E[Y], which holds even when X and Y are dependent) is a particularly powerful tool that often lets a complex expected value be decomposed into a sum of simpler expectations.", "when": "Computing the average-case cost of a randomised algorithm, expected number of comparisons/swaps, or any 'expected value of X' style problem \u2014 linearity of expectation frequently simplifies problems that look combinatorially complex.", "best": "O(outcomes)", "avg": "O(outcomes)", "worst": "O(outcomes)", "space": "O(1)", "code": {"py_bi": "# Expected value of a fair six-sided die roll\noutcomes = [1, 2, 3, 4, 5, 6]\nprobabilities = [1/6] * 6\nexpected_value = sum(o * p for o, p in zip(outcomes, probabilities))   # built-in zip + sum\nprint(expected_value)\n\n# Linearity of expectation example: expected number of fixed points in a random permutation of n elements\nn = 10\nexpected_fixed_points = n * (1/n)     # each position has 1/n chance of being a fixed point; sum = n * (1/n) = 1\nprint(expected_fixed_points)", "py_scratch": "outcomes = [1, 2, 3, 4, 5, 6]\nn = len(outcomes)\nexpected_value = 0\ni = 0\nwhile i < n:\n    expected_value = expected_value + outcomes[i] * (1/n)\n    i = i + 1\nprint(expected_value)\n\nn2 = 10\nexpected_fixed_points = n2 * (1/n2)\nprint(expected_fixed_points)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> outcomes = {1,2,3,4,5,6};\n    int n = outcomes.size();\n    double expectedValue = 0;\n    for (int o : outcomes) expectedValue += o * (1.0/n);   // built-in loop accumulation\n    cout << expectedValue << endl;\n\n    int n2 = 10;\n    double expectedFixedPoints = n2 * (1.0/n2);\n    cout << expectedFixedPoints << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint main() {\n    int outcomes[] = {1,2,3,4,5,6};\n    int n = 6;\n    double expectedValue = 0;\n    for (int i = 0; i < n; i++) {\n        expectedValue = expectedValue + outcomes[i] * (1.0/n);\n    }\n    cout << expectedValue << endl;\n\n    int n2 = 10;\n    double expectedFixedPoints = n2 * (1.0/n2);\n    cout << expectedFixedPoints << endl;\n}"}}, {"name": "Random Pick with Weight", "theory": "Selects a random index with probability proportional to a given weight array, by building a prefix-sum array of the weights, generating a uniform random value in [0, total weight), and binary-searching the prefix-sum array to find which weight 'bucket' the random value falls into \u2014 the bucket widths are proportional to each element's weight, so this correctly reproduces the desired weighted distribution in O(log n) per pick after O(n) preprocessing.", "when": "Weighted random sampling \u2014 e.g. randomly picking an item where some items should be more likely than others (weighted lottery, load-balanced random routing).", "best": "O(n) preprocess, O(log n) per pick", "avg": "O(log n) per pick", "worst": "O(log n) per pick", "space": "O(n)", "code": {"py_bi": "import random, bisect\n\nclass WeightedPicker:\n    def __init__(self, weights):\n        self.prefix = []\n        total = 0\n        for w in weights:\n            total += w\n            self.prefix.append(total)      # built-in running total\n        self.total = total\n\n    def pick_index(self):\n        target = random.uniform(0, self.total)   # built-in uniform random float\n        return bisect.bisect_left(self.prefix, target)\n\nwp = WeightedPicker([1, 3, 1])   # index 1 is 3x more likely than 0 or 2\ncounts = [0, 0, 0]\nfor _ in range(6000):\n    counts[wp.pick_index()] += 1\nprint(counts)", "py_scratch": "import random\n\nclass WeightedPicker:\n    def __init__(self, weights):\n        self.prefix = []\n        total = 0\n        for w in weights:\n            total = total + w\n            self.prefix.append(total)\n        self.total = total\n\n    def pick_index(self):\n        target = random.uniform(0, self.total)\n        lo = 0\n        hi = len(self.prefix)\n        while lo < hi:\n            mid = (lo + hi) // 2\n            if self.prefix[mid] < target:\n                lo = mid + 1\n            else:\n                hi = mid\n        return lo\n\nwp = WeightedPicker([1, 3, 1])\ncounts = [0, 0, 0]\ni = 0\nwhile i < 6000:\n    idx = wp.pick_index()\n    counts[idx] = counts[idx] + 1\n    i = i + 1\nprint(counts)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nclass WeightedPicker {\n    vector<int> prefix;\n    int total = 0;\n    mt19937 rng;\npublic:\n    WeightedPicker(vector<int>& weights) : rng(random_device{}()) {\n        for (int w : weights) { total += w; prefix.push_back(total); }   // built-in running total\n    }\n    int pickIndex() {\n        uniform_int_distribution<int> dist(1, total);   // built-in uniform distribution\n        int target = dist(rng);\n        return lower_bound(prefix.begin(), prefix.end(), target) - prefix.begin();\n    }\n};\nint main() {\n    vector<int> weights = {1,3,1};\n    WeightedPicker wp(weights);\n    vector<int> counts(3, 0);\n    for (int i = 0; i < 6000; i++) counts[wp.pickIndex()]++;\n    for (int c : counts) cout << c << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\nint simpleRand(int bound) {\n    seed = seed * 1103515245 + 12345;\n    return (int)((seed / 65536) % bound) + 1;\n}\nint main() {\n    int weights[] = {1,3,1};\n    int n = 3;\n    int prefix[3];\n    int total = 0;\n    for (int i = 0; i < n; i++) {\n        total += weights[i];\n        prefix[i] = total;\n    }\n    int counts[3] = {0,0,0};\n    for (int trial = 0; trial < 6000; trial++) {\n        int target = simpleRand(total);\n        int lo = 0, hi = n;\n        while (lo < hi) {\n            int mid = (lo + hi) / 2;\n            if (prefix[mid] < target) lo = mid + 1;\n            else hi = mid;\n        }\n        counts[lo]++;\n    }\n    for (int i = 0; i < n; i++) cout << counts[i] << \" \";\n}"}}]}, {"num": "39", "title": "Reservoir Sampling", "techniques": [{"name": "Single Element Reservoir Sampling", "theory": "Selects one uniformly random element from a stream of unknown/unbounded length using O(1) memory: keep the first element as the current pick, and when the ith element (1-indexed) arrives, replace the current pick with it with probability 1/i \u2014 induction shows every element ends up with exactly 1/n probability of being the final pick once n elements have been seen, regardless of when the stream ends.", "when": "Picking one uniformly random element from a stream whose total length is unknown in advance (or too large to store) \u2014 e.g. picking a random line from a huge file read one line at a time, random sampling from a live event stream.", "best": "O(1) per element", "avg": "O(1)", "worst": "O(1)", "space": "O(1)", "code": {"py_bi": "import random\n\ndef reservoir_sample_one(stream):\n    result = None\n    for i, x in enumerate(stream, start=1):    # built-in enumerate with start\n        if random.randint(1, i) == 1:           # built-in randint: replace with probability 1/i\n            result = x\n    return result\n\nprint(reservoir_sample_one(range(100)))", "py_scratch": "import random\n\ndef reservoir_sample_one(stream):\n    result = None\n    i = 1\n    for x in stream:\n        r = random.randint(1, i)\n        if r == 1:\n            result = x\n        i = i + 1\n    return result\n\nprint(reservoir_sample_one(range(100)))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nint reservoirSampleOne(vector<int>& stream) {\n    int result = -1;\n    mt19937 rng(random_device{}());          // built-in Mersenne Twister\n    for (size_t i = 0; i < stream.size(); i++) {\n        uniform_int_distribution<int> dist(1, i+1);   // built-in uniform distribution\n        if (dist(rng) == 1) result = stream[i];\n    }\n    return result;\n}\nint main() {\n    vector<int> stream(100);\n    iota(stream.begin(), stream.end(), 0);\n    cout << reservoirSampleOne(stream) << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\nint simpleRand(int bound) {\n    seed = seed * 1103515245 + 12345;\n    return (int)((seed / 65536) % bound) + 1;\n}\nint main() {\n    int result = -1;\n    for (int i = 0; i < 100; i++) {\n        int r = simpleRand(i+1);\n        if (r == 1) result = i;\n    }\n    cout << result << endl;\n}"}}, {"name": "K-Element Reservoir Sampling", "theory": "Generalises single-element reservoir sampling to select k uniformly random elements from a stream: fill a 'reservoir' array with the first k elements directly, then for each subsequent ith element (i > k), replace a uniformly random element of the reservoir with it with probability k/i \u2014 this maintains the invariant that at every point, every element seen so far has exactly k/(elements seen) probability of currently being in the reservoir.", "when": "Selecting a fixed-size random sample from a stream of unknown/unbounded length \u2014 survey sampling from a live feed, random subset selection when the full population can't be stored (see also Section 34's Data Stream context).", "best": "O(1) amortized per element", "avg": "O(1) amortized", "worst": "O(1) amortized", "space": "O(k)", "code": {"py_bi": "import random\n\ndef reservoir_sample_k(stream, k):\n    reservoir = []\n    for i, x in enumerate(stream):        # built-in enumerate\n        if i < k:\n            reservoir.append(x)\n        else:\n            j = random.randint(0, i)       # built-in randint\n            if j < k:\n                reservoir[j] = x\n    return reservoir\n\nprint(reservoir_sample_k(range(100), 5))", "py_scratch": "import random\n\ndef reservoir_sample_k(stream, k):\n    reservoir = []\n    i = 0\n    for x in stream:\n        if i < k:\n            reservoir.append(x)\n        else:\n            j = random.randint(0, i)\n            if j < k:\n                reservoir[j] = x\n        i = i + 1\n    return reservoir\n\nprint(reservoir_sample_k(range(100), 5))", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nvector<int> reservoirSampleK(vector<int>& stream, int k) {\n    vector<int> reservoir;\n    mt19937 rng(random_device{}());\n    for (int i = 0; i < (int)stream.size(); i++) {\n        if (i < k) reservoir.push_back(stream[i]);\n        else {\n            uniform_int_distribution<int> dist(0, i);   // built-in uniform distribution\n            int j = dist(rng);\n            if (j < k) reservoir[j] = stream[i];\n        }\n    }\n    return reservoir;\n}\nint main() {\n    vector<int> stream(100);\n    iota(stream.begin(), stream.end(), 0);\n    for (int x : reservoirSampleK(stream, 5)) cout << x << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\nint simpleRand(int bound) {\n    seed = seed * 1103515245 + 12345;\n    return (int)((seed / 65536) % bound);\n}\nint main() {\n    int k = 5;\n    int reservoir[5];\n    for (int i = 0; i < 100; i++) {\n        if (i < k) reservoir[i] = i;\n        else {\n            int j = simpleRand(i+1);\n            if (j < k) reservoir[j] = i;\n        }\n    }\n    for (int i = 0; i < k; i++) cout << reservoir[i] << \" \";\n}"}}]}, {"num": "40", "title": "Rejection Sampling", "techniques": [{"name": "Basic Rejection Sampling", "theory": "Generates a sample from a desired distribution/range using only a simpler random primitive (e.g. a uniform random number generator) by repeatedly generating candidates from the simpler primitive and discarding ('rejecting') any that don't satisfy the target distribution's constraint, keeping the first one that does \u2014 correctness follows because among the accepted samples, the relative probabilities exactly match the target distribution, even though some generated values are thrown away.", "when": "Generating a uniformly random value in a range that doesn't evenly divide the random generator's native range (e.g. picking 1-7 using a 6-sided die requires rejection to stay unbiased), or sampling from awkward distributions using only a simple RNG.", "best": "O(1) expected (small rejection probability)", "avg": "O(1) expected", "worst": "unbounded (extremely unlikely with a reasonable acceptance rate)", "space": "O(1)", "code": {"py_bi": "import random\n\ndef random_1_to_7_using_die():\n    # Using two rolls of a 6-sided die to generate a value 1-7 evenly, rejecting out-of-range combos\n    while True:\n        roll = (random.randint(1,6) - 1) * 6 + random.randint(1,6)   # built-in randint, range 1-36\n        if roll <= 35:            # reject the 36th outcome to keep 35 evenly divisible by 7\n            return (roll - 1) % 7 + 1\n\nresults = [random_1_to_7_using_die() for _ in range(10)]\nprint(results)", "py_scratch": "import random\n\ndef roll_die():\n    return random.randint(1, 6)\n\ndef random_1_to_7_using_die():\n    while True:\n        roll = (roll_die() - 1) * 6 + roll_die()\n        if roll <= 35:\n            return (roll - 1) % 7 + 1\n\nresults = []\ni = 0\nwhile i < 10:\n    results.append(random_1_to_7_using_die())\n    i = i + 1\nprint(results)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nmt19937 rng(random_device{}());\nint rollDie() {\n    uniform_int_distribution<int> dist(1, 6);   // built-in uniform distribution\n    return dist(rng);\n}\nint random1to7UsingDie() {\n    while (true) {\n        int roll = (rollDie()-1)*6 + rollDie();\n        if (roll <= 35) return (roll-1) % 7 + 1;   // built-in modulo rejection logic\n    }\n}\nint main() {\n    for (int i = 0; i < 10; i++) cout << random1to7UsingDie() << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\nint rollDie() {\n    seed = seed * 1103515245 + 12345;\n    return (int)((seed / 65536) % 6) + 1;\n}\nint random1to7UsingDie() {\n    while (true) {\n        int roll = (rollDie()-1)*6 + rollDie();\n        if (roll <= 35) return (roll-1) % 7 + 1;\n    }\n}\nint main() {\n    for (int i = 0; i < 10; i++) cout << random1to7UsingDie() << \" \";\n}"}}, {"name": "Use in Random Generation Problems", "theory": "Applies rejection sampling as a general problem-solving pattern for constrained random generation: sample a candidate from an easy-to-generate superset (e.g. a random point in a bounding square), test whether it satisfies the actual constraint (e.g. lies within an inscribed circle), and reject/retry if not \u2014 the expected number of attempts is 1/(acceptance probability), so this is efficient whenever the target region isn't too small relative to the sampling superset.", "when": "Generating random points/values under complex geometric or combinatorial constraints where directly sampling the constrained distribution is hard, but sampling a simple superset and testing membership is easy \u2014 random point-in-circle generation, random point-in-polygon generation, generating random permutations satisfying extra constraints.", "best": "O(1/acceptance probability) expected", "avg": "same", "worst": "unbounded (rare)", "space": "O(1)", "code": {"py_bi": "import random\n\ndef random_point_in_circle(radius):\n    while True:\n        x = random.uniform(-radius, radius)      # built-in uniform float\n        y = random.uniform(-radius, radius)\n        if x*x + y*y <= radius*radius:            # reject points outside the circle\n            return (x, y)\n\npoint = random_point_in_circle(5)\nprint(point)", "py_scratch": "import random\n\ndef random_point_in_circle(radius):\n    while True:\n        x = random.uniform(-radius, radius)\n        y = random.uniform(-radius, radius)\n        dist_sq = x*x + y*y\n        if dist_sq <= radius*radius:\n            return (x, y)\n\npoint = random_point_in_circle(5)\nprint(point)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nmt19937 rng(random_device{}());\npair<double,double> randomPointInCircle(double radius) {\n    uniform_real_distribution<double> dist(-radius, radius);   // built-in uniform real distribution\n    while (true) {\n        double x = dist(rng);\n        double y = dist(rng);\n        if (x*x + y*y <= radius*radius) return {x, y};   // reject points outside the circle\n    }\n}\nint main() {\n    auto [x, y] = randomPointInCircle(5.0);\n    cout << x << \" \" << y << endl;\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nunsigned int seed = 42;\ndouble simpleRandDouble(double lo, double hi) {\n    seed = seed * 1103515245 + 12345;\n    double frac = (double)((seed / 65536) % 32768) / 32768.0;\n    return lo + frac * (hi - lo);\n}\nint main() {\n    double radius = 5.0;\n    double x, y;\n    while (true) {\n        x = simpleRandDouble(-radius, radius);\n        y = simpleRandDouble(-radius, radius);\n        if (x*x + y*y <= radius*radius) break;\n    }\n    cout << x << \" \" << y << endl;\n}"}}]}, {"num": "41", "title": "Biconnected Component", "techniques": [{"name": "Biconnected Component Identification", "theory": "A biconnected component (BCC) is a maximal subgraph with no articulation point \u2014 removing any single vertex from within it leaves it still connected. Found via a DFS that tracks discovery time and low-link values (the same framework as Bridges/Articulation Points, Section 18), maintaining an edge stack: whenever a back edge or tree edge is processed, it's pushed onto the stack, and whenever the low-link condition low[v] >= disc[u] is detected at an articulation point, all edges above (and including) edge (u,v) are popped off as one completed biconnected component.", "when": "Decomposing a graph into its maximal 'no cut vertex' pieces \u2014 useful for network reliability analysis, and as a preprocessing step for algorithms that need to reason about 2-vertex-connected substructures (e.g. certain planarity or routing algorithms).", "best": "O(V+E)", "avg": "O(V+E)", "worst": "O(V+E)", "space": "O(V+E)", "code": {"py_bi": "graph = {0:[1,2], 1:[0,2], 2:[0,1,3], 3:[2,4], 4:[3]}\nn = 5\ndisc = {}\nlow = {}\ntimer = [0]\nedge_stack = []\nbccs = []\n\ndef dfs(u, parent):\n    disc[u] = low[u] = timer[0]\n    timer[0] += 1                # built-in list-wrapped counter\n    children = 0\n    for v in graph[u]:\n        if v == parent:\n            continue\n        if v not in disc:\n            children += 1\n            edge_stack.append((u, v))\n            dfs(v, u)\n            low[u] = min(low[u], low[v])\n            if (parent == -1 and children > 1) or (parent != -1 and low[v] >= disc[u]):\n                comp = []\n                while edge_stack and edge_stack[-1] != (u, v):\n                    comp.append(edge_stack.pop())\n                comp.append(edge_stack.pop())\n                bccs.append(comp)\n        elif disc[v] < disc[u]:\n            edge_stack.append((u, v))\n            low[u] = min(low[u], disc[v])\n\nfor node in range(n):\n    if node not in disc:\n        dfs(node, -1)\nif edge_stack:\n    bccs.append(edge_stack[:])\nprint(bccs)", "py_scratch": "graph = {0:[1,2], 1:[0,2], 2:[0,1,3], 3:[2,4], 4:[3]}\nn = 5\ndisc = {}\nlow = {}\ntimer_val = [0]\nedge_stack = []\nbccs = []\n\ndef dfs(u, parent):\n    disc[u] = timer_val[0]\n    low[u] = timer_val[0]\n    timer_val[0] = timer_val[0] + 1\n    children = 0\n    for v in graph[u]:\n        if v == parent:\n            continue\n        if v not in disc:\n            children = children + 1\n            edge_stack.append((u, v))\n            dfs(v, u)\n            if low[v] < low[u]:\n                low[u] = low[v]\n            is_articulation = False\n            if parent == -1 and children > 1:\n                is_articulation = True\n            if parent != -1 and low[v] >= disc[u]:\n                is_articulation = True\n            if is_articulation:\n                comp = []\n                while len(edge_stack) > 0 and edge_stack[-1] != (u, v):\n                    comp.append(edge_stack.pop())\n                comp.append(edge_stack.pop())\n                bccs.append(comp)\n        else:\n            if disc[v] < disc[u]:\n                edge_stack.append((u, v))\n                if disc[v] < low[u]:\n                    low[u] = disc[v]\n\nfor node in range(n):\n    if node not in disc:\n        dfs(node, -1)\nif len(edge_stack) > 0:\n    bccs.append(list(edge_stack))\nprint(bccs)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nunordered_map<int, vector<int>> graph = {{0,{1,2}},{1,{0,2}},{2,{0,1,3}},{3,{2,4}},{4,{3}}};\nint n = 5, timer_ = 0;\nvector<int> disc, low;\nvector<bool> visited;\nvector<pair<int,int>> edgeStack;\nvector<vector<pair<int,int>>> bccs;\nvoid dfs(int u, int parent) {\n    visited[u] = true;\n    disc[u] = low[u] = timer_++;\n    int children = 0;\n    for (int v : graph[u]) {\n        if (v == parent) continue;\n        if (!visited[v]) {\n            children++;\n            edgeStack.push_back({u, v});\n            dfs(v, u);\n            low[u] = min(low[u], low[v]);\n            bool isArt = (parent == -1 && children > 1) || (parent != -1 && low[v] >= disc[u]);\n            if (isArt) {\n                vector<pair<int,int>> comp;\n                while (!edgeStack.empty() && edgeStack.back() != make_pair(u,v)) {   // built-in pair comparison\n                    comp.push_back(edgeStack.back()); edgeStack.pop_back();\n                }\n                comp.push_back(edgeStack.back()); edgeStack.pop_back();\n                bccs.push_back(comp);\n            }\n        } else if (disc[v] < disc[u]) {\n            edgeStack.push_back({u, v});\n            low[u] = min(low[u], disc[v]);\n        }\n    }\n}\nint main() {\n    disc.assign(n,0); low.assign(n,0); visited.assign(n,false);\n    for (int node = 0; node < n; node++) if (!visited[node]) dfs(node, -1);\n    if (!edgeStack.empty()) bccs.push_back(edgeStack);\n    for (auto& comp : bccs) { for (auto& e : comp) cout << \"(\" << e.first << \",\" << e.second << \") \"; cout << \"| \"; }\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint graph[5][3] = {{1,2,-1},{0,2,-1},{0,1,3},{2,4,-1},{3,-1,-1}};\nint disc[5], low[5]; bool visited[5] = {false};\nint timerVal = 0;\nint stackU[20], stackV[20]; int stackTop = -1;\nvoid pushEdge(int u, int v) { stackU[++stackTop] = u; stackV[stackTop] = v; }\nvoid dfs(int u, int parent) {\n    visited[u] = true;\n    disc[u] = timerVal;\n    low[u] = timerVal;\n    timerVal++;\n    int children = 0;\n    for (int i = 0; i < 3; i++) {\n        int v = graph[u][i];\n        if (v == -1 || v == parent) continue;\n        if (!visited[v]) {\n            children++;\n            pushEdge(u, v);\n            dfs(v, u);\n            if (low[v] < low[u]) low[u] = low[v];\n            bool isArt = (parent == -1 && children > 1) || (parent != -1 && low[v] >= disc[u]);\n            if (isArt) {\n                cout << \"BCC: \";\n                while (stackTop >= 0 && !(stackU[stackTop]==u && stackV[stackTop]==v)) {\n                    cout << \"(\" << stackU[stackTop] << \",\" << stackV[stackTop] << \") \";\n                    stackTop--;\n                }\n                cout << \"(\" << stackU[stackTop] << \",\" << stackV[stackTop] << \") \";\n                stackTop--;\n                cout << \"| \";\n            }\n        } else if (disc[v] < disc[u]) {\n            pushEdge(u, v);\n            if (disc[v] < low[u]) low[u] = disc[v];\n        }\n    }\n}\nint main() {\n    int n = 5;\n    for (int node = 0; node < n; node++) if (!visited[node]) dfs(node, -1);\n    if (stackTop >= 0) {\n        cout << \"BCC: \";\n        while (stackTop >= 0) { cout << \"(\" << stackU[stackTop] << \",\" << stackV[stackTop] << \") \"; stackTop--; }\n    }\n}"}}, {"name": "Relation to Articulation Points", "theory": "A vertex is an articulation point if and only if it is shared by two or more distinct biconnected components \u2014 this follows directly from the definition: removing a vertex that belongs to only one BCC cannot disconnect the graph (that BCC remains internally connected without it, since a BCC by definition has no cut vertex within itself), but removing a vertex shared by multiple BCCs separates them since it was the only link between them. This gives an alternative way to find articulation points as a byproduct of BCC decomposition, rather than the direct low-link check from Section 18.", "when": "Understanding the structural relationship between articulation points and biconnected components \u2014 useful for building a 'block-cut tree' (a higher-level structure representing how BCCs connect through shared articulation points), used in advanced connectivity analysis.", "best": "O(V+E)", "avg": "O(V+E)", "worst": "O(V+E)", "space": "O(V+E)", "code": {"py_bi": "graph = {0:[1,2], 1:[0,2], 2:[0,1,3], 3:[2,4], 4:[3]}\nn = 5\ndisc, low, timer = {}, {}, [0]\nedge_stack, bccs = [], []\nvertex_bcc_count = {}          # built-in dict tracks how many BCCs each vertex belongs to\n\ndef record_bcc(comp):\n    bccs.append(comp)\n    vertices_in_comp = set()\n    for u, v in comp:\n        vertices_in_comp.add(u)\n        vertices_in_comp.add(v)\n    for v in vertices_in_comp:\n        vertex_bcc_count[v] = vertex_bcc_count.get(v, 0) + 1\n\ndef dfs(u, parent):\n    disc[u] = low[u] = timer[0]\n    timer[0] += 1\n    children = 0\n    for v in graph[u]:\n        if v == parent:\n            continue\n        if v not in disc:\n            children += 1\n            edge_stack.append((u, v))\n            dfs(v, u)\n            low[u] = min(low[u], low[v])\n            if (parent == -1 and children > 1) or (parent != -1 and low[v] >= disc[u]):\n                comp = []\n                while edge_stack and edge_stack[-1] != (u, v):\n                    comp.append(edge_stack.pop())\n                comp.append(edge_stack.pop())\n                record_bcc(comp)\n        elif disc[v] < disc[u]:\n            edge_stack.append((u, v))\n            low[u] = min(low[u], disc[v])\n\nfor node in range(n):\n    if node not in disc:\n        dfs(node, -1)\nif edge_stack:\n    record_bcc(edge_stack[:])\n\narticulation_points = [v for v, count in vertex_bcc_count.items() if count > 1]\nprint(articulation_points)", "py_scratch": "graph = {0:[1,2], 1:[0,2], 2:[0,1,3], 3:[2,4], 4:[3]}\nn = 5\ndisc, low, timer_val = {}, {}, [0]\nedge_stack, bccs = [], []\nvertex_bcc_count = {}\n\ndef record_bcc(comp):\n    bccs.append(comp)\n    vertices_in_comp = {}\n    for edge in comp:\n        u, v = edge\n        vertices_in_comp[u] = True\n        vertices_in_comp[v] = True\n    for v in vertices_in_comp:\n        if v in vertex_bcc_count:\n            vertex_bcc_count[v] = vertex_bcc_count[v] + 1\n        else:\n            vertex_bcc_count[v] = 1\n\ndef dfs(u, parent):\n    disc[u] = timer_val[0]\n    low[u] = timer_val[0]\n    timer_val[0] = timer_val[0] + 1\n    children = 0\n    for v in graph[u]:\n        if v == parent:\n            continue\n        if v not in disc:\n            children = children + 1\n            edge_stack.append((u, v))\n            dfs(v, u)\n            if low[v] < low[u]:\n                low[u] = low[v]\n            is_art = False\n            if parent == -1 and children > 1:\n                is_art = True\n            if parent != -1 and low[v] >= disc[u]:\n                is_art = True\n            if is_art:\n                comp = []\n                while len(edge_stack) > 0 and edge_stack[-1] != (u, v):\n                    comp.append(edge_stack.pop())\n                comp.append(edge_stack.pop())\n                record_bcc(comp)\n        else:\n            if disc[v] < disc[u]:\n                edge_stack.append((u, v))\n                if disc[v] < low[u]:\n                    low[u] = disc[v]\n\nfor node in range(n):\n    if node not in disc:\n        dfs(node, -1)\nif len(edge_stack) > 0:\n    record_bcc(list(edge_stack))\n\narticulation_points = []\nfor v in vertex_bcc_count:\n    if vertex_bcc_count[v] > 1:\n        articulation_points.append(v)\nprint(articulation_points)", "cpp_bi": "#include <bits/stdc++.h>\nusing namespace std;\nunordered_map<int, vector<int>> graph = {{0,{1,2}},{1,{0,2}},{2,{0,1,3}},{3,{2,4}},{4,{3}}};\nint n = 5, timer_ = 0;\nvector<int> disc, low;\nvector<bool> visited;\nvector<pair<int,int>> edgeStack;\nunordered_map<int,int> vertexBccCount;   // built-in map tracks BCC membership count\nvoid recordBCC(vector<pair<int,int>>& comp) {\n    set<int> vertices;\n    for (auto& [u,v] : comp) { vertices.insert(u); vertices.insert(v); }\n    for (int v : vertices) vertexBccCount[v]++;\n}\nvoid dfs(int u, int parent) {\n    visited[u] = true;\n    disc[u] = low[u] = timer_++;\n    int children = 0;\n    for (int v : graph[u]) {\n        if (v == parent) continue;\n        if (!visited[v]) {\n            children++;\n            edgeStack.push_back({u, v});\n            dfs(v, u);\n            low[u] = min(low[u], low[v]);\n            bool isArt = (parent == -1 && children > 1) || (parent != -1 && low[v] >= disc[u]);\n            if (isArt) {\n                vector<pair<int,int>> comp;\n                while (!edgeStack.empty() && edgeStack.back() != make_pair(u,v)) {\n                    comp.push_back(edgeStack.back()); edgeStack.pop_back();\n                }\n                comp.push_back(edgeStack.back()); edgeStack.pop_back();\n                recordBCC(comp);\n            }\n        } else if (disc[v] < disc[u]) {\n            edgeStack.push_back({u, v});\n            low[u] = min(low[u], disc[v]);\n        }\n    }\n}\nint main() {\n    disc.assign(n,0); low.assign(n,0); visited.assign(n,false);\n    for (int node = 0; node < n; node++) if (!visited[node]) dfs(node, -1);\n    if (!edgeStack.empty()) recordBCC(edgeStack);\n    for (auto& [v, count] : vertexBccCount) if (count > 1) cout << v << \" \";\n}", "cpp_scratch": "#include <iostream>\nusing namespace std;\nint graph[5][3] = {{1,2,-1},{0,2,-1},{0,1,3},{2,4,-1},{3,-1,-1}};\nint disc[5], low[5]; bool visited[5] = {false};\nint timerVal = 0;\nint stackU[20], stackV[20]; int stackTop = -1;\nint bccCount[5] = {0};\nvoid pushEdge(int u, int v) { stackU[++stackTop] = u; stackV[stackTop] = v; }\nvoid recordBCC(int startIdx) {\n    bool seen[5] = {false};\n    for (int i = startIdx; i <= stackTop; i++) {\n        if (!seen[stackU[i]]) { seen[stackU[i]] = true; bccCount[stackU[i]]++; }\n        if (!seen[stackV[i]]) { seen[stackV[i]] = true; bccCount[stackV[i]]++; }\n    }\n}\nvoid dfs(int u, int parent) {\n    visited[u] = true;\n    disc[u] = timerVal;\n    low[u] = timerVal;\n    timerVal++;\n    int children = 0;\n    for (int i = 0; i < 3; i++) {\n        int v = graph[u][i];\n        if (v == -1 || v == parent) continue;\n        if (!visited[v]) {\n            children++;\n            int compStart = stackTop + 1;\n            pushEdge(u, v);\n            dfs(v, u);\n            if (low[v] < low[u]) low[u] = low[v];\n            bool isArt = (parent == -1 && children > 1) || (parent != -1 && low[v] >= disc[u]);\n            if (isArt) {\n                recordBCC(compStart);\n                stackTop = compStart - 1;\n            }\n        } else if (disc[v] < d const nav = document.getElementById('nav');
const main = document.getElementById('main');
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
const resultCount = document.getElementById('result-count');
const LABELS = [["py_bi","Python (built-in)"],["py_scratch","Python (scratch)"],["cpp_bi","C++ (built-in)"],["cpp_scratch","C++ (scratch)"]];

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

DATA.sections.forEach(s=>{
  const a = document.createElement('a');
  a.href = '#sec-' + s.num;
  a.innerHTML = `<span class="n">${s.num}.</span>${esc(s.title)}`;
  nav.appendChild(a);
});

DATA.sections.forEach(s=>{
  const sec = document.createElement('section');
  sec.className = 'chapter'; sec.id = 'sec-' + s.num;
  let html = `<h2 class="section-title">${s.num}. ${esc(s.title)}</h2>`;
  s.techniques.forEach((t, ti)=>{
    const uid = s.num + '-' + ti;
    const searchBlob = (t.name + ' ' + t.theory + ' ' + t.when).toLowerCase();
    html += `<div class="tech" data-blob="${esc(searchBlob)}">
      <h3>${esc(t.name)}</h3>
      <div class="theory">${esc(t.theory)}</div>
      <div class="when"><b>When to use:</b> ${esc(t.when)}</div>
      <div class="complexity">
        <span>Best: ${esc(t.best)}</span><span>Avg: ${esc(t.avg)}</span>
        <span>Worst: ${esc(t.worst)}</span><span>Space: ${esc(t.space)}</span>
      </div>
      <div class="tabs">`;
    const techLabels = t.labels || LABELS;
    techLabels.forEach(([key,label], i)=>{
      html += `<button class="tab-btn${i===0?' active':''}" onclick="showTab('${uid}','${key}',this)">${label}</button>`;
    });
    html += `</div>`;
    techLabels.forEach(([key,label], i)=>{
      html += `<pre class="code-pane${i===0?' active':''}" id="code-${uid}-${key}">${esc(t.code[key])}</pre>`;
    });
    html += `</div>`;
  });
  sec.innerHTML = html;
  main.appendChild(sec);
});

function showTab(uid, key, btn){
  const container = btn.closest('.tech');
  container.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  container.querySelectorAll('.code-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('code-'+uid+'-'+key).classList.add('active');
}

const allTechs = Array.from(document.querySelectorAll('.tech'));
const allChapters = Array.from(document.querySelectorAll('section.chapter'));

function runSearch(){
  const q = search.value.trim().toLowerCase();
  let visible = 0;
  allTechs.forEach(t=>{
    const match = !q || t.dataset.blob.includes(q);
    t.classList.toggle('hidden', !match);
    if(match) visible++;
  });
  allChapters.forEach(ch=>{
    const anyVisible = ch.querySelectorAll('.tech:not(.hidden)').length > 0;
    ch.classList.toggle('hidden', !anyVisible);
  });
  noResults.classList.toggle('show', q && visible===0);
  resultCount.textContent = q ? `${visible} technique${visible===1?'':'s'} found` : '';
}
search.addEventListener('input', runSearch);


// === Enhanced interactions ===
const toggle=document.getElementById('menuToggle');
const sideNav=document.getElementById('nav');
if(toggle){toggle.onclick=()=>sideNav.classList.toggle('open');}
const observer=new IntersectionObserver(entries=>{
 entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show');});
},{threshold:.12});
document.querySelectorAll('section.chapter,.tech').forEach(el=>observer.observe(el));
const links=()=>document.querySelectorAll('#nav a');
window.addEventListener('scroll',()=>{
 const secs=[...document.querySelectorAll('section.chapter')];
 let current='';
 secs.forEach(sec=>{if(scrollY>=sec.offsetTop-120)current=sec.id;});
 links().forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+current));
});
document.addEventListener('click',e=>{
 if(e.target.closest('#nav a')&&window.innerWidth<=820){sideNav.classList.remove('open');}
});


const EASY=["Traversal","1D Prefix Sum","2D Prefix Sum","1D Difference Array","2D Difference Array","Kadane's Algorithm","Circular Kadane","Boyer–Moore Voting Algorithm","Dutch National Flag Algorithm","Coordinate Compression","Array Rotation","Frequency Counting","Two Pointers on Strings","Hashing (Strings)"];
const MEDIUM=["Fixed Size Window (Strings)","Variable Size Window (Strings)","Rolling Hash","Polynomial Hashing","Rabin–Karp","Prefix Function (LPS)"];
const HARD=["KMP","Trie","Segment Tree","Fenwick Tree","Heavy Light","DP on Trees","SCC"];
document.addEventListener("DOMContentLoaded",()=>{
 document.querySelectorAll(".tech").forEach(card=>{
   const h=card.querySelector("h3");
   if(!h) return;
   const name=h.textContent.trim();
   let txt="Medium", cls="medium";
   if(EASY.includes(name)){txt="Easy";cls="easy";}
   else if(HARD.some(v=>name.includes(v))){txt="Hard";cls="hard";}
   const b=document.createElement("span");
   b.className="diff-badge "+cls;
   b.textContent=txt;
   card.appendChild(b);
 });
});
